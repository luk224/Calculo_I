  <figcaption>Interactivo propio. <b>Nodos libres:</b> arrastra los puntos azules y el polinomio interpolador (naranja) pasa siempre por todos; al subir el número de nodos oscila más entre ellos. <b>Runge:</b> con la función $\frac1{1+25x^2}$ (gris, discontinua) y nodos equiespaciados, aumentar $n$ <i>empeora</i> el error cerca de los extremos (con 11 nodos el error máximo es $\approx1{,}92$); con los nodos de Chebyshev el error baja (con 11 nodos, $\approx0{,}11$). Es la razón de que el factor $(x-x_0)\cdots(x-x_n)$ del error de Lagrange importe tanto como la derivada. <span class="src" data-l="P" data-ref="Explicación propia; polinomio interpolador y diferencias divididas: U §3.3 pp. 120-124; error de Lagrange: material propio, ver apartado 4">P</span></figcaption>
</figure>
