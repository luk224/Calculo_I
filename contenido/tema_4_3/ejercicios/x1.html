<p class="enun">Calcule el gradiente en $(2,3)$ de la función dada por $f(x,y)=\ln(xy)$.</p>
  <p>Mismo problema que <a href="#ej-4-31">E 4.31</a>: $\nabla f(2,3)=\big(\frac12,\frac13\big)$.</p>
  <div class="box tip"><span class="h">En el examen escribe</span><p>«$f_x=\frac1{xy}\cdot y=\frac1x$, $f_y=\frac1{xy}\cdot x=\frac1y$; $\nabla f(2,3)=(\frac12,\frac13)$.»</p></div>
