<p class="enun">Indica la dirección de máximo crecimiento en $(1,1)$ de $f(x,y)=\frac{x^2}{x^2+y^2}$ si $(x,y)\ne(0,0)$, $f(0,0)=0$. a) $\big(\frac{\sqrt2}2,-\frac{\sqrt2}2\big)$ b) $\big(\frac{\sqrt2}2,\frac{\sqrt2}2\big)$ c) $\big(-\frac{\sqrt2}2,-\frac{\sqrt2}2\big)$ d) Ninguna de las anteriores.</p>
