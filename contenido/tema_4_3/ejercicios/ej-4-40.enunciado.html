<p class="enun">De una función de tres variables $f$ se sabe que tiene derivadas parciales continuas en todo $\mathbb R^3$ y que $\nabla f(1,\pi,\sqrt7)=(\sqrt8,3,\sqrt5)$. ¿Es cierto que su derivada direccional en la dirección de $(\sqrt2,3,\sqrt5)$ en el punto $(1,\pi,\sqrt7)$ es menor que $\pi$?</p>
