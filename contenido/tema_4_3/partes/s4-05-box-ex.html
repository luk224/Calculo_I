<div class="box ex"><span class="h">Ejemplo 4.29 de U</span>
  <p>$f(x,y)=x^2y+y^3$, $v=\big(\frac1{\sqrt2},\frac1{\sqrt2}\big)$, en $(1,0)$. $\nabla f=(2xy,\ x^2+3y^2)$, así que $\nabla f(1,0)=(0,1)$ y $D_vf(1,0)=(0,1)\cdot\big(\frac1{\sqrt2},\frac1{\sqrt2}\big)=\frac1{\sqrt2}$.</p>
