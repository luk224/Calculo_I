  <img class="int-static" src="../assets/img/int_gradiente.png" alt="Interactivo 3D: gradiente, curva de nivel y derivada direccional en una dirección elegida">
  <figcaption>Interactivo propio. Arrastra para girar. En el suelo, la línea verde es la curva de nivel que pasa por $(a,b)$, la flecha naranja es la dirección del gradiente $\nabla f(a,b)$ (su longitud no está a escala: el valor sale debajo) y la flecha azul es la dirección $v$ que eliges con el ángulo. El plano azul contiene a $v$; su corte con la superficie es la curva azul y la tangente a esa curva tiene pendiente $D_vf(a,b)=\nabla f\cdot v$. Gira $v$: la pendiente es máxima cuando $v$ apunta como el gradiente (y vale $\|\nabla f\|$), es $0$ cuando $v$ es tangente a la curva de nivel (el gradiente es perpendicular a ella) y es mínima en la dirección opuesta. Prueba el Ejemplo 4.29: $x^2y+y^3$ en $(1,0)$ con $45^\circ$ da $\frac1{\sqrt2}\approx0{,}707$. <span class="src" data-l="P" data-ref="Explicación propia; derivada direccional y gradiente: U Teoremas 4.2 y 4.3 pp. 180-182, Propiedad 4.1">P</span></figcaption>
</figure>
