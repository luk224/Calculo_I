<div class="box ex"><span class="h">Ejemplo 4.28 de U</span>
  <p>Si $f$ tiene derivadas primeras continuas y $\frac{\partial^2f}{\partial y\partial x}=\operatorname{sen}(xy)$ (continua), por Schwarz (con los papeles de $x$ e $y$ intercambiados) $\frac{\partial^2f}{\partial x\partial y}(0,1)=\operatorname{sen}(0\cdot1)=0$.</p>
  <span class="src" data-l="U" data-ref="U Ejemplo 4.28, p. 178">U p.178</span>
</div>
