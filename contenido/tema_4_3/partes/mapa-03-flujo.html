<svg class="flujo" viewBox="0 0 600 606" role="img" aria-labelledby="flujo-t flujo-d">
<title id="flujo-t">Mapa de decisión del tema 4.3: qué hacer según lo que piden sobre derivadas de una función de varias variables</title>
<desc id="flujo-d">Diagrama de flujo vertical. Si piden parciales o gradiente, se deriva respecto de cada variable con las demás fijas y se reúnen en un vector. Si la función es a trozos en el punto, se usa la definición. Si piden la Hessiana, se calculan las segundas y se ordenan en una tabla. Si piden la derivada direccional, se normaliza el vector y se hace el producto escalar con el gradiente. Si piden máximo crecimiento o puntos críticos, se usa el gradiente normalizado o se resuelve gradiente igual a cero. Al final se comprueba la respuesta.</desc>
<defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="preg" x="10" y="10" width="210" height="76" rx="10"/>
<text x="115" y="44" text-anchor="middle">¿Piden parciales o el</text>
<text x="115" y="62" text-anchor="middle">gradiente en un punto?</text>
<path class="lin" d="M220 48 H246" marker-end="url(#fl)"/>
<text class="si" x="225" y="43">sí</text>
<rect class="nodo" x="250" y="10" width="340" height="76" rx="10"/>
<text x="420" y="36" text-anchor="middle">Derivo respecto de cada variable con las otras fijas</text>
<text x="420" y="54" text-anchor="middle">(cadena, producto, cociente). Sustituyo el punto al final.</text>
<text x="420" y="72" text-anchor="middle">Gradiente = vector de parciales, en orden.</text>
<path class="lin" d="M115 86 V109" marker-end="url(#fl)"/>
<text class="no" x="123" y="102">no</text>
<rect class="preg" x="10" y="112" width="210" height="76" rx="10"/>
<text x="115" y="146" text-anchor="middle">¿La función es a trozos y</text>
<text x="115" y="164" text-anchor="middle">el punto es el del empalme?</text>
<path class="lin" d="M220 150 H246" marker-end="url(#fl)"/>
<text class="si" x="225" y="145">sí</text>
<rect class="nodo" x="250" y="112" width="340" height="76" rx="10"/>
<text x="420" y="138" text-anchor="middle">La fórmula no vale allí: uso la definición,</text>
<text x="420" y="156" text-anchor="middle">límite de [f(a+h,b)-f(a,b)]/h mirando los ejes.</text>
<text x="420" y="174" text-anchor="middle">Tener parciales no da continuidad.</text>
<path class="lin" d="M115 188 V211" marker-end="url(#fl)"/>
<text class="no" x="123" y="204">no</text>
<rect class="preg" x="10" y="214" width="210" height="76" rx="10"/>
<text x="115" y="248" text-anchor="middle">¿Piden la Hessiana o</text>
<text x="115" y="266" text-anchor="middle">una derivada segunda?</text>
<path class="lin" d="M220 252 H246" marker-end="url(#fl)"/>
<text class="si" x="225" y="247">sí</text>
<rect class="nodo" x="250" y="214" width="340" height="76" rx="10"/>
<text x="420" y="240" text-anchor="middle">Primeras, luego segundas; las dos cruzadas</text>
<text x="420" y="258" text-anchor="middle">sirven de comprobación (Schwarz).</text>
<text x="420" y="276" text-anchor="middle">Tabla n×n: con tres variables, 3×3.</text>
<path class="lin" d="M115 290 V313" marker-end="url(#fl)"/>
<text class="no" x="123" y="306">no</text>
<rect class="preg" x="10" y="316" width="210" height="76" rx="10"/>
<text x="115" y="350" text-anchor="middle">¿Piden la derivada</text>
<text x="115" y="368" text-anchor="middle">direccional?</text>
<path class="lin" d="M220 354 H246" marker-end="url(#fl)"/>
<text class="si" x="225" y="349">sí</text>
<rect class="nodo" x="250" y="316" width="340" height="76" rx="10"/>
<text x="420" y="342" text-anchor="middle">Normalizo v (norma 1). Con parciales continuas:</text>
<text x="420" y="360" text-anchor="middle">D_v f = ∇f · v. Si no lo son o es un punto especial,</text>
<text x="420" y="378" text-anchor="middle">uso la definición con h→0.</text>
<path class="lin" d="M115 392 V415" marker-end="url(#fl)"/>
<text class="no" x="123" y="408">no</text>
<rect class="preg" x="10" y="418" width="210" height="76" rx="10"/>
<text x="115" y="452" text-anchor="middle">¿Piden máximo crecimiento</text>
<text x="115" y="470" text-anchor="middle">o puntos críticos?</text>
<path class="lin" d="M220 456 H246" marker-end="url(#fl)"/>
<text class="si" x="225" y="451">sí</text>
<rect class="nodo" x="250" y="418" width="340" height="76" rx="10"/>
<text x="420" y="444" text-anchor="middle">Máximo: dirección ∇f/‖∇f‖ con valor ‖∇f‖;</text>
<text x="420" y="462" text-anchor="middle">mínimo, la opuesta. Críticos: ∇f = 0, factorizo</text>
<text x="420" y="480" text-anchor="middle">y separo casos (nunca divido por x o y).</text>
<path class="lin" d="M115 494 V517" marker-end="url(#fl)"/>
<text class="no" x="123" y="510">no</text>
<rect class="fin" x="10" y="520" width="580" height="76" rx="10"/>
<text x="300" y="546" text-anchor="middle">Respondo con el vector o la matriz completa y su valor.</text>
<text x="300" y="564" text-anchor="middle">Compruebo: ¿normalicé v?, ¿cruzadas iguales?,</text>
<text x="300" y="582" text-anchor="middle">¿D_v f ≤ ‖∇f‖?, ¿todas las componentes de ∇f son 0?</text>
</svg>
