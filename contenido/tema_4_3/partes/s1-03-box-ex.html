<div class="box ex"><span class="h">Ejemplo 4.22 de U · por definición, $g(x,y)=xy$ en $(1,2)$</span>
  <p>$\dfrac{\partial g}{\partial x}(1,2)=\lim_{h\to0}\dfrac{(1+h)\cdot2-1\cdot2}{h}=\lim_{h\to0}\dfrac{2h}{h}=2$ y $\dfrac{\partial g}{\partial y}(1,2)=\lim_{h\to0}\dfrac{1\cdot(2+h)-2}{h}=1$.</p>
