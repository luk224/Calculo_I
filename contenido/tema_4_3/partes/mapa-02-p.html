<p>Léelo de arriba abajo: en cada pregunta, «no» baja a la siguiente y «sí» te lleva a la acción de la derecha. Lo que más puntos se pierde: <b>no normalizar</b> el vector de la direccional, usar la <b>fórmula de las reglas en un punto de empalme</b> y dar el gradiente como un número o una suma.</p>
