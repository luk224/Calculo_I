  <figcaption>Interactivo propio. Arrastra para girar. El plano naranja es $y=b$: corta la superficie en la curva naranja, y la recta tangente a esa curva en el punto negro tiene pendiente $\frac{\partial f}{\partial x}(a,b)$. El plano verde es $x=a$ y da la curva verde, cuya tangente tiene pendiente $\frac{\partial f}{\partial y}(a,b)$. Mueve $a$ y $b$ y compara con los valores de abajo (en la silla $x^2-y^2$, $\frac{\partial f}{\partial x}=2x$ y $\frac{\partial f}{\partial y}=-2y$ tienen signos opuestos para $x,y&gt;0$). <span class="src" data-l="P" data-ref="Explicación propia; interpretación geométrica: U §4.3.2 p. 169, Fig. 4.15">P</span></figcaption>
