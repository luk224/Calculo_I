<div class="box ex"><span class="h">Ejemplo 8 (U Ej. 2.14): $\lim_{n\to\infty}\dfrac{\ln n}{n}$</span>
  <p>La función asociada es $f(x)=\frac{\ln x}{x}$, de tipo $\tfrac\infty\infty$; por L'Hôpital, $\lim_{x\to\infty}\frac{\ln x}{x}=\lim_{x\to\infty}\frac{1/x}{1}=0$. Por la Prop. 2.3, $\lim_n\frac{\ln n}{n}=0$.</p>
  <span class="src" data-l="U" data-ref="U Ejemplo 2.14, p. 85">U p.85</span>
</div>
