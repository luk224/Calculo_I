<ul class="trio">
  <li><b>Cómo lo reconoces:</b> un factor tiende a $0$ y el otro a $\pm\infty$.</li>
  <li><b>Qué haces:</b> pasas uno al denominador como su inverso, $fg=\dfrac f{1/g}$, y queda $\tfrac00$ o $\tfrac\infty\infty$.</li>
  <li><b>Ejemplo mínimo:</b> $x\ln x=\dfrac{\ln x}{1/x}$, de tipo $\tfrac\infty\infty$ cuando $x\to0^+$.</li>
</ul>
