<div class="box warn"><span class="h">Error típico 4: olvidar deshacer el logaritmo</span>
  <p>Tras calcular $L$, el límite pedido es $e^{L}$, no $L$. U lo avisa expresamente: «un error típico es olvidar que aplicamos logaritmos y dar como valor del límite $0$ en lugar de $1$». (Con $x^{1/x}$, $L=0$ y el límite es $e^0=1$.)</p>
  <span class="src" data-l="U" data-ref="U recuadro «Ojo», p. 85">U p.85</span>
</div>
