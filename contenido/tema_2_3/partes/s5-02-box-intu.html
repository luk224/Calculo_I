<div class="box intu"><span class="h">Idea intuitiva</span>
  <p>Una sucesión $a_n$ solo está definida para $n=1,2,3,\dots$; no se puede «derivar respecto de $n$». Pero si $a_n=f(n)$ para una función $f$ de variable real, y $f(x)$ tiene límite cuando $x\to\infty$, la sucesión, que es como «mirar $f$ solo en los enteros», tiene el mismo límite.</p>
</div>
