<svg class="flujo" viewBox="0 0 460 764" role="img" aria-labelledby="flujo-t flujo-d">
<title id="flujo-t">Mapa de decisión para un límite con L'Hôpital</title>
<desc id="flujo-d">Diagrama de flujo vertical. Se sustituye; si es una sucesión se cambia n por x; si el resultado está determinado no se hace nada más que decidir el signo; el producto 0 por infinito se pasa a cociente; la resta infinito menos infinito se opera; las potencias se escriben como exponencial; al quedar 0/0 o infinito/infinito se prueba álgebra o dividir por el dominante y, si no basta, se aplica L'Hôpital tras comprobar las condiciones. Si el límite de f'/g' no existe, la regla no concluye.</desc>
<defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="nodo" x="10" y="10" width="200" height="44" rx="10"/><text x="110" y="28" text-anchor="middle">Sustituyo el valor al que</text><text x="110" y="46" text-anchor="middle">tiende x (o cada pieza)</text>
<path class="lin" d="M110 54 V77" marker-end="url(#fl)"/>
<rect class="preg" x="10" y="80" width="200" height="44" rx="10"/><text x="110" y="107" text-anchor="middle">¿Es una sucesión (n)?</text>
<path class="lin" d="M210 102 H246" marker-end="url(#fl)"/><text class="si" x="215" y="97">sí</text>
<rect class="nodo" x="250" y="80" width="200" height="44" rx="10"/><text x="350" y="98" text-anchor="middle">Cambio n por x real y</text><text x="350" y="116" text-anchor="middle">sigo con f(x) ↓</text>
<path class="lin" d="M110 124 V147" marker-end="url(#fl)"/><text class="no" x="118" y="140">no</text>
<rect class="preg" x="10" y="150" width="200" height="44" rx="10"/><text x="110" y="177" text-anchor="middle">¿Sale c/0, c/∞, ∞+∞ …?</text>
<path class="lin" d="M210 172 H246" marker-end="url(#fl)"/><text class="si" x="215" y="167">sí</text>
<rect class="nada" x="250" y="150" width="200" height="44" rx="10"/><text x="350" y="168" text-anchor="middle">Determinado: miro el</text><text x="350" y="186" text-anchor="middle">signo. Sin L'Hôpital.</text>
<path class="lin" d="M110 194 V217" marker-end="url(#fl)"/><text class="no" x="118" y="210">no</text>
<rect class="preg" x="10" y="220" width="200" height="44" rx="10"/><text x="110" y="247" text-anchor="middle">¿Es 0·∞?</text>
<path class="lin" d="M210 242 H246" marker-end="url(#fl)"/><text class="si" x="215" y="237">sí</text>
<rect class="nodo" x="250" y="220" width="200" height="44" rx="10"/><text x="350" y="238" text-anchor="middle">Paso a cociente</text><text x="350" y="256" text-anchor="middle">f/(1/g) y sigo ↓</text>
<path class="lin" d="M110 264 V287" marker-end="url(#fl)"/><text class="no" x="118" y="280">no</text>
<rect class="preg" x="10" y="290" width="200" height="44" rx="10"/><text x="110" y="317" text-anchor="middle">¿Es ∞−∞?</text>
<path class="lin" d="M210 312 H246" marker-end="url(#fl)"/><text class="si" x="215" y="307">sí</text>
<rect class="nodo" x="250" y="290" width="200" height="44" rx="10"/><text x="350" y="308" text-anchor="middle">Hago la resta (denom.</text><text x="350" y="326" text-anchor="middle">común…) y sigo ↓</text>
<path class="lin" d="M110 334 V357" marker-end="url(#fl)"/><text class="no" x="118" y="350">no</text>
<rect class="preg" x="10" y="360" width="200" height="44" rx="10"/><text x="110" y="387" text-anchor="middle">¿Es 1^∞, 0^0 o ∞^0?</text>
<path class="lin" d="M210 382 H246" marker-end="url(#fl)"/><text class="si" x="215" y="377">sí</text>
<rect class="nodo" x="250" y="360" width="200" height="44" rx="10"/><text x="350" y="378" text-anchor="middle">f^g = e^(g·ln f); calculo</text><text x="350" y="396" text-anchor="middle">el exponente; vuelvo e^L</text>
<path class="lin" d="M110 404 V427" marker-end="url(#fl)"/><text class="no" x="118" y="420">no</text>
<rect class="nodo" x="10" y="430" width="200" height="44" rx="10"/><text x="110" y="457" text-anchor="middle">Queda 0/0 o ∞/∞</text>
<path class="lin" d="M110 474 V497" marker-end="url(#fl)"/>
<rect class="preg" x="10" y="500" width="200" height="44" rx="10"/><text x="110" y="518" text-anchor="middle">¿Lo resuelve el álgebra o</text><text x="110" y="536" text-anchor="middle">dividir por el dominante?</text>
<path class="lin" d="M210 522 H246" marker-end="url(#fl)"/><text class="si" x="215" y="517">sí</text>
<rect class="fin" x="250" y="500" width="200" height="44" rx="10"/><text x="350" y="527" text-anchor="middle">Hecho sin derivar</text>
<path class="lin" d="M110 544 V567" marker-end="url(#fl)"/><text class="no" x="118" y="560">no</text>
<rect class="nodo" x="10" y="570" width="200" height="44" rx="10"/><text x="110" y="588" text-anchor="middle">L'Hôpital: compruebo las</text><text x="110" y="606" text-anchor="middle">3 condiciones y derivo</text>
<path class="lin" d="M110 614 V637" marker-end="url(#fl)"/>
<rect class="preg" x="10" y="640" width="200" height="44" rx="10"/><text x="110" y="667" text-anchor="middle">¿Existe el límite de f'/g'?</text>
<path class="lin" d="M210 662 H246" marker-end="url(#fl)"/><text class="si" x="215" y="657">sí</text>
<rect class="fin" x="250" y="640" width="200" height="44" rx="10"/><text x="350" y="667" text-anchor="middle">Ese es el límite pedido</text>
<path class="lin" d="M110 684 V707" marker-end="url(#fl)"/><text class="no" x="118" y="700">no</text>
<rect class="nada" x="10" y="710" width="200" height="44" rx="10"/><text x="110" y="728" text-anchor="middle">La regla no concluye:</text><text x="110" y="746" text-anchor="middle">otro método</text>
</svg>
