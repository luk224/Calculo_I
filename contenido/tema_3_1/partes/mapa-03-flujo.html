<svg class="flujo" viewBox="0 0 600 708" role="img" aria-labelledby="flujo-t flujo-d">
<title id="flujo-t">Mapa de decisión: qué hago según lo que me piden en Taylor</title>
<desc id="flujo-d">Diagrama de flujo vertical. Si piden derivadas sucesivas, se derivan por etapas y en los puntos de unión se usa la definición con límites laterales. Si piden un polinomio de Taylor, se usan desarrollos conocidos o la tabla de derivadas. Si dan el polinomio y piden derivadas, el coeficiente de la potencia k es la derivada k-ésima dividida entre k factorial. Si piden un valor con error, el orden o los valores de x, se usa el resto de Lagrange con el caso peor. Si piden un límite 0/0, se usa la forma de Peano. Antes de aplicar nada se comprueba que existen y son continuas las derivadas necesarias; si no, el teorema no se puede aplicar.</desc>
<defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="preg" x="10" y="10" width="210" height="76" rx="10"/><text x="115" y="44" text-anchor="middle">¿Piden derivadas f′, f″… o</text><text x="115" y="62" text-anchor="middle">si existen en un punto?</text>
<path class="lin" d="M220 48 H246" marker-end="url(#fl)"/>
<text class="si" x="225" y="43">sí</text>
<rect class="nodo" x="250" y="10" width="340" height="76" rx="10"/><text x="420" y="28" text-anchor="middle">Derivo por etapas y simplifico cada una.</text><text x="420" y="44" text-anchor="middle">En un punto de unión: primero miro la</text><text x="420" y="62" text-anchor="middle">continuidad y uso la definición con</text><text x="420" y="78" text-anchor="middle">límites laterales (para f″, aplicada a f′)</text>
<path class="lin" d="M115 86 V109" marker-end="url(#fl)"/>
<text class="no" x="123" y="102">no</text>
<rect class="preg" x="10" y="112" width="210" height="76" rx="10"/><text x="115" y="146" text-anchor="middle">¿Piden un polinomio de</text><text x="115" y="164" text-anchor="middle">Taylor (o recentrar uno)?</text>
<path class="lin" d="M220 150 H246" marker-end="url(#fl)"/>
<text class="si" x="225" y="145">sí</text>
<rect class="nodo" x="250" y="112" width="340" height="76" rx="10"/><text x="420" y="130" text-anchor="middle">Si f sale de eˣ, sen, cos o ln(1+x): sustituyo,</text><text x="420" y="146" text-anchor="middle">sumo o multiplico desarrollos y trunco.</text><text x="420" y="164" text-anchor="middle">Si no: tabla k, derivada k-ésima en x₀, ÷ k!</text><text x="420" y="180" text-anchor="middle">(simplifico cada derivada antes de seguir)</text>
<path class="lin" d="M115 188 V211" marker-end="url(#fl)"/>
<text class="no" x="123" y="204">no</text>
<rect class="preg" x="10" y="214" width="210" height="76" rx="10"/><text x="115" y="240" text-anchor="middle">¿Dan el polinomio y piden</text><text x="115" y="257" text-anchor="middle">derivadas, o si «puede ser»</text><text x="115" y="274" text-anchor="middle">el de Taylor de f?</text>
<path class="lin" d="M220 252 H246" marker-end="url(#fl)"/>
<text class="si" x="225" y="247">sí</text>
<rect class="nodo" x="250" y="214" width="340" height="76" rx="10"/><text x="420" y="232" text-anchor="middle">El coeficiente de (x − x₀)^k es la derivada</text><text x="420" y="248" text-anchor="middle">k-ésima en x₀ dividida entre k!. Así que:</text><text x="420" y="266" text-anchor="middle">derivada = coeficiente · k!. Para «puede ser»</text><text x="420" y="282" text-anchor="middle">comparo solo los coeficientes que conozco</text>
<path class="lin" d="M115 290 V313" marker-end="url(#fl)"/>
<text class="no" x="123" y="306">no</text>
<rect class="preg" x="10" y="316" width="210" height="76" rx="10"/><text x="115" y="342" text-anchor="middle">¿Piden un valor aproximado,</text><text x="115" y="359" text-anchor="middle">un error, el orden n o los</text><text x="115" y="376" text-anchor="middle">x donde vale?</text>
<path class="lin" d="M220 354 H246" marker-end="url(#fl)"/>
<text class="si" x="225" y="349">sí</text>
<rect class="nodo" x="250" y="316" width="340" height="76" rx="10"/><text x="420" y="334" text-anchor="middle">Resto de Lagrange con c entre x₀ y x: caso</text><text x="420" y="350" text-anchor="middle">peor de la derivada n+1 → cota M. Pruebo</text><text x="420" y="368" text-anchor="middle">n = 0, 1, 2… o despejo |x − x₀|. Si</text><text x="420" y="384" text-anchor="middle">p_n = p_(n+1), uso el resto R_(n+1)</text>
<path class="lin" d="M115 392 V415" marker-end="url(#fl)"/>
<text class="no" x="123" y="408">no</text>
<rect class="preg" x="10" y="418" width="210" height="76" rx="10"/><text x="115" y="452" text-anchor="middle">¿Piden un límite 0/0 con</text><text x="115" y="470" text-anchor="middle">sen, cos, eˣ, ln(1+x)…?</text>
<path class="lin" d="M220 456 H246" marker-end="url(#fl)"/>
<text class="si" x="225" y="451">sí</text>
<rect class="nodo" x="250" y="418" width="340" height="76" rx="10"/><text x="420" y="436" text-anchor="middle">Peano: desarrollo hasta la potencia x^m del</text><text x="420" y="452" text-anchor="middle">denominador con o(x^m), sustituyo y me</text><text x="420" y="470" text-anchor="middle">quedo con el primer término no nulo del</text><text x="420" y="486" text-anchor="middle">numerador; el límite sale de los exponentes</text>
<path class="lin" d="M115 494 V517" marker-end="url(#fl)"/>
<text class="no" x="123" y="510">no</text>
<rect class="preg" x="10" y="520" width="210" height="76" rx="10"/><text x="115" y="546" text-anchor="middle">¿Existen y son continuas</text><text x="115" y="563" text-anchor="middle">las derivadas que uso (hasta</text><text x="115" y="580" text-anchor="middle">la n+1 en Lagrange)?</text>
<path class="lin" d="M220 558 H246" marker-end="url(#fl)"/>
<text class="no" x="225" y="553">no</text>
<rect class="nada" x="250" y="520" width="340" height="76" rx="10"/><text x="420" y="538" text-anchor="middle">No se puede aplicar el teorema: busco el</text><text x="420" y="554" text-anchor="middle">punto problemático (pico, salto, |x|, √|x|</text><text x="420" y="572" text-anchor="middle">en 0) y uso la definición con límites</text><text x="420" y="588" text-anchor="middle">laterales</text>
<path class="lin" d="M115 596 V619" marker-end="url(#fl)"/>
<text class="no" x="123" y="612">sí</text>
<rect class="fin" x="10" y="622" width="210" height="76" rx="10"/><text x="115" y="648" text-anchor="middle">Aplico y compruebo: orden ≠</text><text x="115" y="665" text-anchor="middle">grado, ¿dividí entre k!?,</text><text x="115" y="682" text-anchor="middle">¿centro?, ¿caso peor?</text>
</svg>
