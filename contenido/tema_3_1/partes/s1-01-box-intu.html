<div class="box intu"><span class="h">Idea intuitiva</span>
  <p>La derivada $f'$ es una función nueva, así que se puede volver a derivar. Si $f$ es la posición de un coche, $f'$ es su velocidad y $f''$ su aceleración; $f'''$ (el «tirón») cuenta cómo cambia la aceleración. Se pueden seguir derivando mientras haya derivada.</p>
</div>
