<div class="box warn"><span class="h">«Orden» no es «grado»</span>
  <p>El grado de $p_n$ puede ser <b>menor</b> que $n$: si $f^{(n}(x_0)=0$ el último sumando desaparece (p. ej. $\cos x$ en $0$: $p_1(x)=1$, de grado $0$). Se ve con detalle en E 3.7.</p>
