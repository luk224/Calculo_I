<div class="box warn"><span class="h">Error típico: $f^{(4}$ no es $f^4$</span>
  <p>El paréntesis marca <b>derivar</b>. $f^{(4}(x)$ es la derivada cuarta; $(f(x))^4$ es la potencia. Y «la derivada es $0$» <b>no</b> significa «no existe» (E 3.2 más abajo).</p>
