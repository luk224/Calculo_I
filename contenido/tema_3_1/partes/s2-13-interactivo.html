  <figcaption>Interactivo propio. La curva negra es $f$ y la naranja es $p_n$ centrado en $a$ (punto azul). Sube el grado $n$: la zona donde se pegan se ensancha. Mueve el centro $a$ y la aproximación se desplaza con él. Lecciones: la aproximación es <b>local</b> y subir el orden ensancha la zona buena. El segmento verde es el error $R_n(x)=f(x)-p_n(x)$ en el punto $x$ elegido, y su valor sale debajo. Con $\ln(1+x)$ y $x$ lejos del centro (por ejemplo $a=0$, $x=3$) el error crece al subir $n$: la aproximación es solo local. Larson (Ej. 7, $\ln1{,}1$) y Stewart ($e^x$ en $x=0{,}2$ y $x=3$) lo comprueban con tablas. <span class="src" data-l="P" data-ref="Explicación propia; polinomio de Taylor: U §3.1.3 pp. 107-110; resto: U Prop. 3.2 p. 111">P</span></figcaption>
</figure>
