<p class="sub">Primero decide <b>qué</b> te piden: el polinomio (derivar y tabla, o combinar desarrollos conocidos), un valor con su error (Lagrange: caso peor de $f^{(n+1}(c)$), el orden $n$ o los $x$ válidos (despejar en la cota), o un límite (sustituir los desarrollos y quedarse con el primer término no nulo).</p>
