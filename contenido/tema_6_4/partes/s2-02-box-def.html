<div class="box def"><span class="h">Definición 6.3 · Rectángulos (simples)</span>
  <p>$$\begin{aligned}\int_a^bf(x)\,dx&\approx f(a)(b-a) &&(\text{izquierdo}),\\ \int_a^bf(x)\,dx&\approx f(b)(b-a) &&(\text{derecho}),\\ \int_a^bf(x)\,dx&\approx f\!\Big(\frac{a+b}2\Big)(b-a) &&(\text{central o punto medio}).\end{aligned}$$</p>
