<div class="box thm"><span class="h">Teorema 6.4 · Error de Simpson compuesta</span>
  <p>Con Simpson compuesta en $m$ subintervalos ($m$ = el mismo $n$ de la Def. 6.8),
  $$\varepsilon\le\frac{(b-a)^5}{2880\,m^4}\,M_4,$$
  donde $f$ es cuatro veces derivable y $\lvert f^{(4)}(x)\rvert\le M_4$ para todo $x\in[a,b]$.</p>
  <span class="src" data-l="U" data-ref="U Teorema 6.4, p. 270">U p.270</span>
</div>
