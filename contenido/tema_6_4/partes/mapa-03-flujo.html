<svg class="flujo" viewBox="0 0 600 712" role="img" aria-labelledby="flujo-t flujo-d">
<title id="flujo-t">Mapa de decisión del tema 6.4: qué hacer según lo que piden en integración numérica</title>
<desc id="flujo-d">Diagrama de flujo vertical. Si piden una cota del error o cuántos subintervalos, se acota el valor absoluto de la derivada segunda o cuarta, se impone la cota menor o igual que la tolerancia, se despeja m y se redondea hacia arriba. Si los datos no están igualmente espaciados, se aplica el trapecio simple en cada tramo con su anchura y se suma. Si piden Simpson, se usan 2n+1 nodos con pesos 1, 2 y 4 y factor h entre 6, completando valores con el polinomio interpolador si faltan. Si piden el trapecio, se usa h entre 2 por extremos más dos veces los centrales. Si piden rectángulos, se suman los valores izquierdos, derechos o centrales y se multiplica por h. Si piden comparar, se calcula el valor exacto con Barrow y el error. Al final se comprueba el orden de magnitud.</desc>
<defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="preg" x="10" y="10" width="210" height="76" rx="10"/>
<text x="115" y="40" text-anchor="middle">¿Piden una cota del error o</text>
<text x="115" y="58" text-anchor="middle">cuántos subintervalos?</text>
<path class="lin" d="M220 48 H246" marker-end="url(#fl)"/>
<text class="si" x="225" y="43">sí</text>
<rect class="nodo" x="250" y="10" width="340" height="76" rx="10"/>
<text x="420" y="44" text-anchor="middle">Cota ≤ tolerancia; M = máx. de |f″| o |f⁗|;</text>
<text x="420" y="64" text-anchor="middle">despejo m y redondeo hacia arriba.</text>
<path class="lin" d="M115 86 V109" marker-end="url(#fl)"/>
<text class="no" x="123" y="102">no</text>
<rect class="preg" x="10" y="112" width="210" height="76" rx="10"/>
<text x="115" y="142" text-anchor="middle">¿Los datos NO están igualmente</text>
<text x="115" y="160" text-anchor="middle">espaciados?</text>
<path class="lin" d="M220 150 H246" marker-end="url(#fl)"/>
<text class="si" x="225" y="145">sí</text>
<rect class="nodo" x="250" y="112" width="340" height="76" rx="10"/>
<text x="420" y="146" text-anchor="middle">Trapecio simple en cada tramo, con su</text>
<text x="420" y="166" text-anchor="middle">propia anchura, y sumo (X10).</text>
<path class="lin" d="M115 188 V211" marker-end="url(#fl)"/>
<text class="no" x="123" y="204">no</text>
<rect class="preg" x="10" y="214" width="210" height="76" rx="10"/>
<text x="115" y="258" text-anchor="middle">¿Piden Simpson?</text>
<path class="lin" d="M220 252 H246" marker-end="url(#fl)"/>
<text class="si" x="225" y="247">sí</text>
<rect class="nodo" x="250" y="214" width="340" height="76" rx="10"/>
<text x="420" y="248" text-anchor="middle">Nodos 2n+1 (impar); h/6·(E+2P+4I);</text>
<text x="420" y="268" text-anchor="middle">faltan valores: polinomio interpolador.</text>
<path class="lin" d="M115 290 V313" marker-end="url(#fl)"/>
<text class="no" x="123" y="306">no</text>
<rect class="preg" x="10" y="316" width="210" height="76" rx="10"/>
<text x="115" y="360" text-anchor="middle">¿Piden el trapecio?</text>
<path class="lin" d="M220 354 H246" marker-end="url(#fl)"/>
<text class="si" x="225" y="349">sí</text>
<rect class="nodo" x="250" y="316" width="340" height="76" rx="10"/>
<text x="420" y="350" text-anchor="middle">h/2·(E+2C), n+1 nodos; con N datos,</text>
<text x="420" y="370" text-anchor="middle">N−1 subintervalos y h = el paso.</text>
<path class="lin" d="M115 392 V415" marker-end="url(#fl)"/>
<text class="no" x="123" y="408">no</text>
<rect class="preg" x="10" y="418" width="210" height="76" rx="10"/>
<text x="115" y="462" text-anchor="middle">¿Piden rectángulos?</text>
<path class="lin" d="M220 456 H246" marker-end="url(#fl)"/>
<text class="si" x="225" y="451">sí</text>
<rect class="nodo" x="250" y="418" width="340" height="76" rx="10"/>
<text x="420" y="452" text-anchor="middle">Izq.: f₀…f₍ₙ₋₁₎; der.: f₁…fₙ; central:</text>
<text x="420" y="472" text-anchor="middle">valores en los puntos medios; × h.</text>
<path class="lin" d="M115 494 V517" marker-end="url(#fl)"/>
<text class="no" x="123" y="510">no</text>
<rect class="preg" x="10" y="520" width="210" height="76" rx="10"/>
<text x="115" y="550" text-anchor="middle">¿Piden comparar con el</text>
<text x="115" y="568" text-anchor="middle">valor real?</text>
<path class="lin" d="M220 558 H246" marker-end="url(#fl)"/>
<text class="si" x="225" y="553">sí</text>
<rect class="nodo" x="250" y="520" width="340" height="76" rx="10"/>
<text x="420" y="554" text-anchor="middle">Barrow (primitiva) y error absoluto;</text>
<text x="420" y="574" text-anchor="middle">explico: recta frente a parábola.</text>
<path class="lin" d="M115 596 V619" marker-end="url(#fl)"/>
<text class="no" x="123" y="612">no</text>
<rect class="fin" x="10" y="622" width="580" height="86" rx="10"/>
<text x="300" y="648" text-anchor="middle">Antes de dar el resultado:</text>
<text x="300" y="668" text-anchor="middle">¿contados bien nodos y subintervalos?, ¿h correcta?, ¿pesos 1-2-1 o 1-2-4?,</text>
<text x="300" y="686" text-anchor="middle">¿orden de magnitud (longitud × valor medio)?, ¿m redondeado hacia arriba?</text>
</svg>
