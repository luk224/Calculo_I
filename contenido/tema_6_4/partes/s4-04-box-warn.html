<div class="box warn"><span class="h">Error típico</span>
  <p>En la compuesta, la $h$ de la fórmula es la longitud de <b>cada subintervalo</b> $\frac{b-a}n$, no la distancia entre nodos consecutivos (que es $\frac h2$). Con esa distancia el factor sería $\frac{h/2}3$; poner $\frac{h/2}6$ da la mitad.</p>
</div>
