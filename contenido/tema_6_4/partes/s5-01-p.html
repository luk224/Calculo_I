<p>Prueba con el interactivo: elige una función y un método, y sube $n$. Observa (i) cómo la <b>zona de error</b> (color distinto) se estrecha, (ii) cómo el error baja mucho más deprisa con Simpson que con el trapecio, y (iii) que el trapecio y el punto medio se equivocan <b>en sentidos opuestos</b>.</p>
