<div class="box intu"><span class="h">Idea intuitiva</span>
  <p>El error de una recta contra una curva depende de <b>cuánto se curva</b> la función: la mide $f''$. Si $f''$ es pequeña, el trapecio acierta; para Simpson, que ya copia parábolas, cuenta la cuarta derivada. Y cuanto más pequeño $h$, menos error. Las cotas ponen todo eso en una fórmula.</p>
</div>
