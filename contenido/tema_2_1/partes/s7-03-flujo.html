<svg class="flujo" viewBox="0 0 640 552" role="img" aria-labelledby="flujo-t flujo-d">
<title id="flujo-t">Mapa de decisión: cómo estudiar la derivabilidad de una función en un punto</title>
<desc id="flujo-d">Diagrama de flujo vertical con cinco preguntas. Si hay una sola fórmula derivable se usan las reglas de derivación. Si la función no es continua en el punto, no es derivable. Si cambia la fórmula en el punto se calculan las dos derivadas laterales con la definición y se comparan. Si hay un factor oscilante o el cociente tiende a infinito se usa la definición con h. Si piden tangente, normal o puntos con pendiente dada se usa la ecuación de la tangente y se resuelve la derivada igual a la pendiente. Si nada encaja, se relee el enunciado.</desc>
<defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="preg" x="10" y="10" width="220" height="50" rx="10"/>
<text x="120" y="32" text-anchor="middle">¿Una sola fórmula, sin |·|,</text><text x="120" y="50" text-anchor="middle">trozos ni valor suelto en a?</text>
<path class="lin" d="M230 35 H256" marker-end="url(#fl)"/><text class="si" x="235" y="30">sí</text>
<rect class="fin" x="260" y="4" width="370" height="62" rx="10"/>
<text x="445" y="23" text-anchor="middle">Reglas de derivación (tabla y cadena, U p.79):</text>
<text x="445" y="41" text-anchor="middle">la derivada existe donde la fórmula es derivable.</text>
<text x="445" y="59" text-anchor="middle">Por la definición solo si te lo piden.</text>
<path class="lin" d="M120 60 V89" marker-end="url(#fl)"/><text class="no" x="128" y="80">no</text>
<rect class="preg" x="10" y="92" width="220" height="50" rx="10"/>
<text x="120" y="114" text-anchor="middle">¿f NO es continua en a?</text><text x="120" y="132" text-anchor="middle">(el límite no es f(a))</text>
<path class="lin" d="M230 117 H256" marker-end="url(#fl)"/><text class="si" x="235" y="112">sí</text>
<rect class="fin" x="260" y="86" width="370" height="62" rx="10"/>
<text x="445" y="105" text-anchor="middle">No es derivable (Teorema 2.1, U p.76).</text>
<text x="445" y="123" text-anchor="middle">Un salto basta: no hace falta calcular ninguna</text>
<text x="445" y="141" text-anchor="middle">derivada. Fin.</text>
<path class="lin" d="M120 142 V171" marker-end="url(#fl)"/><text class="no" x="128" y="162">no</text>
<rect class="preg" x="10" y="174" width="220" height="50" rx="10"/>
<text x="120" y="196" text-anchor="middle">¿Cambia la fórmula en a?</text><text x="120" y="214" text-anchor="middle">(trozos, |g| con g(a) = 0)</text>
<path class="lin" d="M230 199 H256" marker-end="url(#fl)"/><text class="si" x="235" y="194">sí</text>
<rect class="fin" x="260" y="168" width="370" height="62" rx="10"/>
<text x="445" y="187" text-anchor="middle">Dos laterales con la definición, cada una con</text>
<text x="445" y="205" text-anchor="middle">su fórmula: derivable ⇔ finitas e iguales.</text>
<text x="445" y="223" text-anchor="middle">Con parámetros: continuidad y luego igualar.</text>
<path class="lin" d="M120 224 V253" marker-end="url(#fl)"/><text class="no" x="128" y="244">no</text>
<rect class="preg" x="10" y="256" width="220" height="50" rx="10"/>
<text x="120" y="278" text-anchor="middle">¿Hay un factor oscilante</text><text x="120" y="296" text-anchor="middle">(sen 1/x) o el cociente da ±∞?</text>
<path class="lin" d="M230 281 H256" marker-end="url(#fl)"/><text class="si" x="235" y="276">sí</text>
<rect class="fin" x="260" y="250" width="370" height="62" rx="10"/>
<text x="445" y="269" text-anchor="middle">Definición con h: (acotado)·(→0) da 0 y es</text>
<text x="445" y="287" text-anchor="middle">derivable; sen(1/h) solo no tiene límite; ±∞ es</text>
<text x="445" y="305" text-anchor="middle">tangente vertical. Estos dos: no derivable.</text>
<path class="lin" d="M120 306 V335" marker-end="url(#fl)"/><text class="no" x="128" y="326">no</text>
<rect class="preg" x="10" y="338" width="220" height="50" rx="10"/>
<text x="120" y="360" text-anchor="middle">¿Piden tangente, normal o</text><text x="120" y="378" text-anchor="middle">puntos con pendiente dada?</text>
<path class="lin" d="M230 363 H256" marker-end="url(#fl)"/><text class="si" x="235" y="358">sí</text>
<rect class="fin" x="260" y="332" width="370" height="62" rx="10"/>
<text x="445" y="351" text-anchor="middle">Tangente y = f(a)+f′(a)(x−a); normal con vector</text>
<text x="445" y="369" text-anchor="middle">(−f′(a), 1). Pendiente m (o tan θ): resuelve</text>
<text x="445" y="387" text-anchor="middle">f′(x) = m y sustituye en f, no en f′.</text>
<path class="lin" d="M120 388 V417" marker-end="url(#fl)"/><text class="no" x="128" y="408">no</text>
<rect class="nada" x="10" y="420" width="620" height="40" rx="10"/><text x="320" y="445" text-anchor="middle">Relee el enunciado: casi todo lo que cae es uno de estos cinco casos</text>
</svg>
