<div class="box def"><span class="h">Del ángulo a la pendiente</span>
  <p>Si una recta forma con el eje $x$ un ángulo $\theta$ (medido desde el eje hacia la recta, en sentido contrario a las agujas del reloj), su pendiente es $m=\tan\theta$. Así, $\theta=\frac\pi4$ da $m=1$; $\theta=0$ da $m=0$ (horizontal).</p>
  <span class="src" data-l="E" data-ref="Libro de ejercicios, margen de p. 55 (pendiente = tan θ)">E p.55</span>
</div>
