<div class="box ex"><span class="h">Ejemplo 2.1 de U: la derivada de una constante</span>
  <p>Si $f(x)=k$ con $k\in\mathbb R$, para todo $a$: $f'(a)=\lim_{h\to0}\dfrac{k-k}{h}=\lim_{h\to0}0=0$. Una función constante es derivable en todo punto y su derivada es $0$ (su gráfica es horizontal: no cambia).</p>
  <span class="src" data-l="U" data-ref="U Ejemplo 2.1, p. 76">U p.76</span>
</div>
