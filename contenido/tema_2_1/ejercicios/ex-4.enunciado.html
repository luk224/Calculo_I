<p class="enun">Para $a\in\mathbb R$, sea $f(x)=\dfrac{a\,e^x}{2+x}$ si $x\neq-2$ y $f(-2)=0$. a) ¿Es continua si $x\neq-2$? b) ¿Se puede encontrar $a$ para que $f$ sea continua en $x=-2$? c) Hallar $a$ para que la pendiente de la recta tangente a su gráfica sea $1$ en $x=0$. Razone las respuestas.</p>
