<p class="enun"><b>Original:</b> enuncie el Teorema de Bolzano y aplíquelo para demostrar que $e^x-x=2$ tiene al menos una solución en $[1,2]$. <b>Ampliación propia</b> (así se pregunta el «número de raíces»): demuestre que esa solución es única en $[1,2]$ y que la ecuación tiene exactamente dos soluciones reales.</p>
