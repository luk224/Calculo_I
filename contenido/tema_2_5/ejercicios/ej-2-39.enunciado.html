<p class="enun">Dada $f:[-1,1]\to\mathbb R$ continua en $[-1,1]$, con $f(-1)=f(1)$ y derivable en $(-1,1)$: a) para algún $c$ la tangente es paralela al eje $y$; b) para algún $c$ la tangente es perpendicular al eje $y$; c) para algún $c$ la tangente es perpendicular al eje $x$; d) ninguna de las anteriores.</p>
