<p class="enun">Determine los intervalos de crecimiento y decrecimiento de $f(x)=x^3e^x$. (Versión más fácil, <span class="src" data-l="X" data-ref="X p.35 (Febrero 2013, 2ª semana, Ingeniería Mecánica, Modelo B, pregunta corta 1)">X p.35</span>: «¿dónde es creciente $f(x)=xe^x$?»; allí $f'(x)=(1+x)e^x$ y es creciente en $[-1,\infty)$.)</p>
