<ul class="trio">
  <li><b>Cómo lo reconoces:</b> Piden una tangente paralela a una cuerda, una cota de $f(b)-f(a)$ o una desigualdad.</li>
  <li><b>Qué haces:</b> Comprueba continuidad y derivabilidad, escribe $f(b)-f(a)=f'(c)(b-a)$ y acota o resuelve $f'(c)=$ pendiente.</li>
  <li><b>Ejemplo mínimo:</b> $5-\frac4x$ en $[1,4]$: pendiente $1$, $c=2$.</li>
</ul>
