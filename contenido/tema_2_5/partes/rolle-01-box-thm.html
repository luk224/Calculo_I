<div class="box thm"><span class="h">Teorema de Rolle</span>
  <p>Sea $f:[a,b]\to\mathbb R$ <b>continua en $[a,b]$</b>, <b>derivable en $(a,b)$</b> y con <b>$f(a)=f(b)$</b>. Entonces existe al menos un $c\in(a,b)$ tal que $f'(c)=0$.</p>
