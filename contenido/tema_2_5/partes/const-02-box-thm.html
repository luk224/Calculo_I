<div class="box thm"><span class="h">Teorema 2.4 (caracterización de las funciones constantes)</span>
  <p>Sea $f$ derivable en el intervalo $(a,b)$. Entonces $f$ es constante en $(a,b)$ si y solo si $f'(x)=0$ para todo $x\in(a,b)$.</p>
