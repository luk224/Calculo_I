<div class="box ex"><span class="h">Ejemplo resuelto: acotar $f(2)$ (Stewart)</span>
  <p>Si $f(0)=-3$ y $f'(x)\le5$ para todo $x$, el TVM en $[0,2]$ da $f(2)=f(0)+2f'(c)\le-3+2\cdot5=7$: $f(2)$ vale a lo sumo $7$.</p>
  <span class="src" data-l="S" data-ref="Stewart §4.2 Ejemplo 5, p. 287">S p.287</span></div>
