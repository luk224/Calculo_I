<svg class="flujo" viewBox="0 0 460 720" role="img" aria-labelledby="flujo-t flujo-d">
<title id="flujo-t">Mapa de decisión: qué teorema aplico y cuántas raíces hay</title>
<desc id="flujo-d">Diagrama de flujo vertical. Si piden contar soluciones de f(x)=0, Bolzano da la existencia y Rolle o la monotonía estricta limitan cuántas hay. Si piden un punto con f prima conocida, Rolle si f(a)=f(b) y el valor medio si no. Si piden una cota o desigualdad, valor medio o función auxiliar. Si piden dónde sube o baja, el signo de f prima. Si piden probar que algo es constante, f prima cero en un intervalo. Antes de aplicar cualquier teorema se comprueban las hipótesis; si falla alguna no se puede asegurar nada.</desc>
<defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="nodo" x="10" y="10" width="200" height="62" rx="10"/><text x="110" y="37" text-anchor="middle">Leo qué me piden y escribo</text><text x="110" y="55" text-anchor="middle">la función y el intervalo</text>
<path class="lin" d="M110 72 V97" marker-end="url(#fl)"/>
<rect class="preg" x="10" y="100" width="200" height="62" rx="10"/><text x="110" y="127" text-anchor="middle">¿Piden contar o localizar</text><text x="110" y="145" text-anchor="middle">soluciones de f(x) = 0?</text>
<path class="lin" d="M110 162 V187" marker-end="url(#fl)"/>
<text class="no" x="118" y="179">no</text>
<path class="lin" d="M210 131 H246" marker-end="url(#fl)"/><text class="si" x="215" y="126">sí</text>
<rect class="nodo" x="250" y="100" width="200" height="62" rx="10"/><text x="350" y="118" text-anchor="middle">Existe: Bolzano (f continua</text><text x="350" y="136" text-anchor="middle">y cambia de signo). Única o</text><text x="350" y="154" text-anchor="middle">cuántas: Rolle o monotonía</text>
<rect class="preg" x="10" y="190" width="200" height="62" rx="10"/><text x="110" y="217" text-anchor="middle">¿Piden un punto donde f′</text><text x="110" y="235" text-anchor="middle">vale algo (una tangente)?</text>
<path class="lin" d="M110 252 V277" marker-end="url(#fl)"/>
<text class="no" x="118" y="269">no</text>
<path class="lin" d="M210 221 H246" marker-end="url(#fl)"/><text class="si" x="215" y="216">sí</text>
<rect class="nodo" x="250" y="190" width="200" height="62" rx="10"/><text x="350" y="208" text-anchor="middle">Si f(a)=f(b): Rolle, f′(c)=0</text><text x="350" y="226" text-anchor="middle">Si no: valor medio, f′(c) =</text><text x="350" y="244" text-anchor="middle">(f(b)−f(a))/(b−a)</text>
<rect class="preg" x="10" y="280" width="200" height="62" rx="10"/><text x="110" y="307" text-anchor="middle">¿Piden una cota o una</text><text x="110" y="325" text-anchor="middle">desigualdad?</text>
<path class="lin" d="M110 342 V367" marker-end="url(#fl)"/>
<text class="no" x="118" y="359">no</text>
<path class="lin" d="M210 311 H246" marker-end="url(#fl)"/><text class="si" x="215" y="306">sí</text>
<rect class="nodo" x="250" y="280" width="200" height="62" rx="10"/><text x="350" y="298" text-anchor="middle">Valor medio con f′ acotada:</text><text x="350" y="316" text-anchor="middle">|f(y)−f(x)| ≤ M·|y−x|; o</text><text x="350" y="334" text-anchor="middle">h = f − g y signo de h′</text>
<rect class="preg" x="10" y="370" width="200" height="62" rx="10"/><text x="110" y="397" text-anchor="middle">¿Piden dónde sube o baja f</text><text x="110" y="415" text-anchor="middle">(o si es creciente)?</text>
<path class="lin" d="M110 432 V457" marker-end="url(#fl)"/>
<text class="no" x="118" y="449">no</text>
<path class="lin" d="M210 401 H246" marker-end="url(#fl)"/><text class="si" x="215" y="396">sí</text>
<rect class="nodo" x="250" y="370" width="200" height="62" rx="10"/><text x="350" y="388" text-anchor="middle">Factorizo f′ y hallo sus</text><text x="350" y="406" text-anchor="middle">ceros; un valor de prueba</text><text x="350" y="424" text-anchor="middle">por tramo; Prop. 2.4</text>
<rect class="preg" x="10" y="460" width="200" height="62" rx="10"/><text x="110" y="487" text-anchor="middle">¿Piden probar que algo es</text><text x="110" y="505" text-anchor="middle">constante, o que f′ = g′?</text>
<path class="lin" d="M110 522 V547" marker-end="url(#fl)"/>
<text class="no" x="118" y="539">no</text>
<path class="lin" d="M210 491 H246" marker-end="url(#fl)"/><text class="si" x="215" y="486">sí</text>
<rect class="nodo" x="250" y="460" width="200" height="62" rx="10"/><text x="350" y="478" text-anchor="middle">f′ = 0 en un intervalo ⇒</text><text x="350" y="496" text-anchor="middle">constante (Teor. 2.4); su</text><text x="350" y="514" text-anchor="middle">valor, en un punto cómodo</text>
<rect class="preg" x="10" y="550" width="200" height="62" rx="10"/><text x="110" y="568" text-anchor="middle">¿Se cumplen todas las</text><text x="110" y="586" text-anchor="middle">hipótesis del teorema?</text><text x="110" y="604" text-anchor="middle">(cerrado, abierto, f(a)=f(b))</text>
<path class="lin" d="M110 612 V637" marker-end="url(#fl)"/>
<text class="no" x="118" y="629">sí</text>
<path class="lin" d="M210 581 H246" marker-end="url(#fl)"/><text class="no" x="215" y="576">no</text>
<rect class="nada" x="250" y="550" width="200" height="62" rx="10"/><text x="350" y="568" text-anchor="middle">No se puede asegurar nada:</text><text x="350" y="586" text-anchor="middle">busco un contraejemplo</text><text x="350" y="604" text-anchor="middle">(pico |x| o salto)</text>
<rect class="fin" x="10" y="640" width="200" height="62" rx="10"/><text x="110" y="667" text-anchor="middle">Aplico, traduzco c a lo</text><text x="110" y="685" text-anchor="middle">que piden y redacto</text>
</svg>
