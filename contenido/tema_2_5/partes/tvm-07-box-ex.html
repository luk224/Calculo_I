<div class="box ex"><span class="h">Ejemplo resuelto: hallar $c$ (Larson)</span>
  <p>$f(x)=5-\dfrac4x$ en $[1,4]$. La cuerda tiene pendiente $\dfrac{f(4)-f(1)}{4-1}=\dfrac{4-1}{3}=1$. Como $f'(x)=\dfrac4{x^2}$, se resuelve $\dfrac4{x^2}=1$, que da $x=\pm2$; solo $c=2$ está en $(1,4)$.</p>
  <span class="src" data-l="L" data-ref="Larson §3.2 Ejemplo 3, p. 173">L p.173</span></div>
