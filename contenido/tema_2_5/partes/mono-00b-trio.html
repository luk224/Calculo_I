<ul class="trio">
  <li><b>Cómo lo reconoces:</b> Piden «intervalos de crecimiento y decrecimiento» o si $f$ es (estrictamente) creciente.</li>
  <li><b>Qué haces:</b> Derivas, factorizas, hallas los ceros de $f'$, un valor de prueba por tramo y aplicas la Prop. 2.4.</li>
  <li><b>Ejemplo mínimo:</b> $x^3-3x$: $f'=3(x-1)(x+1)$; crece, decrece, crece.</li>
</ul>
