<div class="box ex"><span class="h">Ejemplo resuelto: aplicar Rolle (A1, propio)</span>
  <p>Comprueba que $f(x)=x^2-4x+1$ cumple Rolle en $[0,4]$ y halla $c$.</p>
  <ol class="steps">
    <li>Es un polinomio: continua y derivable en todo $\mathbb R$.</li>
    <li>$f(0)=1$ y $f(4)=16-16+1=1$: coinciden.</li>
    <li>$f'(x)=2x-4=0\iff x=2\in(0,4)$. Luego $c=2$.</li>
  </ol>
