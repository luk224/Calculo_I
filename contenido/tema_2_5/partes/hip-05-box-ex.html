<div class="box ex"><span class="h">Ejemplo resuelto: $\tanh$ (C1, propio)</span>
  <p>Por la regla del cociente, $(\tanh x)'=\dfrac{\cosh x\cosh x-\operatorname{senh}x\operatorname{senh}x}{\cosh^2x}=\dfrac1{\cosh^2x}=1-\tanh^2x$, usando $\cosh^2-\operatorname{senh}^2=1$ (E 2.45 d).</p>
