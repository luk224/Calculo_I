<div class="box def"><span class="h">Demostración (valor medio)</span>
  <p>Sean $a\lt b$ en $I$. El TVM da $c\in(a,b)$ con $f(b)-f(a)=f'(c)(b-a)$. Como $b-a&gt;0$, el signo de $f(b)-f(a)$ es el de $f'(c)$. Si $f'&gt;0$ en $I$, entonces $f(b)-f(a)&gt;0$. Los otros casos son iguales. $\square$</p>
