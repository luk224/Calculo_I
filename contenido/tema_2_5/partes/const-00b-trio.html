<ul class="trio">
  <li><b>Cómo lo reconoces:</b> Piden probar una identidad o que $f$ no depende de $x$.</li>
  <li><b>Qué haces:</b> Derivas, ves que da $0$ en un intervalo y calculas el valor en un punto.</li>
  <li><b>Ejemplo mínimo:</b> $\cosh^2x-\operatorname{senh}^2x$ tiene derivada $0$ y vale $1$ en $x=0$.</li>
</ul>
