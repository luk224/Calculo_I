<div class="box tip"><span class="h">Truco de examen</span>
  <p>Ante «existe $c$ tal que…»: escribe primero <b>las hipótesis una a una</b> y comprueba cada una. Para refutar una opción, un contraejemplo con pico ($|x|$) o con salto. Para razonar la monotonía sin derivadas, la definición con $a\lt b$; con derivadas, factoriza $f'$ y estudia su signo.</p></div>
