<div class="box thm"><span class="h">Teorema del valor medio (de Lagrange)</span>
  <p>Si $f:[a,b]\to\mathbb R$ es <b>continua en $[a,b]$</b> y <b>derivable en $(a,b)$</b>, entonces existe al menos un $c\in(a,b)$ tal que
  $$f'(c)=\frac{f(b)-f(a)}{b-a}.$$</p>
