<div class="box thm"><span class="h">Consecuencia: misma derivada, misma función salvo constante</span>
  <p>Si $f'(x)=g'(x)$ para todo $x$ de un <b>intervalo</b>, entonces $f(x)-g(x)=k$ constante en ese intervalo. (Se aplica el Teorema 2.4 a $h=f-g$.) Ejemplo de U: $x$ y $x+\pi$.</p>
