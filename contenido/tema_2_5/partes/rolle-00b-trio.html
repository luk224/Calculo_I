<ul class="trio">
  <li><b>Cómo lo reconoces:</b> «Existe un punto con $f'=0$», «tangente horizontal», o «a lo sumo tantas raíces como…».</li>
  <li><b>Qué haces:</b> Compruebas las tres hipótesis en una lista y concluyes $f'(c)=0$ con $c\in(a,b)$.</li>
  <li><b>Ejemplo mínimo:</b> $f(x)=x^2-4x+1$ en $[0,4]$: $f(0)=f(4)=1$, $c=2$.</li>
</ul>
