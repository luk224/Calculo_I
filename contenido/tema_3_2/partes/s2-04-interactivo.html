  <img class="int-static" src="../assets/img/int_radio-convergencia.png" alt="Interactivo: sumas parciales de una serie de potencias frente a la función, con las rectas x = ±R">
  <figcaption>Interactivo propio. La curva gris es $f$ y la naranja es la suma parcial $S_N$ (el polinomio de Taylor de grado $N$ en $0$). Las rectas verdes marcan $x=\pm R$. Sube $N$: dentro de $(-R,R)$ la naranja se pega a la gris; fuera, se separa cada vez más aunque $f$ sea perfectamente suave. Compruébalo con $\frac1{1+x^2}$, que está definida y es suave en todo $\mathbb R$ y aun así su serie solo converge en $|x|&lt;1$ (el radio no llega «hasta donde está definida $f$»). Con $e^x$ y $\operatorname{sen}x$ el radio es infinito. <span class="src" data-l="P" data-ref="Explicación propia; radio de convergencia: U §1.5 Def. 1.29 p. 67 y criterios p. 70">P</span></figcaption>
</figure>
