<p class="sub">Antes de calcular, decide qué te piden: la serie (¿derivo y busco el patrón, o sustituyo en una conocida?), dónde converge (centro, radio con cociente o raíz y, siempre, los dos extremos aparte), una suma (¿de qué serie conocida es un valor?) o si la serie suma $f$ (resto de Lagrange $\to0$).</p>
