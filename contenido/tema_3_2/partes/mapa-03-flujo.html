<svg class="flujo" viewBox="0 0 460 630" role="img" aria-labelledby="flujo-t flujo-d">
<title id="flujo-t">Mapa de decisión: qué hago con una serie de potencias o de Taylor</title>
<desc id="flujo-d">Diagrama de flujo vertical. Si piden la serie de Taylor de una función: sustituir en una serie conocida o derivar y buscar el patrón. Si piden radio o intervalo: forma estándar, cociente o raíz y los dos extremos. Si piden sumar una serie numérica o desarrollar una potencia negativa: derivar una serie conocida dentro del intervalo abierto y evaluar. Si piden derivadas en el centro sin derivar: n factorial por el coeficiente. Si piden un error o si la serie suma f: resto de Lagrange. Al final se redacta con serie, radio y extremos.</desc>
<defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="nodo" x="10" y="10" width="200" height="62" rx="10"/><text x="110" y="37" text-anchor="middle">Leo qué me piden y localizo</text><text x="110" y="55" text-anchor="middle">la función, la serie y x0</text>
<path class="lin" d="M110 72 V97" marker-end="url(#fl)"/>
<rect class="preg" x="10" y="100" width="200" height="62" rx="10"/><text x="110" y="127" text-anchor="middle">¿Piden la serie de Taylor</text><text x="110" y="145" text-anchor="middle">(o un desarrollo) de f?</text>
<path class="lin" d="M110 162 V187" marker-end="url(#fl)"/>
<text class="no" x="118" y="179">no</text>
<path class="lin" d="M210 131 H246" marker-end="url(#fl)"/><text class="si" x="215" y="126">sí</text>
<rect class="nodo" x="250" y="100" width="200" height="62" rx="10"/><text x="350" y="118" text-anchor="middle">Si f sale de e^x, sen, cos,</text><text x="350" y="136" text-anchor="middle">1/(1−x): sustituyo. Si no:</text><text x="350" y="154" text-anchor="middle">derivo, patrón, f^(n)(x0)/n!</text>
<rect class="preg" x="10" y="190" width="200" height="62" rx="10"/><text x="110" y="217" text-anchor="middle">¿Piden radio, centro o</text><text x="110" y="235" text-anchor="middle">intervalo de convergencia?</text>
<path class="lin" d="M110 252 V277" marker-end="url(#fl)"/>
<text class="no" x="118" y="269">no</text>
<path class="lin" d="M210 221 H246" marker-end="url(#fl)"/><text class="si" x="215" y="216">sí</text>
<rect class="nodo" x="250" y="190" width="200" height="62" rx="10"/><text x="350" y="208" text-anchor="middle">Dejo (x − x0)^n y leo a_n;</text><text x="350" y="226" text-anchor="middle">factoriales: cociente; a^n:</text><text x="350" y="244" text-anchor="middle">raíz; R = 1/S y los extremos</text>
<rect class="preg" x="10" y="280" width="200" height="62" rx="10"/><text x="110" y="307" text-anchor="middle">¿Piden sumar una serie o</text><text x="110" y="325" text-anchor="middle">desarrollar (1−x)^(−2), ln…?</text>
<path class="lin" d="M110 342 V367" marker-end="url(#fl)"/>
<text class="no" x="118" y="359">no</text>
<path class="lin" d="M210 311 H246" marker-end="url(#fl)"/><text class="si" x="215" y="306">sí</text>
<rect class="nodo" x="250" y="280" width="200" height="62" rx="10"/><text x="350" y="298" text-anchor="middle">Derivo (o multiplico por x)</text><text x="350" y="316" text-anchor="middle">una serie conocida dentro</text><text x="350" y="334" text-anchor="middle">de (−R, R) y evalúo ahí</text>
<rect class="preg" x="10" y="370" width="200" height="62" rx="10"/><text x="110" y="397" text-anchor="middle">¿Piden f^(n)(x0) sin</text><text x="110" y="415" text-anchor="middle">derivar la función?</text>
<path class="lin" d="M110 432 V457" marker-end="url(#fl)"/>
<text class="no" x="118" y="449">no</text>
<path class="lin" d="M210 401 H246" marker-end="url(#fl)"/><text class="si" x="215" y="396">sí</text>
<rect class="nodo" x="250" y="370" width="200" height="62" rx="10"/><text x="350" y="388" text-anchor="middle">Leo el coeficiente a_n del</text><text x="350" y="406" text-anchor="middle">desarrollo: f^(n)(x0) = n!·a_n</text><text x="350" y="424" text-anchor="middle">(a_n = coef. de (x − x0)^n)</text>
<rect class="preg" x="10" y="460" width="200" height="62" rx="10"/><text x="110" y="487" text-anchor="middle">¿Piden un error, cuántos</text><text x="110" y="505" text-anchor="middle">términos o si suma f?</text>
<path class="lin" d="M110 522 V547" marker-end="url(#fl)"/>
<text class="no" x="118" y="539">no</text>
<path class="lin" d="M210 491 H246" marker-end="url(#fl)"/><text class="si" x="215" y="486">sí</text>
<rect class="nodo" x="250" y="460" width="200" height="62" rx="10"/><text x="350" y="478" text-anchor="middle">Resto de Lagrange: |R_n| ≤</text><text x="350" y="496" text-anchor="middle">M|x − x0|^(n+1)/(n+1)!;</text><text x="350" y="514" text-anchor="middle">si R_n → 0, la serie suma f</text>
<rect class="fin" x="10" y="550" width="200" height="62" rx="10"/><text x="110" y="577" text-anchor="middle">Redacto: serie, radio y</text><text x="110" y="595" text-anchor="middle">extremos, con las fuentes</text>
</svg>
