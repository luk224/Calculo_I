<p class="enun">Sea la serie $\sum_{n=1}^{+\infty}a_n$ de término general $a_n=\dfrac1{3+\cos n+n^{5/2}}$. Elige la opción u opciones correctas: a) es una serie convergente pero no es absolutamente convergente; b) es una serie absolutamente convergente; c) es una serie divergente; d) es una serie alternada.</p>
