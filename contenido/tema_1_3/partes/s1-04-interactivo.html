  <img class="int-static" src="../assets/img/int_series.png" alt="Interactivo: términos y sumas parciales de una serie frente a su suma">
  <figcaption>Interactivo propio. Las barras grises son los términos $a_n$ y la curva naranja son las sumas parciales $s_n=a_1+\dots+a_n$. Si la serie converge, $s_n$ se acerca a la línea verde (su suma); si diverge, $s_n$ sigue creciendo. Compara la armónica $\sum\frac1n$ y $\sum\frac1{n^2}$: en las dos $a_n\to0$, pero solo la segunda converge, así que «$a_n\to0$» no basta. Aumenta los términos con el deslizador para ver el comportamiento a largo plazo. <span class="src" data-l="P" data-ref="Explicación propia; series, sumas parciales y convergencia: U Definiciones 1.14 y 1.15, §1.3.2 pp. 33-36">P</span></figcaption>
</figure>
