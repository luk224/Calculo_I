<div class="box intu"><span class="h">Idea intuitiva</span>
  <p>Un telescopio se pliega: al sumar, cada término «se come» parte del siguiente y casi todo se cancela; quedan solo el primer y el último trozo. Ocurre cuando el término general es una <b>diferencia</b> $a_n=b_n-b_{n+1}$.</p>
