<svg class="flujo" viewBox="0 0 640 634" role="img" aria-labelledby="flujo-t flujo-d">
<title id="flujo-t">Mapa de decisión: qué criterio de convergencia uso para una serie</title>
<desc id="flujo-d">Diagrama de flujo vertical con siete preguntas. Si el término no tiende a cero, la serie diverge. Si es geométrica, converge cuando el valor absoluto de la razón es menor que uno y la suma es el primer término entre uno menos la razón. Si se cancela en cadena es telescópica y se calcula la suma parcial. Si tiene signos variables se estudia la serie de valores absolutos y, si no converge y es alternada, se usa Leibniz. Con factoriales, potencias o productos que se alargan se usa el cociente. Con potencias n-ésimas se usa la raíz. Si se parece a un cociente de potencias se compara con una serie p. Si no encaja, se relee el enunciado.</desc>
<defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="preg" x="10" y="10" width="220" height="50" rx="10"/>
<text x="120" y="32" text-anchor="middle">¿El término NO tiende a 0?</text><text x="120" y="50" text-anchor="middle">(lím aₙ ≠ 0, o no existe)</text>
<path class="lin" d="M230 35 H256" marker-end="url(#fl)"/><text class="si" x="235" y="30">sí</text>
<rect class="fin" x="260" y="4" width="370" height="62" rx="10"/>
<text x="445" y="23" text-anchor="middle">Diverge (condición necesaria, Prop. 1.6).</text>
<text x="445" y="41" text-anchor="middle">Si tiende a 0, todavía no sabes nada.</text>
<text x="445" y="59" text-anchor="middle">Es la primera comprobación, siempre.</text>
<path class="lin" d="M120 60 V89" marker-end="url(#fl)"/><text class="no" x="128" y="80">no</text>
<rect class="preg" x="10" y="92" width="220" height="50" rx="10"/>
<text x="120" y="114" text-anchor="middle">¿Es GEOMÉTRICA a·rⁿ</text><text x="120" y="132" text-anchor="middle">(razón constante)?</text>
<path class="lin" d="M230 117 H256" marker-end="url(#fl)"/><text class="si" x="235" y="112">sí</text>
<rect class="fin" x="260" y="86" width="370" height="62" rx="10"/>
<text x="445" y="105" text-anchor="middle">Converge ⇔ |r| &lt; 1; suma = 1.er término</text>
<text x="445" y="123" text-anchor="middle">dividido entre 1 − r.</text>
<text x="445" y="141" text-anchor="middle">Mira dónde empieza el índice.</text>
<path class="lin" d="M120 142 V171" marker-end="url(#fl)"/><text class="no" x="128" y="162">no</text>
<rect class="preg" x="10" y="174" width="220" height="50" rx="10"/>
<text x="120" y="196" text-anchor="middle">¿Se CANCELA en cadena</text><text x="120" y="214" text-anchor="middle">(bₙ − bₙ₊₁, fracciones)?</text>
<path class="lin" d="M230 199 H256" marker-end="url(#fl)"/><text class="si" x="235" y="194">sí</text>
<rect class="fin" x="260" y="168" width="370" height="62" rx="10"/>
<text x="445" y="187" text-anchor="middle">Telescópica: sₙ = b₁ − bₙ₊₁ (lo de en</text>
<text x="445" y="205" text-anchor="middle">medio se cancela). Paso al límite de sₙ.</text>
<text x="445" y="223" text-anchor="middle">Fracciones simples si hace falta.</text>
<path class="lin" d="M120 224 V253" marker-end="url(#fl)"/><text class="no" x="128" y="244">no</text>
<rect class="preg" x="10" y="256" width="220" height="50" rx="10"/>
<text x="120" y="278" text-anchor="middle">¿Tiene SIGNOS variables</text><text x="120" y="296" text-anchor="middle">((−1)ⁿ, cos n…)?</text>
<path class="lin" d="M230 281 H256" marker-end="url(#fl)"/><text class="si" x="235" y="276">sí</text>
<rect class="fin" x="260" y="250" width="370" height="62" rx="10"/>
<text x="445" y="269" text-anchor="middle">Estudia primero Σ|aₙ| (comparación…).</text>
<text x="445" y="287" text-anchor="middle">Si converge: absolutamente convergente.</text>
<text x="445" y="305" text-anchor="middle">Si no y es alternada: Leibniz (2 hip.).</text>
<path class="lin" d="M120 306 V335" marker-end="url(#fl)"/><text class="no" x="128" y="326">no</text>
<rect class="preg" x="10" y="338" width="220" height="50" rx="10"/>
<text x="120" y="360" text-anchor="middle">¿Hay n!, aⁿ, nⁿ o un producto</text><text x="120" y="378" text-anchor="middle">que se alarga un factor?</text>
<path class="lin" d="M230 363 H256" marker-end="url(#fl)"/><text class="si" x="235" y="358">sí</text>
<rect class="fin" x="260" y="332" width="370" height="62" rx="10"/>
<text x="445" y="351" text-anchor="middle">Cociente aₙ₊₁/aₙ (aₙ&gt;0): ℓ&lt;1 converge,</text>
<text x="445" y="369" text-anchor="middle">ℓ&gt;1 no converge. Con ℓ=1 no decide:</text>
<text x="445" y="387" text-anchor="middle">vuelve a la comparación (último paso).</text>
<path class="lin" d="M120 388 V417" marker-end="url(#fl)"/><text class="no" x="128" y="408">no</text>
<rect class="preg" x="10" y="420" width="220" height="50" rx="10"/>
<text x="120" y="442" text-anchor="middle">¿Es una POTENCIA n-ésima</text><text x="120" y="460" text-anchor="middle">(…)ⁿ, o con exponente n²?</text>
<path class="lin" d="M230 445 H256" marker-end="url(#fl)"/><text class="si" x="235" y="440">sí</text>
<rect class="fin" x="260" y="414" width="370" height="62" rx="10"/>
<text x="445" y="433" text-anchor="middle">Raíz ⁿ√aₙ (aₙ&gt;0): ℓ&lt;1 converge, ℓ&gt;1 no.</text>
<text x="445" y="451" text-anchor="middle">Si queda xₙ^yₙ: logaritmos (y Stolz).</text>
<text x="445" y="469" text-anchor="middle">Con ℓ=1 no decide.</text>
<path class="lin" d="M120 470 V499" marker-end="url(#fl)"/><text class="no" x="128" y="490">no</text>
<rect class="preg" x="10" y="502" width="220" height="50" rx="10"/>
<text x="120" y="524" text-anchor="middle">¿Cociente de potencias de n,</text><text x="120" y="542" text-anchor="middle">con «ruido» acotado (cos n)?</text>
<path class="lin" d="M230 527 H256" marker-end="url(#fl)"/><text class="si" x="235" y="522">sí</text>
<rect class="fin" x="260" y="496" width="370" height="62" rx="10"/>
<text x="445" y="515" text-anchor="middle">Compara con Σ1/n^γ: mayora si converge</text>
<text x="445" y="533" text-anchor="middle">(γ&gt;1) y minora si diverge (γ≤1).</text>
<text x="445" y="551" text-anchor="middle">Quita el ruido acotado (cos n, 3+sen n).</text>
<path class="lin" d="M120 552 V581" marker-end="url(#fl)"/><text class="no" x="128" y="572">no</text>
<rect class="nada" x="10" y="584" width="620" height="40" rx="10"/><text x="320" y="609" text-anchor="middle">Relee el enunciado: casi todo lo que cae es uno de estos siete casos</text>
</svg>
