<div class="box def"><span class="h">Definición 1.17 (serie alternada)</span>
  <p>Una serie es <b>alternada</b> si sus términos son alternativamente positivos (o nulos) y negativos (o nulos). Ejemplo (U 1.40): $\sum(-1)^n$. Es habitual escribirla como $\sum(-1)^nc_n$ o $\sum(-1)^{n-1}c_n$ con $c_n\ge0$.</p>
