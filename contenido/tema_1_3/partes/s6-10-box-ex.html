<div class="box ex"><span class="h">Ejemplo (U 1.41)</span>
  <p>$\displaystyle\sum\frac{(-1)^n}n$. <i>No es absolutamente convergente</i>: $\sum\left|\frac{(-1)^n}n\right|=\sum\frac1n$ es la armónica, que no converge. <i>Sí converge</i>: es alternada, $\left\{\frac1n\right\}$ es decreciente y $\frac{(-1)^n}n\to0$; por Leibniz, converge.</p>
  <span class="src" data-l="U" data-ref="U Ejemplo 1.41, p. 41">U p.41</span>
</div>
