<div class="box thm"><span class="h">Serie telescópica</span>
  <p>Si $a_n=b_n-b_{n+1}$ para todo $n\ge1$, entonces
  $$s_n=(b_1-b_2)+(b_2-b_3)+\dots+(b_n-b_{n+1})=b_1-b_{n+1}.$$
  Por tanto $\sum a_n$ converge si y solo si $\{b_n\}$ converge, y entonces la suma es $b_1-\lim_{n\to\infty}b_n$.</p>
