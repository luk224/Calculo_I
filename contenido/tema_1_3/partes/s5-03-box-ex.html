<div class="box ex"><span class="h">Ejemplo (U 1.37): cociente</span>
  <p>$\displaystyle\sum\frac n{3^n}$. Con $a_n=\dfrac n{3^n}&gt;0$: $\dfrac{a_{n+1}}{a_n}=\dfrac{(n+1)/3^{n+1}}{n/3^n}=\dfrac{n+1}{3n}\to\dfrac13&lt;1$. La serie converge.</p>
