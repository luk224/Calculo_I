<div class="box thm"><span class="h">Proposición 1.7 (linealidad)</span>
  <p>Si $\sum a_n$ y $\sum b_n$ son <b>sumables</b> y $c\in\mathbb R$, entonces $\sum(a_n+b_n)$ y $\sum c\,a_n$ son sumables y
  $$\sum(a_n+b_n)=\sum a_n+\sum b_n,\qquad \sum c\,a_n=c\sum a_n .$$</p>
