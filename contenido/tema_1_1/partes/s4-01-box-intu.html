<div class="box intu"><span class="h">Idea intuitiva</span>
  <p>Un <b>intervalo</b> es un trozo de la recta real «de una sola pieza», sin cortes: un segmento o una semirrecta. Los paréntesis $(\ )$ dicen «este extremo <i>no</i> entra» (punto vacío ○) y los corchetes $[\ ]$ dicen «sí entra» (punto lleno ●).</p>
