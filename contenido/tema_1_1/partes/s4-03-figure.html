<figure>

  <line class="a" x1="230" y1="35" x2="450" y2="35"/><circle class="op" cx="230" cy="35" r="5.5"/><circle class="op" cx="450" cy="35" r="5.5"/>
  <text class="sm" x="230" y="58" text-anchor="middle">a</text><text class="sm" x="450" y="58" text-anchor="middle">b</text>

  <text x="8" y="95">[a, b]</text><line class="ax" x1="110" y1="90" x2="625" y2="90"/>

  <text class="sm" x="230" y="113" text-anchor="middle">a</text><text class="sm" x="450" y="113" text-anchor="middle">b</text>
