<ul class="trio">
  <li><b>Cómo lo reconoces:</b> un $|\cdot|$ en una desigualdad, o $x^2$ comparado con un número.</li>
  <li><b>Qué haces:</b> aplica el traductor: $|u|&lt;a\iff-a&lt;u&lt;a$; $|u|&gt;a\iff u&lt;-a$ o $u&gt;a$; con varios $|\cdot|$, trabaja por casos.</li>
  <li><b>Ejemplo mínimo:</b> $|x-3|&lt;4\iff-4&lt;x-3&lt;4\iff-1&lt;x&lt;7$.</li>
</ul>
