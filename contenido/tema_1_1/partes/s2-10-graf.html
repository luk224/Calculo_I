<figure class="graf" data-g='{"c":[{"e":"1+x","n":"y = 1 + x"},{"e":"7*x+5","n":"y = 7x + 5"}],"q":[[-0.6666666666666666,0.3333333333333333,"x = −2/3"]],"x":[-2,1],"y":[-9,7]}' data-alt="Rectas 1+x y 7x+5 que se cortan en x = −2/3"><figcaption>Las dos rectas se cortan en $x=-\tfrac23$ (punto marcado). A la derecha de ese punto la recta $1+x$ queda <b>por debajo</b> de $7x+5$: eso es $1+x&lt;7x+5\iff x&gt;-\tfrac23$. Pasa el ratón por la gráfica (o toca; o usa ← →) para leer las coordenadas. <span class="src" data-l="P" data-ref="Gráfica propia: curvas y valores calculados con las expresiones del enunciado y verificados con sympy">P</span></figcaption></figure>
