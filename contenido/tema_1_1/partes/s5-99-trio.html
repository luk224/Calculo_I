<ul class="trio">
  <li><b>Cómo lo reconoces:</b> preguntan si un conjunto está acotado, o te piden una cota.</li>
  <li><b>Qué haces:</b> busca un $M$ con $a\le M$ para todo $a\in A$; para negarlo, enseña elementos que superan a cualquier $M$ propuesto.</li>
  <li><b>Ejemplo mínimo:</b> $\mathbb N$ no está acotado superiormente (U Ej. 1.7, p.19).</li>
</ul>
