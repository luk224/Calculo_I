<div class="box intu"><span class="h">Idea intuitiva</span>
  <p>Ordenar dos números es decir cuál está <b>más a la izquierda</b> en la recta real. $x&lt;y$ significa «$x$ está a la izquierda de $y$»; $x\le y$ significa «a la izquierda o en el mismo punto». Negativos: a la izquierda del 0; positivos: a la derecha.</p>
