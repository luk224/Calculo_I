<div class="box intu"><span class="h">Idea intuitiva</span>
  <p>Cada familia de números nace de una necesidad: los <b>naturales</b> sirven para <i>contar</i>, los <b>enteros</b> para <i>restar</i> (poder «quedar a deber»), los <b>racionales</b> para <i>repartir</i> (proporciones), y los <b>reales</b> para <i>medir</i> cualquier longitud: la recta entera, sin huecos.</p>
  <span class="src" data-l="U" data-ref="U §1.1.2, p. 12">U p.12</span>
</div>
