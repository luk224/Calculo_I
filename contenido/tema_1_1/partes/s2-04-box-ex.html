<div class="box ex"><span class="h">Ejemplo (U 1.2): sumar desigualdades</span>
  <p>Si $x\le y$ y $z\le w$, entonces $x+z\le y+w$. <i>Prueba con las propiedades:</i> sumando $z$ a la primera (prop. 5): $x+z\le y+z$. Sumando $y$ a la segunda: $z+y\le w+y$. Como $y+z=z+y$, la transitividad (prop. 4) da $x+z\le y+w$.</p>

</div>
