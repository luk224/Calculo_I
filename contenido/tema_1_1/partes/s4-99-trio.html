<ul class="trio">
  <li><b>Cómo lo reconoces:</b> te dan un intervalo y piden centro y radio, o te dan $|x-c|&lt;r$ y piden el intervalo.</li>
  <li><b>Qué haces:</b> $c=\frac{a+b}2$, $r=\frac{b-a}2$ y $|x-c|&lt;r\iff x\in(c-r,c+r)$.</li>
  <li><b>Ejemplo mínimo:</b> $(-3,5]$ tiene centro $1$ y radio $4$.</li>
</ul>
