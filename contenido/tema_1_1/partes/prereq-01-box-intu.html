<div class="box intu"><span class="h">La idea del tema en una frase</span>
  <p>Con los números reales podemos <b>medir cualquier cosa</b> sin que «falte» ningún número en la recta. Todo el cálculo (límites, derivadas, integrales) se apoya en esa propiedad de «recta sin agujeros», que se formaliza con el <b>axioma del supremo</b>.</p>
