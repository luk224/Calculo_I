<div class="box tip"><span class="h">Cómo se niega «acotado superiormente»</span>
  <p>$A$ <b>no</b> está acotado superiormente $\iff$ para todo real $K$ existe $a\in A$ con $a&gt;K$ («supera cualquier techo»). Es la forma en que se prueba que $\mathbb N$ o $[0,\infty)$ no están acotados.</p>
  <span class="src" data-l="P" data-ref="Negación del cuantificador, propia">P</span>
</div>
