<div class="box thm"><span class="h">Teorema 1.1 (propiedades del valor absoluto)</span>
  <p>Para $x,y\in\mathbb R$:</p>
  <ol>
    <li>$|x|=0\iff x=0$.</li>
    <li>$|x+y|\le|x|+|y|$ (<b>desigualdad triangular</b>).</li>
    <li>$|x|-|y|\le|x-y|$. (Intercambiando $x$ e $y$ se obtiene también $|y|-|x|\le|x-y|$, o sea $\big||x|-|y|\big|\le|x-y|$.)</li>
  </ol>
  <span class="src" data-l="U" data-ref="U Teorema 1.1, p. 16">U p.16</span>
</div>
