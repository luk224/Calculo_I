<div class="box intu"><span class="h">Idea intuitiva</span>
  <p>El valor absoluto de $x$ es <b>cuánto te separas del 0</b>, sin importar hacia qué lado: $|3|=3$ y $|-3|=3$. Y $|x-y|$ es la <b>distancia</b> entre $x$ e $y$, ya sea $x&lt;y$ o $y&lt;x$. Las distancias nunca son negativas.</p>
