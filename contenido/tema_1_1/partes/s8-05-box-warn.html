<div class="box warn"><span class="h">Error típico</span>
  <p>Pensar que existe «el siguiente número» a otro: no hay un real inmediatamente mayor que $0$; entre $0$ y cualquier $\varepsilon&gt;0$ siempre cabe $\varepsilon/2$. Y no confundir «denso» con «igual»: $\mathbb Q$ es denso en $\mathbb R$ pero $\mathbb Q\neq\mathbb R$ (falta $\sqrt2$).</p>
</div>
