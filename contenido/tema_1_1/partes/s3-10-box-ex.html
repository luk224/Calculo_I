<div class="box ex"><span class="h">Ejemplo (U 1.3): un contraejemplo</span>
  <p>¿Es cierto que $x&lt;y\Rightarrow|x|&lt;|y|$? Parece falso por los negativos. Para demostrar que una afirmación general es falsa <b>basta un caso</b> en que no se cumpla: $x=-2$, $y=1$ verifican $-2&lt;1$ pero $|-2|=2&gt;1=|1|$. Es un <b>contraejemplo</b>.</p>
  <span class="src" data-l="U" data-ref="U Ejemplo 1.3, p. 16">U p.16</span>
</div>
