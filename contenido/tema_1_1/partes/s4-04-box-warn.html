<div class="box warn"><span class="h">Error típico</span>
  <p>$\infty$ <b>no es un número</b>: $(a,\infty)$ solo indica que el intervalo se extiende sin fin a la derecha; por eso el extremo infinito va <b>siempre con paréntesis</b>. Además, todos estos intervalos suponen $a&lt;b$: $(5,2)$ no es un intervalo con este significado.</p>
  <span class="src" data-l="S" data-ref="Stewart, Apéndice A, comentario sobre ∞ y Tabla 1, p. A4">S p.A4</span>
</div>
