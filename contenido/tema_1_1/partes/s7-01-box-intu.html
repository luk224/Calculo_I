<div class="box intu"><span class="h">Idea intuitiva</span>
  <p>La recta real <b>no tiene agujeros ni brechas</b>. Si vas bajando el techo (cotas cada vez menores), hay un número real donde se detiene: el supremo. Los racionales, en cambio, son como un colador: en el lugar de $\sqrt7$ hay un agujero.</p>
