<div class="box ex"><span class="h">U 1.12 y 1.13: cuando no existen</span>
  <p>$\inf\mathbb N=1$, pero $\sup\mathbb N$ no existe; $\mathbb Z$ no tiene ni supremo ni ínfimo. El conjunto $\{x\in\mathbb Q: x&lt;7\}$ no tiene ínfimo, pero su supremo es $7$.</p>
