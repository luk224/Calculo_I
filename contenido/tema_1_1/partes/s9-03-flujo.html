<svg class="flujo" viewBox="0 0 640 552" role="img" aria-labelledby="flujo-t flujo-d">
<title id="flujo-t">Mapa de decisión: qué tipo de problema tengo y qué hago</title>
<desc id="flujo-d">Diagrama de flujo vertical con seis preguntas. Si piden pasar entre intervalo y valor absoluto se usan el centro y el radio. Si piden resolver una desigualdad o un dominio se aplican los traductores del valor absoluto o la tabla de signos. Si piden supremo e ínfimo de un conjunto dado por una condición se pasa a intervalos y se leen los extremos. Si el conjunto es de términos de una sucesión se conjetura el valor y se prueba que es cota y que es la mejor. Si preguntan si algo se cumple siempre se busca un contraejemplo. Si piden acotar una expresión se acota cada variable, se combinan las desigualdades y se comprueba si las cotas se alcanzan.</desc>
<defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="preg" x="10" y="10" width="220" height="50" rx="10"/>
<text x="120" y="32" text-anchor="middle">¿Piden pasar entre un intervalo</text><text x="120" y="50" text-anchor="middle">y |x − c| &lt; r (centro, radio)?</text>
<path class="lin" d="M230 35 H256" marker-end="url(#fl)"/><text class="si" x="235" y="30">sí</text>
<rect class="fin" x="260" y="4" width="370" height="62" rx="10"/>
<text x="445" y="23" text-anchor="middle">c = (a+b)/2 y r = (b−a)/2.</text>
<text x="445" y="41" text-anchor="middle">|x − c| &lt; r  ⇔  x ∈ (c − r, c + r).</text>
<text x="445" y="59" text-anchor="middle">Con ≤, los extremos entran.</text>
<path class="lin" d="M120 60 V89" marker-end="url(#fl)"/><text class="no" x="128" y="80">no</text>
<rect class="preg" x="10" y="92" width="220" height="50" rx="10"/>
<text x="120" y="114" text-anchor="middle">¿Resolver una desigualdad</text><text x="120" y="132" text-anchor="middle">o hallar un DOMINIO?</text>
<path class="lin" d="M230 117 H256" marker-end="url(#fl)"/><text class="si" x="235" y="112">sí</text>
<rect class="fin" x="260" y="86" width="370" height="62" rx="10"/>
<text x="445" y="105" text-anchor="middle">Con |·|: −a &lt; u &lt; a (o por casos).</text>
<text x="445" y="123" text-anchor="middle">Cociente: todo a un lado y tabla de signos.</text>
<text x="445" y="141" text-anchor="middle">Raíz: radicando ≥ 0; denominador ≠ 0.</text>
<path class="lin" d="M120 142 V171" marker-end="url(#fl)"/><text class="no" x="128" y="162">no</text>
<rect class="preg" x="10" y="174" width="220" height="50" rx="10"/>
<text x="120" y="196" text-anchor="middle">¿Sup / ínf de un CONJUNTO</text><text x="120" y="214" text-anchor="middle">dado por una condición?</text>
<path class="lin" d="M230 199 H256" marker-end="url(#fl)"/><text class="si" x="235" y="194">sí</text>
<rect class="fin" x="260" y="168" width="370" height="62" rx="10"/>
<text x="445" y="187" text-anchor="middle">Lo paso a unión de intervalos: sup = mayor</text>
<text x="445" y="205" text-anchor="middle">extremo derecho, ínf = menor izquierdo.</text>
<text x="445" y="223" text-anchor="middle">Miro si pertenecen (máximo / mínimo).</text>
<path class="lin" d="M120 224 V253" marker-end="url(#fl)"/><text class="no" x="128" y="244">no</text>
<rect class="preg" x="10" y="256" width="220" height="50" rx="10"/>
<text x="120" y="278" text-anchor="middle">¿Sup / ínf de TÉRMINOS aₙ</text><text x="120" y="296" text-anchor="middle">con n ∈ ℕ?</text>
<path class="lin" d="M230 281 H256" marker-end="url(#fl)"/><text class="si" x="235" y="276">sí</text>
<rect class="fin" x="260" y="250" width="370" height="62" rx="10"/>
<text x="445" y="269" text-anchor="middle">Reescribo aₙ (p. ej. 1 + 3/n) y veo si sube o</text>
<text x="445" y="287" text-anchor="middle">baja. Conjeturo s y pruebo: (i) es cota,</text>
<text x="445" y="305" text-anchor="middle">(ii) la mejor (ε y arquimediana).</text>
<path class="lin" d="M120 306 V335" marker-end="url(#fl)"/><text class="no" x="128" y="326">no</text>
<rect class="preg" x="10" y="338" width="220" height="50" rx="10"/>
<text x="120" y="360" text-anchor="middle">¿Piden decidir si algo</text><text x="120" y="378" text-anchor="middle">se cumple SIEMPRE?</text>
<path class="lin" d="M230 363 H256" marker-end="url(#fl)"/><text class="si" x="235" y="358">sí</text>
<rect class="fin" x="260" y="332" width="370" height="62" rx="10"/>
<text x="445" y="351" text-anchor="middle">Pruebo casos por signo (negativos, 0).</text>
<text x="445" y="369" text-anchor="middle">Si falla: contraejemplo numérico concreto.</text>
<text x="445" y="387" text-anchor="middle">Si vale: lo demuestro con las reglas del orden.</text>
<path class="lin" d="M120 388 V417" marker-end="url(#fl)"/><text class="no" x="128" y="408">no</text>
<rect class="preg" x="10" y="420" width="220" height="50" rx="10"/>
<text x="120" y="442" text-anchor="middle">¿Piden ACOTAR una expresión</text><text x="120" y="460" text-anchor="middle">de variables acotadas?</text>
<path class="lin" d="M230 445 H256" marker-end="url(#fl)"/><text class="si" x="235" y="440">sí</text>
<rect class="fin" x="260" y="414" width="370" height="62" rx="10"/>
<text x="445" y="433" text-anchor="middle">Una desigualdad por variable; sumo (mismo</text>
<text x="445" y="451" text-anchor="middle">sentido) e invierto positivos (cambia).</text>
<text x="445" y="469" text-anchor="middle">Después miro si las cotas se alcanzan.</text>
<path class="lin" d="M120 470 V499" marker-end="url(#fl)"/><text class="no" x="128" y="490">no</text>
<rect class="nada" x="10" y="502" width="620" height="40" rx="10"/><text x="320" y="527" text-anchor="middle">Relee el enunciado: casi todo lo que cae es uno de estos seis tipos</text>
</svg>
