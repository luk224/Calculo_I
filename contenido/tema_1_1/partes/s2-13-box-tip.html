<div class="box tip"><span class="h">Truco de examen</span>
  <p>Ante una desigualdad polinómica: pasa todo a un lado, deja $0$ a la derecha, factoriza, marca las raíces en la recta y haz una tabla de signos o prueba un punto de cada trozo. Comprueba los extremos según sea $&lt;$ o $\le$. <span class="src" data-l="S" data-ref="Stewart, Apéndice A, Ejemplos 3-4, pp. A5-A6">S pp.A5-A6</span></p>
</div>
