<div class="box warn"><span class="h">Error típico</span>
  <p>Confundir «una cota superior» con «la mayor cifra del conjunto». Una cota superior es un número <i>cualquiera</i> por encima de todos (puede estar o no en $A$, y hay infinitas). Para $A=\{1,2,3\}$ son cotas superiores $3$, $3{,}5$, $100$. La que interesa después es la <i>menor</i>: el supremo.</p>
</div>
