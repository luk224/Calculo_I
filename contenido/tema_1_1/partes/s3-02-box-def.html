<div class="box def"><span class="h">Definición 1.1 (valor absoluto) y Definición 1.2 (distancia)</span>
  <p>$$|x|=\sqrt{x^2}=\begin{cases}x,&amp;x\ge0,\\-x,&amp;x&lt;0.\end{cases}$$
  La <b>distancia</b> entre $x$ e $y$ es el número no negativo $|x-y|$.</p>
