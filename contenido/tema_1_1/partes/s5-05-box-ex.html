<div class="box ex"><span class="h">Ejemplo: los intervalos acotados</span>
  <p>$[\pi,\,3e^2]$ es un conjunto acotado porque $\pi$ es cota inferior y $3e^2\approx22{,}2$ es cota superior. En general, todo intervalo $(a,b)$, $[a,b]$, $(a,b]$ o $[a,b)$ con $a&lt;b$ es acotado (cotas $a$ y $b$). Las semirrectas no lo son.</p>

</div>
