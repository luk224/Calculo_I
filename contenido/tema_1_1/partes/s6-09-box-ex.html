<div class="box ex"><span class="h">U 1.11: un conjunto de racionales con sup y ínf irracionales</span>
  <p>Para $A=\{x\in\mathbb Q: x^2\le7\}$: $\inf A=-\sqrt7$ y $\sup A=\sqrt7$, y ninguno pertenece a $A$. (Los supremos se toman en $\mathbb R$; en $\mathbb Q$ no existe el supremo de este conjunto: ver apartado 7.)</p>
