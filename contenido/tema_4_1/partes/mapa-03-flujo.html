<svg class="flujo" viewBox="0 0 600 504" role="img" aria-labelledby="flujo-t flujo-d">
<title id="flujo-t">Mapa de decisión del tema 4.1: qué hacer según lo que piden con vectores, conjuntos o coordenadas</title>
<desc id="flujo-d">Diagrama de flujo vertical. Si piden producto escalar, norma, distancia, ángulo u ortogonalidad, se aplican las fórmulas con el producto escalar. Si preguntan si una operación tiene sentido, se miran los tipos de los objetos. Si es un conjunto del plano, se lee la desigualdad como una distancia, se dibuja y se mira si el borde entra. Si piden cambiar de coordenadas, se calcula rho, se elige theta por el cuadrante y se comprueba volviendo a cartesianas. Al final se comprueba la respuesta.</desc>
<defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="preg" x="10" y="10" width="210" height="76" rx="10"/>
<text x="115" y="44" text-anchor="middle">¿Piden producto escalar, norma,</text>
<text x="115" y="62" text-anchor="middle">distancia, ángulo u ortogonalidad?</text>
<path class="lin" d="M220 48 H246" marker-end="url(#fl)"/>
<text class="si" x="225" y="43">sí</text>
<rect class="nodo" x="250" y="10" width="340" height="76" rx="10"/>
<text x="420" y="28" text-anchor="middle">Producto escalar: multiplica y SUMA (da un</text>
<text x="420" y="44" text-anchor="middle">número). Norma: raíz de la suma de cuadrados.</text>
<text x="420" y="60" text-anchor="middle">Distancia: norma de la resta. Ángulo:</text>
<text x="420" y="76" text-anchor="middle">cos α = x·y/(‖x‖‖y‖), α en [0, π]; ortogonal: x·y = 0</text>
<path class="lin" d="M115 86 V109" marker-end="url(#fl)"/>
<text class="no" x="123" y="102">no</text>
<rect class="preg" x="10" y="112" width="210" height="76" rx="10"/>
<text x="115" y="146" text-anchor="middle">¿Preguntan si una operación</text>
<text x="115" y="164" text-anchor="middle">«tiene sentido» (tipos)?</text>
<path class="lin" d="M220 150 H246" marker-end="url(#fl)"/>
<text class="si" x="225" y="145">sí</text>
<rect class="nodo" x="250" y="112" width="340" height="76" rx="10"/>
<text x="420" y="130" text-anchor="middle">Miro el tipo: vector·vector (mismo n) da un</text>
<text x="420" y="146" text-anchor="middle">número; número·vector da un vector. Tres</text>
<text x="420" y="162" text-anchor="middle">vectores, o uno de R² con uno de R³: no hay</text>
<text x="420" y="178" text-anchor="middle">producto escalar</text>
<path class="lin" d="M115 188 V211" marker-end="url(#fl)"/>
<text class="no" x="123" y="204">no</text>
<rect class="preg" x="10" y="214" width="210" height="76" rx="10"/>
<text x="115" y="248" text-anchor="middle">¿Es un conjunto del plano con</text>
<text x="115" y="266" text-anchor="middle">desigualdades (abierto, cerrado)?</text>
<path class="lin" d="M220 252 H246" marker-end="url(#fl)"/>
<text class="si" x="225" y="247">sí</text>
<rect class="nodo" x="250" y="214" width="340" height="76" rx="10"/>
<text x="420" y="232" text-anchor="middle">Leo la desigualdad como distancia al centro</text>
<text x="420" y="248" text-anchor="middle">y dibujo. &lt; no incluye el borde, ≤ sí. Frontera =</text>
<text x="420" y="264" text-anchor="middle">el borde. Abierto: no contiene su frontera;</text>
<text x="420" y="280" text-anchor="middle">cerrado: la contiene; acotado: cabe en un disco</text>
<path class="lin" d="M115 290 V313" marker-end="url(#fl)"/>
<text class="no" x="123" y="306">no</text>
<rect class="preg" x="10" y="316" width="210" height="76" rx="10"/>
<text x="115" y="350" text-anchor="middle">¿Piden cambiar de coordenadas</text>
<text x="115" y="368" text-anchor="middle">(polares, cilíndricas, esféricas)?</text>
<path class="lin" d="M220 354 H246" marker-end="url(#fl)"/>
<text class="si" x="225" y="349">sí</text>
<rect class="nodo" x="250" y="316" width="340" height="76" rx="10"/>
<text x="420" y="334" text-anchor="middle">ρ con la raíz y θ en [0, 2π) POR EL CUADRANTE.</text>
<text x="420" y="350" text-anchor="middle">Cilíndricas: polares y z igual. Esféricas:</text>
<text x="420" y="366" text-anchor="middle">ρ = √(x²+y²+z²), sen φ = z/ρ, φ en [−π/2, π/2].</text>
<text x="420" y="382" text-anchor="middle">Para volver: x = ρ cos θ, y = ρ sen θ</text>
<path class="lin" d="M115 392 V415" marker-end="url(#fl)"/>
<text class="no" x="123" y="408">no</text>
<rect class="fin" x="10" y="418" width="580" height="76" rx="10"/>
<text x="300" y="444" text-anchor="middle">Respondo con palabras y la unidad que toque (radianes).</text>
<text x="300" y="462" text-anchor="middle">Compruebo: ¿sumé en el producto escalar?, ¿signo al restar?,</text>
<text x="300" y="480" text-anchor="middle">¿norma ≥ 0?, ¿cuadrante de θ?, ¿entra el borde del conjunto?</text>
</svg>
