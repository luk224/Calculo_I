<div class="box tip"><span class="h">Truco de examen · cómo leer una desigualdad</span>
  <p>$(x-a)^2+(y-b)^2\ \square\ r^2$ significa «distancia al centro $(a,b)$ $\square$ $r$». Con «$&lt;$» o «$&gt;$»: sin borde (abierto). Con «$\le$» o «$\ge$»: con borde (cerrado). La frontera es siempre la igualdad.</p>
</div>
