<div class="box warn"><span class="h">Error típico</span>
  <p>«Abierto» y «cerrado» <b>no</b> son contrarios: un conjunto puede ser ninguno de los dos (una corona con un borde dentro y otro fuera: ver Propio 2), y $\mathbb R^2$ y $\emptyset$ son ambos. Tampoco confundas frontera con «exterior»: la frontera es el borde, no «todo lo que no es $C$».</p>
</div>
