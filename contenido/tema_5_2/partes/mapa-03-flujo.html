<svg class="flujo" viewBox="0 0 600 504" role="img" aria-labelledby="flujo-t flujo-d">
<title id="flujo-t">Mapa de decisión del tema 5.2: qué hacer según lo que piden sobre reglas de la diferencial, regla de la cadena o teorema del valor medio</title>
<desc id="flujo-d">Diagrama de flujo vertical. Si piden gradiente o plano de una suma, producto o cociente con datos en un punto, se usan las reglas de la diferencial. Si es una composición con una variable final o con datos abstractos, se suma un término por camino evaluando las parciales en el punto imagen. Si piden el gradiente de f(g,h) en un punto o una identidad con f genérica, se multiplica la fila del gradiente por la matriz de las intermedias. Si piden comparar valores, el signo, una cota o probar que es constante, se usa el teorema del valor medio en un convexo. Al final se comprueba la respuesta.</desc>
<defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="preg" x="10" y="10" width="210" height="76" rx="10"/>
<text x="115" y="44" text-anchor="middle">¿Piden gradiente o plano de f+g, fg, f/g</text>
<text x="115" y="62" text-anchor="middle">con datos de f y g en un punto?</text>
<path class="lin" d="M220 48 H246" marker-end="url(#fl)"/>
<text class="si" x="225" y="43">sí</text>
<rect class="nodo" x="250" y="10" width="340" height="76" rx="10"/>
<text x="420" y="36" text-anchor="middle">Calculo altura y gradiente del resultado en el punto:</text>
<text x="420" y="54" text-anchor="middle">∇(fg) = g∇f + f∇g; cociente (g∇f − f∇g)/g².</text>
<text x="420" y="72" text-anchor="middle">Plano: z = h(a,b) + h_x(x-a) + h_y(y-b).</text>
<path class="lin" d="M115 86 V109" marker-end="url(#fl)"/>
<text class="no" x="123" y="102">no</text>
<rect class="preg" x="10" y="112" width="210" height="76" rx="10"/>
<text x="115" y="146" text-anchor="middle">¿Es una composición con una variable final (t)</text>
<text x="115" y="164" text-anchor="middle">o con datos abstractos f(0)=…, f′(0)=…?</text>
<path class="lin" d="M220 150 H246" marker-end="url(#fl)"/>
<text class="si" x="225" y="145">sí</text>
<rect class="nodo" x="250" y="112" width="340" height="76" rx="10"/>
<text x="420" y="138" text-anchor="middle">Un sumando por camino: F'(t) = f_x·x' + f_y·y'.</text>
<text x="420" y="156" text-anchor="middle">Evalúo las parciales en el punto imagen;</text>
<text x="420" y="174" text-anchor="middle">con datos abstractos, derivo capa a capa.</text>
<path class="lin" d="M115 188 V211" marker-end="url(#fl)"/>
<text class="no" x="123" y="204">no</text>
<rect class="preg" x="10" y="214" width="210" height="76" rx="10"/>
<text x="115" y="248" text-anchor="middle">¿Piden el gradiente de f(g,h) en un punto</text>
<text x="115" y="266" text-anchor="middle">o una identidad con f genérica?</text>
<path class="lin" d="M220 252 H246" marker-end="url(#fl)"/>
<text class="si" x="225" y="247">sí</text>
<rect class="nodo" x="250" y="214" width="340" height="76" rx="10"/>
<text x="420" y="240" text-anchor="middle">Fila ∇f(punto imagen) por la matriz de filas ∇g, ∇h;</text>
<text x="420" y="258" text-anchor="middle">con f genérica, escribo f_r, f_s… y un sumando</text>
<text x="420" y="276" text-anchor="middle">por camino; después simplifico.</text>
<path class="lin" d="M115 290 V313" marker-end="url(#fl)"/>
<text class="no" x="123" y="306">no</text>
<rect class="preg" x="10" y="316" width="210" height="76" rx="10"/>
<text x="115" y="350" text-anchor="middle">¿Piden comparar valores de f, su signo,</text>
<text x="115" y="368" text-anchor="middle">una cota o probar que es constante?</text>
<path class="lin" d="M220 354 H246" marker-end="url(#fl)"/>
<text class="si" x="225" y="349">sí</text>
<rect class="nodo" x="250" y="316" width="340" height="76" rx="10"/>
<text x="420" y="342" text-anchor="middle">TVM: segmento en un convexo, f y parciales continuas;</text>
<text x="420" y="360" text-anchor="middle">f(a)−f(b) = ∇f(c)·(a−b). Razono con el signo</text>
<text x="420" y="378" text-anchor="middle">o con cotas; ∇f = 0 ⇒ constante.</text>
<path class="lin" d="M115 392 V415" marker-end="url(#fl)"/>
<text class="no" x="123" y="408">no</text>
<rect class="fin" x="10" y="418" width="580" height="76" rx="10"/>
<text x="300" y="444" text-anchor="middle">Respondo con el resultado y compruebo:</text>
<text x="300" y="462" text-anchor="middle">¿evalué las parciales en el punto imagen?, ¿un sumando por camino?,</text>
<text x="300" y="480" text-anchor="middle">¿orden fuera × dentro?, ¿el segmento está en un convexo?</text>
</svg>
