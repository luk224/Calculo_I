  <img class="int-static" src="../assets/img/int_cadena.png" alt="Interactivo 3D: una curva γ(t) recorre la superficie z=f(x,y); la derivada de f∘γ es el producto escalar del gradiente por la velocidad">
  <figcaption>Interactivo propio. Arrastra para girar. La curva verde del suelo es $\gamma(t)=(g(t),h(t))$ y la naranja es su imagen sobre la superficie, $t\mapsto f(\gamma(t))$. Mueve $t$: en el suelo salen la velocidad $\gamma'(t)$ (flecha azul) y el gradiente $\nabla f(\gamma(t))$ (flecha naranja, ambas dibujadas con longitud fija y con el valor numérico debajo), y el segmento naranja sobre la superficie es la tangente a la curva imagen, cuya pendiente por unidad de $t$ es $\frac{d}{dt}f(\gamma(t))=\frac{\partial f}{\partial x}g'+\frac{\partial f}{\partial y}h'=\nabla f\cdot\gamma'$. Es $0$ justo cuando velocidad y gradiente son perpendiculares (el punto avanza a lo largo de una curva de nivel) y máxima cuando apuntan igual. <span class="src" data-l="P" data-ref="Explicación propia; regla de la cadena con una variable final: U §5.2.2 p. 196">P</span></figcaption>
</figure>
