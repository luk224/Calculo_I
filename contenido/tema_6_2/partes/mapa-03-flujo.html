<svg class="flujo" viewBox="0 0 600 608" role="img" aria-labelledby="flujo-t flujo-d">
<title id="flujo-t">Mapa de decisión del tema 6.2: qué hacer según lo que piden sobre los teoremas fundamentales</title>
<desc id="flujo-d">Diagrama de flujo vertical. Si piden derivar una integral con límites variables, se usa el primer teorema con la regla de la cadena. Si piden crecimiento o extremos de una integral con límite variable, se estudia el signo de su derivada, que es el integrando. Si es un límite con una integral, se usa L'Hôpital y el primer teorema. Si piden calcular una integral definida, se usa la regla de Barrow. Si es un verdadero o falso sobre monotonía, se compara el signo de f y se busca un contraejemplo. Al final se comprueba la respuesta.</desc>
<defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="preg" x="10" y="10" width="210" height="76" rx="10"/>
<text x="115" y="40" text-anchor="middle">¿Piden la derivada de una integral</text>
<text x="115" y="58" text-anchor="middle">con límite(s) variable(s)?</text>
<path class="lin" d="M220 48 H246" marker-end="url(#fl)"/>
<text class="si" x="225" y="43">sí</text>
<rect class="nodo" x="250" y="10" width="340" height="76" rx="10"/>
<text x="420" y="44" text-anchor="middle">$\frac{d}{dx}\int_{a(x)}^{b(x)}f=f(b)\,b'-f(a)\,a'$;</text>
<text x="420" y="64" text-anchor="middle">$x$ abajo: signo menos. No calculo la integral.</text>
<path class="lin" d="M115 86 V109" marker-end="url(#fl)"/>
<text class="no" x="123" y="102">no</text>
<rect class="preg" x="10" y="112" width="210" height="76" rx="10"/>
<text x="115" y="142" text-anchor="middle">¿Piden crecimiento, extremos o</text>
<text x="115" y="160" text-anchor="middle">inflexión de $F(x)=\int_a^xf$?</text>
<path class="lin" d="M220 150 H246" marker-end="url(#fl)"/>
<text class="si" x="225" y="145">sí</text>
<rect class="nodo" x="250" y="112" width="340" height="76" rx="10"/>
<text x="420" y="146" text-anchor="middle">$F'=f$, $F''=f'$: signo de $f$ y ceros de $f$;</text>
<text x="420" y="166" text-anchor="middle">clasifico con el signo o con $f'$.</text>
<path class="lin" d="M115 188 V211" marker-end="url(#fl)"/>
<text class="no" x="123" y="204">no</text>
<rect class="preg" x="10" y="214" width="210" height="76" rx="10"/>
<text x="115" y="244" text-anchor="middle">¿Es un límite $\frac00$ con una</text>
<text x="115" y="262" text-anchor="middle">integral en el numerador?</text>
<path class="lin" d="M220 252 H246" marker-end="url(#fl)"/>
<text class="si" x="225" y="247">sí</text>
<rect class="nodo" x="250" y="214" width="340" height="76" rx="10"/>
<text x="420" y="248" text-anchor="middle">L'Hôpital: la derivada del numerador</text>
<text x="420" y="268" text-anchor="middle">es el integrando (primer teorema).</text>
<path class="lin" d="M115 290 V313" marker-end="url(#fl)"/>
<text class="no" x="123" y="306">no</text>
<rect class="preg" x="10" y="316" width="210" height="76" rx="10"/>
<text x="115" y="346" text-anchor="middle">¿Piden calcular $\int_a^bf$</text>
<text x="115" y="364" text-anchor="middle">con $f$ continua en $[a,b]$?</text>
<path class="lin" d="M220 354 H246" marker-end="url(#fl)"/>
<text class="si" x="225" y="349">sí</text>
<rect class="nodo" x="250" y="316" width="340" height="76" rx="10"/>
<text x="420" y="350" text-anchor="middle">Primitiva (comprobada derivando)</text>
<text x="420" y="370" text-anchor="middle">y $F(b)-F(a)$; con trozos, parto el intervalo.</text>
<path class="lin" d="M115 392 V415" marker-end="url(#fl)"/>
<text class="no" x="123" y="408">no</text>
<rect class="preg" x="10" y="418" width="210" height="76" rx="10"/>
<text x="115" y="448" text-anchor="middle">¿Es un V/F sobre «$f$ monótona</text>
<text x="115" y="466" text-anchor="middle">$\Rightarrow$ $F$ monótona»?</text>
<path class="lin" d="M220 456 H246" marker-end="url(#fl)"/>
<text class="si" x="225" y="451">sí</text>
<rect class="nodo" x="250" y="418" width="340" height="76" rx="10"/>
<text x="420" y="452" text-anchor="middle">Monotonía de $F$ = signo de $f$; busco</text>
<text x="420" y="472" text-anchor="middle">contraejemplo con $e^{-x}$ o $-e^{-x}$.</text>
<path class="lin" d="M115 494 V517" marker-end="url(#fl)"/>
<text class="no" x="123" y="510">no</text>
<rect class="fin" x="10" y="520" width="580" height="76" rx="10"/>
<text x="300" y="546" text-anchor="middle">Respondo y compruebo:</text>
<text x="300" y="564" text-anchor="middle">¿integrando continuo?, ¿factor de la cadena?, ¿signo con la $x$ abajo?,</text>
<text x="300" y="582" text-anchor="middle">¿primitiva comprobada derivando?, ¿$F(b)-F(a)$ y no al revés?</text>
</svg>
