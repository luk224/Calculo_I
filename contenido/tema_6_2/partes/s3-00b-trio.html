<ul class="trio">
  <li><b>Cómo lo reconoces:</b> «Calcula $\int_a^bf$» con $f$ continua y una primitiva sencilla; «¿se puede aplicar Barrow?».</li>
  <li><b>Qué haces:</b> Compruebas la continuidad en $[a,b]$, encuentras una primitiva comprobándola derivando y calculas $F(b)-F(a)$.</li>
  <li><b>Ejemplo mínimo:</b> $\int_0^1e^x\,dx=e-1$.</li>
</ul>
