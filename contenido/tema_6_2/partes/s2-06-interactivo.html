  <figcaption>Interactivo propio. Mueve $x$: el área sombreada es $F(x)=\int_a^xf$ (sobre el eje suma, bajo el eje resta), la curva gruesa es la propia $F$ y la recta es su tangente en $x$. Su pendiente coincide con la altura $f(x)$ de la curva fina (primer teorema): con $\cos t$ desde $0$ y $x=1$ (alcanzable: el paso es $0{,}01$) se lee $F=\operatorname{sen}1=0{,}8415$ y $f=\cos1=0{,}5403$; cuando $f$ cruza el eje, la tangente de $F$ es horizontal y $F$ tiene un máximo o un mínimo. Con $t\operatorname{sen}t$ (arrastra hasta $x\approx21{,}99=7\pi$) ves el máximo de E 6.13 y con $e^{-t^2}$ la función de U Ej. 6.5. <span class="src" data-l="P" data-ref="Explicación propia; ejemplos de U Ej. 6.5 y E 6.13">P</span></figcaption>
