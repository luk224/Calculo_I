<div class="box tip"><span class="h">Observaciones</span>
  <p>El Teorema 6.2 es válido para <b>cualquier</b> primitiva de $f$ (si se toma $F+C$, la constante se cancela en la resta). El teorema no dice cómo hallar la primitiva ni si se puede expresar con funciones elementales: eso es el tema de §6.3.</p>
