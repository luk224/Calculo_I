<p class="enun"><b>(a)</b> «Si $f:\mathbb R\to\mathbb R$ es estrictamente creciente y $f(-1)&lt;0&lt;f(1)$, entonces $f(x)=0$ tiene al menos una solución». <b>(b)</b> $f:[-1,1]\to\mathbb R$ continua con $f(-1)=-3$, $f(1)=3$: ¿es única la solución de $f(x)=0$? <b>(c)</b> ¿Alcanza $f(x)=x^3\cos(x+1)$ máximo y mínimo absolutos en $[-\pi,\pi]$?</p>
