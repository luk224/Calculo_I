<p>¿Se puede extender $f(x)=x^2\operatorname{sen}\frac1x$ a $x=0$ de forma continua? Como $\big|x^2\operatorname{sen}\frac1x\big|\le x^2\to0$, por el emparedado el límite es $0$: sí, con $f(0)=0$.</p>
<figure class="graf" data-g='{"c":[{"e":"x**2*sin(1/x)","n":"f(x) = x²·sen(1/x)"},{"e":"x**2","n":"x²","d":1},{"e":"-(x**2)","n":"−x²","d":1}],"q":[[0,0,"límite = 0"]],"x":[-0.6,0.6],"y":[-0.4,0.4]}' data-alt="x²·sen(1/x) entre −x² y x²"><figcaption>La curva oscila pero queda encerrada entre $-x^2$ y $x^2$ (curvas de puntos), que se juntan en $0$: el límite es $0$ y se extiende con $f(0)=0$. Pasa el ratón por la gráfica (o toca; o usa ← →) para leer las coordenadas. <span class="src" data-l="P" data-ref="Gráfica propia: curvas y valores calculados con las expresiones del enunciado y verificados con sympy">P</span></figcaption></figure>
