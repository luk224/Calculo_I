<p class="enun">Tenemos $f:[0,1]\to\mathbb R$ continua, con $f(0)=-1$ y $f(1)=4$. Buscamos una solución aproximada de $f(x)=0$ en $[0,1]$ por bisección. ¿Cuántas iteraciones son necesarias para asegurar que el error es menor que $0{,}11$? a) No se puede aplicar el método. b) Faltan datos. c) 3. d) 4.</p>
