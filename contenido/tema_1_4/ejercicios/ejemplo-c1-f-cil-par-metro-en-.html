<p class="enun">Hallar $a$ para que $f(x)=\begin{cases}x^2+a,&amp;x&lt;1,\\2x+3,&amp;x\ge1\end{cases}$ sea continua.</p>
  <p>Fuera de $1$ es continua (polinomios). En $1$: $\lim_{x\to1^-}f=1+a$ y $\lim_{x\to1^+}f=5=f(1)$. Por el Teorema 1.4, para que haya límite $1+a=5$: <b>$a=4$</b>.</p>
<figure class="graf" data-g='{"c":[{"e":"x&lt;1?x**2+4:2*x+3","n":"f(x) con a = 4"}],"q":[[1,5,"f(1) = 5"]],"x":[-2,3]}' data-alt="Función a trozos continua con a=4"><figcaption>Con $a=4$ las dos ramas ($x^2+4$ a la izquierda y $2x+3$ a la derecha) se encuentran en el punto $(1,5)$ sin salto. Pasa el ratón por la gráfica (o toca; o usa ← →) para leer las coordenadas. <span class="src" data-l="P" data-ref="Gráfica propia: curvas y valores calculados con las expresiones del enunciado y verificados con sympy">P</span></figcaption></figure>
