<div class="recipe"><b>Receta:</b> $n$ = menor entero con $2^n>\frac{b-a}\varepsilon$.</div>
  <p class="mismo"><i>Mismo método que el Ejercicio 1.41, resuelto paso a paso más arriba.</i></p>
  <p>En $[0,1]$, error menor que $10^{-3}$: $n&gt;\log_21000\approx9{,}97$, luego <b>$n=10$</b> ($2^{10}=1024&gt;1000$).</p>
