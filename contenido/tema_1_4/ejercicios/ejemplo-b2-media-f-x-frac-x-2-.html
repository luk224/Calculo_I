<p><b>Vertical</b> $x=-1$ (numerador $=4&gt;0$; $-1^-$: $-\infty$; $-1^+$: $+\infty$). <b>Horizontales:</b> ninguna. <b>Oblicua:</b> $m=\lim_{x\to\pm\infty}\frac{x^2-3x}{x^2+x}=1$ y $b=\lim_{x\to\pm\infty}\frac{-4x}{x+1}=-4$: $y=x-4$ en ambos lados. Por división: $x^2-3x=(x+1)(x-4)+4$.</p>
