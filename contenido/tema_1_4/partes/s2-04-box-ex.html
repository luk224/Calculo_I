<div class="box ex"><span class="h">Ejemplo 1.42 (¿en qué puntos tiene sentido el límite?)</span>
  <p>Si una función está definida en $(0,1)\cup\{2\}$, tiene sentido hablar de su límite en cualquier punto de $[0,1]$, pero <b>no en $2$</b> ni en ningún otro punto de $\mathbb R$: en $2$ no hay puntos del dominio cerca de $2$ distintos de $2$.</p>
