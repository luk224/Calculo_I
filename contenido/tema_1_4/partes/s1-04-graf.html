<figure class="graf" data-g='{"c":[{"e":"log(x**2-4)+sqrt(5-x)","n":"y = ln(x²−4) + √(5−x)"}],"x":[-5,6],"y":[-5,7]}' data-alt="Gráfica de ln(x²−4)+√(5−x), que solo existe en (−∞,−2) y (2,5]"><figcaption>La curva solo existe donde la función tiene sentido: a la izquierda de $-2$, y entre $2$ y $5$. En $(-2,2]$ el logaritmo no está definido, y a la derecha de $5$ falla la raíz cuadrada. Cerca de $\pm2$ la curva cae hacia $-\infty$ (el logaritmo de algo que tiende a $0^+$). Pasa el ratón por la gráfica (o toca; o usa ← →) para leer las coordenadas. <span class="src" data-l="P" data-ref="Gráfica propia: curvas y valores calculados con las expresiones del enunciado y verificados con sympy">P</span></figcaption></figure>
