  <figcaption>Interactivo propio. Sube el número de iteraciones $n$: la gráfica muestra $f$ y, debajo, cada fila es el intervalo $[a_k,b_k]$ de la iteración $k$ (la fila de arriba es el inicial y cada una mide la mitad que la anterior). La barra verde sobre el eje es el intervalo actual y el punto azul es la raíz. Con el Ejemplo 1.49 ($e^{-x}-x$ en $[0,1]$) los puntos medios son $0{,}5;\ 0{,}75;\ 0{,}625;\ 0{,}5625$, como en la tabla de U. La cota $(b-a)/2^n$ baja a la mitad en cada paso y el error real siempre queda por debajo. <span class="src" data-l="P" data-ref="Explicación propia; método de bisección y cota de error: U §1.4.3 pp. 53-56, Ej. 1.49">P</span></figcaption>
</figure>
