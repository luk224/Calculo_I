<div class="box intu"><span class="h">Idea intuitiva</span>
  <p>Ir hacia $a$ «por la izquierda» ($x&lt;a$) puede dar un resultado distinto que hacerlo «por la derecha» ($x&gt;a$): piensa en llegar a un escalón desde abajo o desde arriba. Cada lado tiene su límite. La función tiene límite <b>solo si los dos lados están de acuerdo</b>.</p>
</div>
