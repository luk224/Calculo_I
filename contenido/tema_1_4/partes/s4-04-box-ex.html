<div class="box ex"><span class="h">Ejemplo 1.46: $f(x)=\frac1x$ en $0$</span>
  <p>$\lim_{x\to0^+}\frac1x=+\infty$ y $\lim_{x\to0^-}\frac1x=-\infty$. Los laterales son distintos, así que <b>no hay límite en $0$</b> (aunque cada lateral «existe» como límite infinito).</p>
  <span class="src" data-l="U" data-ref="U Ejemplo 1.46, p. 47">U p.47</span>
</div>
