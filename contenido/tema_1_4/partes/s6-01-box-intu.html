<div class="box intu"><span class="h">Idea intuitiva</span>
  <p>Ahora $x$ se va «muy lejos» en la recta, a la derecha ($+\infty$) o a la izquierda ($-\infty$), y preguntamos si $f(x)$ se estabiliza en un número. Es el análogo de la convergencia de una sucesión ($n\to\infty$), pero con $x$ real y con dos direcciones posibles.</p>
</div>
