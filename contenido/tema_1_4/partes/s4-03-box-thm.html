<div class="box thm"><span class="h">Teorema 1.4 (límite ⇔ límites laterales)</span>
  <p>Si $f:D\to\mathbb R$ y $l\in\mathbb R$: $\quad\displaystyle\lim_{x\to a}f(x)=l\iff\lim_{x\to a^-}f(x)=\lim_{x\to a^+}f(x)=l.$</p>
  <p>Por tanto una función puede tener límites laterales y <b>no tener límite</b>.</p>
  <span class="src" data-l="U" data-ref="U Teorema 1.4, p. 47">U p.47</span>
</div>
