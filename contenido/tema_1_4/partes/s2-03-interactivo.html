  <figcaption>Interactivo propio: el juego de la tolerancia. La banda verde horizontal es $(L-\varepsilon,L+\varepsilon)$ y la azul vertical es $(a-\delta,a+\delta)$. La parte de la gráfica sobre la banda vertical (sin el punto $x=a$) se pinta verde si está dentro de la verde y naranja si se sale. Fija un $\varepsilon$ y busca un $\delta$ que deje todo en verde; abajo sale el mayor $\delta$ que sirve. Con $x^2$ en $a=1$ y $\varepsilon=0{,}5$ sale $\delta\approx0{,}225$. Prueba $x/|x|$ en $0$: por pequeño que sea $\delta$, el lado izquierdo se sale, así que no hay límite. <span class="src" data-l="P" data-ref="Explicación propia; definición de límite: U Definición 1.18 §1.4.2 p. 43">P</span></figcaption>
