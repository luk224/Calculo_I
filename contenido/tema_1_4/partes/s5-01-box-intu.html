<div class="box intu"><span class="h">Idea intuitiva</span>
  <p>Decir $\lim_{x\to a}f(x)=\infty$ es decir que $f(x)$ <b>supera cualquier cota</b> que se fije, con tal de acercarse lo bastante a $a$. Ninguna cota, por grande que sea, es un «techo». Como la gráfica «sube por una pared», aparece una <b>asíntota vertical</b>.</p>
</div>
