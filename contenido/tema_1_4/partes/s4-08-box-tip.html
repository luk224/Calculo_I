<div class="box tip"><span class="h">Truco de examen</span>
  <p>Cuando la fórmula <b>cambia a cada lado</b> de $a$ (valor absoluto, función a trozos, cociente que cambia de signo), calcula los <b>dos laterales por separado</b> y compáralos con el Teorema 1.4. Si el límite en $a$ es la única pregunta y salen distintos, la respuesta es «no existe».</p>
</div>
