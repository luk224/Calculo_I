<div class="box thm"><span class="h">Teorema de Bolzano</span>
  <p>Si $f:[a,b]\to\mathbb R$ es <b>continua</b> y $f(a)\cdot f(b)&lt;0$ (es decir, $f(a)$ y $f(b)$ tienen distinto signo), entonces existe al menos un $c\in(a,b)$ tal que $f(c)=0$.</p>
  <span class="src" data-l="U" data-ref="U Teorema de Bolzano, p. 52">U p.52</span>
</div>
