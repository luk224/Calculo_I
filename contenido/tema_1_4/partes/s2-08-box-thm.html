<div class="box thm"><span class="h">Unicidad del límite</span>
  <p>El límite de una función en un punto puede existir o no, pero <b>si existe, es único</b> (se demuestra igual que para sucesiones). Por eso puede hablarse de «el» límite.</p>
  <span class="src" data-l="U" data-ref="U Unicidad del límite, p. 44">U p.44</span>
</div>
