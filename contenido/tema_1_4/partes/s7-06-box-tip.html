<div class="box tip"><span class="h">Truco: por división de polinomios</span>
  <p>Si $f=\frac PQ$ con $\operatorname{gr}P=\operatorname{gr}Q+1$, divide: $f(x)=mx+b+\frac{r(x)}{Q(x)}$ con $\operatorname{gr}r&lt;\operatorname{gr}Q$. El resto $\frac rQ\to0$, así que $y=mx+b$ es la asíntota (en ambos lados). Ejemplo: Ej. 1.29.</p>
  <span class="src" data-l="L" data-ref="Larson §3.5, asíntota oblicua, p. 201">L p.201</span>
  <span class="src" data-l="S" data-ref="Stewart §4.5, Asíntotas inclinadas: definición al final de la p. 315, Ejemplo 6 (por división larga) en p. 316">S pp.315-316</span>
</div>
