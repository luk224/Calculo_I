<svg class="flujo" viewBox="0 0 640 552" role="img" aria-labelledby="flujo-t flujo-d">
<title id="flujo-t">Mapa de decisión: qué tipo de problema tengo y qué hago</title>
<desc id="flujo-d">Diagrama de flujo vertical con seis preguntas. Si piden un límite se sustituye y se elige la herramienta según lo que salga. Si piden asíntotas se estudian laterales, límites en el infinito y la pendiente y ordenada de la oblicua. Si piden continuidad se igualan el valor y los dos límites laterales. Si piden probar que existe una solución se usan Bolzano, valores intermedios o Weierstrass. Si piden aproximar una raíz se usa la bisección con la cota del error. Si piden el dominio se imponen las condiciones de cada pieza.</desc>
<defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="preg" x="10" y="10" width="220" height="50" rx="10"/>
<text x="120" y="32" text-anchor="middle">¿Piden un LÍMITE</text><text x="120" y="50" text-anchor="middle">(en un punto o en ±∞)?</text>
<path class="lin" d="M230 35 H256" marker-end="url(#fl)"/><text class="si" x="235" y="30">sí</text>
<rect class="fin" x="260" y="4" width="370" height="62" rx="10"/>
<text x="445" y="23" text-anchor="middle">Sustituyo y miro qué sale: número → listo;</text>
<text x="445" y="41" text-anchor="middle">c/0 → signo de cada lado; 0/0, ∞/∞, 1^∞…</text>
<text x="445" y="59" text-anchor="middle">→ cuadro «Si al sustituir sale…» ↓</text>
<path class="lin" d="M120 60 V89" marker-end="url(#fl)"/><text class="no" x="128" y="80">no</text>
<rect class="preg" x="10" y="92" width="220" height="50" rx="10"/>
<text x="120" y="122" text-anchor="middle">¿Piden ASÍNTOTAS?</text>
<path class="lin" d="M230 117 H256" marker-end="url(#fl)"/><text class="si" x="235" y="112">sí</text>
<rect class="fin" x="260" y="86" width="370" height="62" rx="10"/>
<text x="445" y="105" text-anchor="middle">Vertical: laterales donde Q(x)=0.</text>
<text x="445" y="123" text-anchor="middle">Horizontal: límite en +∞ y en −∞.</text>
<text x="445" y="141" text-anchor="middle">Oblicua: m y b, lado por lado.</text>
<path class="lin" d="M120 142 V171" marker-end="url(#fl)"/><text class="no" x="128" y="162">no</text>
<rect class="preg" x="10" y="174" width="220" height="50" rx="10"/>
<text x="120" y="196" text-anchor="middle">¿Piden CONTINUIDAD o</text><text x="120" y="214" text-anchor="middle">hallar un parámetro?</text>
<path class="lin" d="M230 199 H256" marker-end="url(#fl)"/><text class="si" x="235" y="194">sí</text>
<rect class="fin" x="260" y="168" width="370" height="62" rx="10"/>
<text x="445" y="187" text-anchor="middle">f(a) = límite izquierdo = límite derecho.</text>
<text x="445" y="205" text-anchor="middle">Despejo el parámetro. Composición:</text>
<text x="445" y="223" text-anchor="middle">continua si cada pieza lo es (Prop. 1.14).</text>
<path class="lin" d="M120 224 V253" marker-end="url(#fl)"/><text class="no" x="128" y="244">no</text>
<rect class="preg" x="10" y="256" width="220" height="50" rx="10"/>
<text x="120" y="278" text-anchor="middle">¿Piden probar que EXISTE</text><text x="120" y="296" text-anchor="middle">una solución o un valor?</text>
<path class="lin" d="M230 281 H256" marker-end="url(#fl)"/><text class="si" x="235" y="276">sí</text>
<rect class="fin" x="260" y="250" width="370" height="62" rx="10"/>
<text x="445" y="269" text-anchor="middle">Continua en [a,b] + signos opuestos: Bolzano</text>
<text x="445" y="287" text-anchor="middle">o d entre f(a) y f(b): valores intermedios.</text>
<text x="445" y="305" text-anchor="middle">Máximo y mínimo: Weierstrass en [a,b].</text>
<path class="lin" d="M120 306 V335" marker-end="url(#fl)"/><text class="no" x="128" y="326">no</text>
<rect class="preg" x="10" y="338" width="220" height="50" rx="10"/>
<text x="120" y="360" text-anchor="middle">¿Piden APROXIMAR una raíz</text><text x="120" y="378" text-anchor="middle">o contar iteraciones?</text>
<path class="lin" d="M230 363 H256" marker-end="url(#fl)"/><text class="si" x="235" y="358">sí</text>
<rect class="fin" x="260" y="332" width="370" height="62" rx="10"/>
<text x="445" y="351" text-anchor="middle">Bisección: n con (b−a)/2ⁿ &lt; ε.</text>
<text x="445" y="369" text-anchor="middle">Tabla a, b, c, f(c): me quedo con la</text>
<text x="445" y="387" text-anchor="middle">mitad donde los signos son opuestos.</text>
<path class="lin" d="M120 388 V417" marker-end="url(#fl)"/><text class="no" x="128" y="408">no</text>
<rect class="preg" x="10" y="420" width="220" height="50" rx="10"/>
<text x="120" y="450" text-anchor="middle">¿Piden el DOMINIO?</text>
<path class="lin" d="M230 445 H256" marker-end="url(#fl)"/><text class="si" x="235" y="440">sí</text>
<rect class="fin" x="260" y="414" width="370" height="62" rx="10"/>
<text x="445" y="433" text-anchor="middle">Una condición por pieza: denominador ≠ 0,</text>
<text x="445" y="451" text-anchor="middle">raíz de índice par ≥ 0, logaritmo > 0.</text>
<text x="445" y="469" text-anchor="middle">Resuelvo el sistema de condiciones.</text>
<path class="lin" d="M120 470 V499" marker-end="url(#fl)"/><text class="no" x="128" y="490">no</text>
<rect class="nada" x="10" y="502" width="620" height="40" rx="10"/><text x="320" y="527" text-anchor="middle">Relee el enunciado: casi todo lo que cae es uno de estos seis tipos</text>
</svg>
