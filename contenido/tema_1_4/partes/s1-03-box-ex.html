<div class="box ex"><span class="h">Ejemplo resuelto: dominio de una función compuesta</span>
  <p>Dominio de $f(x)=\ln(x^2-4)+\sqrt{5-x}$.</p>
  <ol class="steps">
    <li>El logaritmo exige argumento positivo: $x^2-4&gt;0\iff x&lt;-2$ o $x&gt;2$.</li>
    <li>La raíz cuadrada exige radicando $\ge0$: $5-x\ge0\iff x\le5$.</li>
    <li>Se cumplen las dos a la vez: $D=(-\infty,-2)\cup(2,5]$.</li>
  </ol>
  <span class="src" data-l="P" data-ref="Ejemplo propio (verificado con sympy)">P</span>
</div>
