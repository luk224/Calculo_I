<div class="box thm"><span class="h">Regla del emparedado</span>
  <p>Si $\displaystyle\lim_{x\to a}f(x)=\lim_{x\to a}g(x)=l$ y $f(x)\le h(x)\le g(x)$ para todo $x$ del dominio de $h$, entonces $\displaystyle\lim_{x\to a}h(x)=l$. (Como el límite es local, basta que las desigualdades valgan cerca de $a$.)</p>
