<div class="box ex"><span class="h">Ejemplo 1.47</span>
  <p>$f(x)=\dfrac{x^2-x+1}{x^2+1}$. Se divide numerador y denominador entre el monomio de mayor grado, $x^2$:
  $$\lim_{x\to\infty}f(x)=\lim_{x\to\infty}\frac{1-\frac1x+\frac1{x^2}}{1+\frac1{x^2}}=\frac{1-0+0}{1+0}=1,$$
  y de forma análoga $\lim_{x\to-\infty}f(x)=1$.</p>

</div>
