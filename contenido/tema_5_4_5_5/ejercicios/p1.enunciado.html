<p class="enun">Halla y clasifica los puntos críticos de $f(x,y)=x^2+xy+y^2-3x$.</p>
<div class="plan"><span class="h">Antes de calcular</span><dl>
    <dt>Qué me piden</dt><dd>Todos los puntos con gradiente nulo y su tipo.</dd>
    <dt>Cómo lo pienso</dt><dd>Es un polinomio de grado 2: el sistema es lineal y la Hessiana es constante.</dd>
    <dt>Por dónde empiezo</dt><dd>$f_x=0$ y $f_y=0$.</dd>
  </dl></div>
