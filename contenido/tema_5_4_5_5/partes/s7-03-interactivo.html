  <figcaption>Interactivo propio. El punto recorre la restricción $g=0$ (curva del mismo color que el texto). La curva naranja es la curva de nivel de $f$ que pasa por él; la flecha azul es $\nabla f$ y la verde $\nabla g$. Mueve el deslizador: en general la curva naranja <i>corta</i> a la restricción (y $\nabla f$, $\nabla g$ no son paralelos, el producto $f_xg_y-f_yg_x$ no es $0$); solo en los candidatos de Lagrange la curva naranja <i>roza</i> la restricción y las flechas quedan alineadas, y se muestra $\lambda$. Cuatro problemas de este tema (E 5.42, U Ej. 5.24, X sept. 2017 y X p. 9). Es la situación de la Figura 5.13 de U. Rueda: zoom. <span class="src" data-l="P" data-ref="Explicación propia sobre U pp. 226-228 (Figura 5.13, p. 227); problemas de E 5.42 (p. 203), U Ej. 5.24 (p. 229), X p.134 y X p.9">P</span></figcaption>
