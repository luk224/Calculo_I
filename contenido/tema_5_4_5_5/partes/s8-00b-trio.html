<ul class="trio">
  <li><b>Cómo lo reconoces:</b> Problemas con tres variables o con modelización (volumen, área, distancia).</li>
  <li><b>Qué haces:</b> Modelizas, planteas $F$, resuelves por casos y compruebas con el sentido físico o con el compacto.</li>
  <li><b>Ejemplo mínimo:</b> Lata de volumen fijo: minimizar el área con $g=\pi r^2h-V$.</li>
</ul>
