<div class="box tip"><span class="h">Truco de examen · el orden en que se mira</span>
  <p>Primero $d$. Si $d\lt0$, <b>silla</b> y se acabó (no hace falta $r$). Si $d\gt0$, mirar el signo de $r$ (o de $u$: tienen el mismo signo). Si $d=0$, la Hessiana no decide: se <b>compara $f(x,y)$ con $f(a,b)$ a mano</b> (E 5.33).</p>
