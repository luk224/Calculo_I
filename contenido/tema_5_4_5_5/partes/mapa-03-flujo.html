<svg class="flujo" viewBox="0 0 600 506" role="img" aria-labelledby="flujo-t flujo-d">
<title id="flujo-t">Mapa de decisión del tema 5.4-5.5: qué hacer según lo que piden sobre extremos</title>
<desc id="flujo-d">Diagrama de flujo vertical. Si piden puntos críticos o clasificarlos en un abierto, se resuelve gradiente cero y se usa la Hessiana. Si preguntan por la existencia de extremos absolutos, se comprueba que el conjunto es cerrado y acotado. Si piden extremos absolutos en un recinto, se estudian interior y frontera y se compara. Si hay restricción o distancia, se usan multiplicadores de Lagrange. Al final se comprueba la respuesta.</desc>
<defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="preg" x="10" y="10" width="210" height="76" rx="10"/>
<text x="115" y="40" text-anchor="middle">¿Piden clasificar o hallar puntos</text>
<text x="115" y="58" text-anchor="middle">críticos de $f$ en un abierto?</text>
<path class="lin" d="M220 48 H246" marker-end="url(#fl)"/>
<text class="si" x="225" y="43">sí</text>
<rect class="nodo" x="250" y="10" width="340" height="76" rx="10"/>
<text x="420" y="44" text-anchor="middle">Resuelvo $\nabla f=\bar0$ por casos y</text>
<text x="420" y="64" text-anchor="middle">clasifico cada crítico con $d$ y $r$.</text>
<path class="lin" d="M115 86 V109" marker-end="url(#fl)"/>
<text class="no" x="123" y="102">no</text>
<rect class="preg" x="10" y="112" width="210" height="76" rx="10"/>
<text x="115" y="142" text-anchor="middle">¿Preguntan si el máximo o mínimo</text>
<text x="115" y="160" text-anchor="middle">absoluto existe?</text>
<path class="lin" d="M220 150 H246" marker-end="url(#fl)"/>
<text class="si" x="225" y="145">sí</text>
<rect class="nodo" x="250" y="112" width="340" height="76" rx="10"/>
<text x="420" y="146" text-anchor="middle">Compruebo si el conjunto es cerrado y</text>
<text x="420" y="166" text-anchor="middle">acotado y $f$ continua; si no, razono a mano.</text>
<path class="lin" d="M115 188 V211" marker-end="url(#fl)"/>
<text class="no" x="123" y="204">no</text>
<rect class="preg" x="10" y="214" width="210" height="76" rx="10"/>
<text x="115" y="244" text-anchor="middle">¿Piden extremos absolutos en un</text>
<text x="115" y="262" text-anchor="middle">recinto cerrado?</text>
<path class="lin" d="M220 252 H246" marker-end="url(#fl)"/>
<text class="si" x="225" y="247">sí</text>
<rect class="nodo" x="250" y="214" width="340" height="76" rx="10"/>
<text x="420" y="248" text-anchor="middle">Críticos del interior + frontera</text>
<text x="420" y="268" text-anchor="middle">(lados, vértices o Lagrange); tabla y comparo.</text>
<path class="lin" d="M115 290 V313" marker-end="url(#fl)"/>
<text class="no" x="123" y="306">no</text>
<rect class="preg" x="10" y="316" width="210" height="76" rx="10"/>
<text x="115" y="346" text-anchor="middle">¿Hay una restricción $g=0$ o piden</text>
<text x="115" y="364" text-anchor="middle">una distancia?</text>
<path class="lin" d="M220 354 H246" marker-end="url(#fl)"/>
<text class="si" x="225" y="349">sí</text>
<rect class="nodo" x="250" y="316" width="340" height="76" rx="10"/>
<text x="420" y="350" text-anchor="middle">$F=f+\lambda g$, $\nabla F=\bar0$; añado $\nabla g=\bar0$;</text>
<text x="420" y="370" text-anchor="middle">distancia: optimizo el cuadrado y saco la raíz al final.</text>
<path class="lin" d="M115 392 V415" marker-end="url(#fl)"/>
<text class="no" x="123" y="408">no</text>
<rect class="fin" x="10" y="418" width="580" height="76" rx="10"/>
<text x="300" y="444" text-anchor="middle">Respondo con el valor y compruebo:</text>
<text x="300" y="462" text-anchor="middle">¿era punto crítico?, ¿no me dejé la frontera ni los casos «variable = 0»?,</text>
<text x="300" y="480" text-anchor="middle">¿puse la raíz al final en las distancias?</text>
</svg>
