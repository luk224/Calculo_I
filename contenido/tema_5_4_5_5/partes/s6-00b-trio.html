<ul class="trio">
  <li><b>Cómo lo reconoces:</b> «Extremos de $f$ sujetos a $g(x,y)=0$» cuando la restricción se despeja con facilidad.</li>
  <li><b>Qué haces:</b> Despejas $y=h(x)$ de la restricción, sustituyes en $f$ y estudias una función de una variable.</li>
  <li><b>Ejemplo mínimo:</b> Sobre $x+y=0$, $f=x^2-y^2$ pasa a $f(x,-x)=0$: constante.</li>
</ul>
