<p>Léelo de arriba abajo: en cada pregunta, «no» baja a la siguiente y «sí» te lleva a la acción de la derecha. Lo que más puntos se pierde: <b>aplicar la Hessiana a un punto no crítico</b>, <b>olvidar la frontera</b>, <b>dar la distancia al cuadrado</b> y <b>perder los casos «variable $=0$»</b>.</p>
