<ul class="trio">
  <li><b>Cómo lo reconoces:</b> dos factores que dependen de $x$ y se multiplican, como $x^2\operatorname{sen}x$.</li>
  <li><b>Qué haces:</b> aplicas $u'v+uv'$: cada factor varía mientras el otro se queda quieto.</li>
  <li><b>Ejemplo mínimo:</b> $(x\,e^x)'=e^x+x\,e^x$.</li>
</ul>
