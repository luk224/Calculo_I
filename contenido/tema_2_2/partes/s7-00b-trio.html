<ul class="trio">
  <li><b>Cómo lo reconoces:</b> una de esas cuatro funciones, que no son «básicas».</li>
  <li><b>Qué haces:</b> la reescribes con $\operatorname{sen}$ y $\cos$ y aplicas el cociente.</li>
  <li><b>Ejemplo mínimo:</b> $(\operatorname{tg}x)'=\frac{\cos^2x+\operatorname{sen}^2x}{\cos^2x}=\frac1{\cos^2x}$.</li>
</ul>
