<ul class="trio">
  <li><b>Cómo lo reconoces:</b> una fracción con $x$ arriba y abajo, y denominador $\neq0$.</li>
  <li><b>Qué haces:</b> aplicas $\frac{u'v-uv'}{v^2}$ y simplificas el numerador.</li>
  <li><b>Ejemplo mínimo:</b> $\left(\frac{x}{x+1}\right)'=\frac{(x+1)-x}{(x+1)^2}=\frac1{(x+1)^2}$.</li>
</ul>
