<div class="box warn"><span class="h">Error típico: la potencia y la exponencial no son lo mismo</span>
  <p>$x^c$ (base variable, exponente <b>constante</b>) se deriva como $c\,x^{c-1}$. $a^x$ (base <b>constante</b>, exponente variable) se deriva como $a^x\ln a$. En $x^x$ o $x^{1/x}$ no vale ninguna de las dos: se resuelve en el apartado 9.</p>
  <span class="src" data-l="S" data-ref="Stewart §3.6, comparación de los cuatro casos de base y exponente, p. 221">S p.221</span>
</div>
