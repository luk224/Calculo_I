<div class="box ex"><span class="h">Ejemplo resuelto</span>
  <p>$h(x)=3x^4-5e^x+\ln x+7$ para $x>0$.</p>
  <ol class="steps">
    <li>Es una suma de cuatro piezas; se deriva pieza a pieza (regla de la suma).</li>
    <li>$(3x^4)'=3\cdot4x^3=12x^3$ (constante por función y $x^c$); $(-5e^x)'=-5e^x$; $(\ln x)'=\frac1x$; $(7)'=0$.</li>
    <li>$h'(x)=12x^3-5e^x+\frac1x$, $x>0$.</li>
  </ol>
  <span class="src" data-l="P" data-ref="Ejemplo propio">P</span>
</div>
