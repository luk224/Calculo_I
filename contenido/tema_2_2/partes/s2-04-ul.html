<ul>
  <li><b>Constante por función:</b> $(c\,f)'(a)=c\,f'(a)$ si $f$ es derivable en $a$ y $c\in\mathbb R$ es constante.</li>
  <li><b>Resta:</b> $(f-g)'(a)=f'(a)-g'(a)$ (es $f+(-1)\,g$).</li>
  <li>La derivada de una <b>constante</b> es $0$, por eso «desaparecen» los sumandos constantes: $(x^2+7)'=2x$.</li>
</ul>
