<div class="box intu"><span class="h">Idea intuitiva: velocidades en cadena</span>
  <p>Si $u$ cambia al doble de rápido que $x$ y $y$ cambia tres veces más rápido que $u$, entonces $y$ cambia $2\cdot3=6$ veces más rápido que $x$. <b>Las velocidades de cambio se multiplican</b> a lo largo de la cadena. Esa es exactamente la regla.</p>
  <figure>
  <svg class="fig" viewBox="0 0 560 130" role="img" aria-label="Cadena de dos funciones: x pasa por u igual a u de x y luego por F para dar y; las derivadas se multiplican">
    <rect class="t22-fd" x="20" y="40" width="90" height="40" rx="8"/><text x="65" y="65" text-anchor="middle">x</text>
    <rect class="t22-fd" x="235" y="40" width="90" height="40" rx="8"/><text x="280" y="65" text-anchor="middle">u = u(x)</text>
    <rect class="t22-fd" x="450" y="40" width="90" height="40" rx="8"/><text x="495" y="65" text-anchor="middle">y = F(u)</text>
    <line class="ax" x1="110" y1="60" x2="228" y2="60"/><polygon class="t22-arr" points="235,60 226,55 226,65"/>
    <line class="ax" x1="325" y1="60" x2="443" y2="60"/><polygon class="t22-arr" points="450,60 441,55 441,65"/>
    <text class="sm" x="172" y="35" text-anchor="middle">factor u′(x)</text>
    <text class="sm" x="387" y="35" text-anchor="middle">factor F′(u)</text>
    <text class="bd" x="280" y="112" text-anchor="middle">y′ = F′(u(x)) · u′(x)</text>
  </svg>
  <figcaption>Cada flecha multiplica por «cuánto se estira» esa función; la derivada total es el producto de los factores.</figcaption>
  </figure>
  <span class="src" data-l="S" data-ref="Stewart §3.4 La regla de la cadena, p. 199 (razón de cambio: si u cambia el doble que x y y el triple que u...)">S p.199</span>
</div>
