<div class="box thm"><span class="h">Regla de la suma (Proposición 2.1)</span>
  <p>Si $f$ y $g$ son derivables en $a$, entonces $f+g$ es derivable en $a$ y
  $$(f+g)'(a)=f'(a)+g'(a).$$</p>
  <span class="src" data-l="U" data-ref="U §2.2.2 Proposición 2.1, p. 79">U p.79</span>

</div>
