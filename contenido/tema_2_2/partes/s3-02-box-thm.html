<div class="box thm"><span class="h">Regla del producto (Proposición 2.1)</span>
  <p>Si $f$ y $g$ son derivables en $a$, entonces $f\cdot g$ es derivable en $a$ y
  $$(f\cdot g)'(a)=f'(a)\,g(a)+f(a)\,g'(a).$$
  En palabras: «derivada del primero por el segundo, más el primero por la derivada del segundo».</p>
