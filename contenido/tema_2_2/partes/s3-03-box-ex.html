<div class="box ex"><span class="h">Ejemplo resuelto</span>
  <p>$f(x)=x^2\operatorname{sen}x$, derivable en todo $\mathbb R$.</p>
  <ol class="steps">
    <li>Última operación: producto de $u=x^2$ y $v=\operatorname{sen}x$.</li>
    <li>$u'=2x$, $v'=\cos x$ (tabla).</li>
    <li>$f'(x)=2x\operatorname{sen}x+x^2\cos x$.</li>
  </ol>
  <span class="src" data-l="S" data-ref="Stewart §3.3 Ejemplo 1 (y = x² sen x), p. 194">S p.194</span>
</div>
