  <figcaption>Interactivo propio. Arriba, la gráfica de $f$ con su tangente (naranja) en el punto que eliges con $x$; abajo, la gráfica de la función derivada $f'$ con un punto a la misma $x$. La altura de ese punto en la gráfica de abajo <b>es</b> la pendiente de la tangente de arriba: $f'$ se anula donde la tangente es horizontal (puntos verdes), es positiva donde $f$ sube y negativa donde baja. Las tres últimas funciones se derivan con la regla del producto, de la cadena y del cociente. <span class="src" data-l="P" data-ref="Explicación propia; derivada como pendiente de la tangente: U §2.1.2 p. 75; reglas de derivación: U §2.2.2 p. 79">P</span></figcaption>
</figure>
