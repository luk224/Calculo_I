<svg class="flujo" viewBox="0 0 460 764" role="img" aria-labelledby="flujo-t flujo-d">
<title id="flujo-t">Mapa de decisión: qué regla de derivación uso</title>
<desc id="flujo-d">Diagrama de flujo vertical. Se mira el dominio; si la variable está en la base y el exponente se usa e elevado a B por logaritmo de A; si piden la derivada de una inversa en un punto se usa uno partido por f prima de x cero; si la última operación es una suma, un producto o un cociente se usa la regla correspondiente; si hay una función dentro de otra se usa la cadena; si no, es una pieza de la tabla. Se simplifica y se comprueba si la fórmula falla en algún punto del dominio.</desc>
<defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="nodo" x="10" y="10" width="200" height="44" rx="10"/><text x="110" y="28" text-anchor="middle">Escribo f(x) y miro su</text><text x="110" y="46" text-anchor="middle">dominio</text>
<path class="lin" d="M110 54 V77" marker-end="url(#fl)"/>
<rect class="preg" x="10" y="80" width="200" height="44" rx="10"/><text x="110" y="98" text-anchor="middle">¿Hay x en la base y en el</text><text x="110" y="116" text-anchor="middle">exponente (x^x, x^(1/x))?</text>
<path class="lin" d="M110 124 V147" marker-end="url(#fl)"/>
<text class="no" x="118" y="140">no</text>
<path class="lin" d="M210 102 H246" marker-end="url(#fl)"/><text class="si" x="215" y="97">sí</text>
<rect class="nodo" x="250" y="80" width="200" height="44" rx="10"/><text x="350" y="98" text-anchor="middle">A^B = e^(B·ln A) (A>0);</text><text x="350" y="116" text-anchor="middle">derivo el exponente</text>
<rect class="preg" x="10" y="150" width="200" height="44" rx="10"/><text x="110" y="168" text-anchor="middle">¿Piden (f⁻¹)′ en un punto</text><text x="110" y="186" text-anchor="middle">sin fórmula de f⁻¹?</text>
<path class="lin" d="M110 194 V217" marker-end="url(#fl)"/>
<text class="no" x="118" y="210">no</text>
<path class="lin" d="M210 172 H246" marker-end="url(#fl)"/><text class="si" x="215" y="167">sí</text>
<rect class="nodo" x="250" y="150" width="200" height="44" rx="10"/><text x="350" y="168" text-anchor="middle">(f⁻¹)′(y₀) = 1/f′(x₀),</text><text x="350" y="186" text-anchor="middle">con f(x₀) = y₀</text>
<rect class="preg" x="10" y="220" width="200" height="44" rx="10"/><text x="110" y="238" text-anchor="middle">¿Última operación: suma,</text><text x="110" y="256" text-anchor="middle">resta o constante·f?</text>
<path class="lin" d="M110 264 V287" marker-end="url(#fl)"/>
<text class="no" x="118" y="280">no</text>
<path class="lin" d="M210 242 H246" marker-end="url(#fl)"/><text class="si" x="215" y="237">sí</text>
<rect class="nodo" x="250" y="220" width="200" height="44" rx="10"/><text x="350" y="238" text-anchor="middle">Derivo término a término;</text><text x="350" y="256" text-anchor="middle">la constante sale fuera</text>
<rect class="preg" x="10" y="290" width="200" height="44" rx="10"/><text x="110" y="317" text-anchor="middle">¿Última operación: u·v?</text>
<path class="lin" d="M110 334 V357" marker-end="url(#fl)"/>
<text class="no" x="118" y="350">no</text>
<path class="lin" d="M210 312 H246" marker-end="url(#fl)"/><text class="si" x="215" y="307">sí</text>
<rect class="nodo" x="250" y="290" width="200" height="44" rx="10"/><text x="350" y="317" text-anchor="middle">u′v + u v′</text>
<rect class="preg" x="10" y="360" width="200" height="44" rx="10"/><text x="110" y="387" text-anchor="middle">¿Última operación: u/v?</text>
<path class="lin" d="M110 404 V427" marker-end="url(#fl)"/>
<text class="no" x="118" y="420">no</text>
<path class="lin" d="M210 382 H246" marker-end="url(#fl)"/><text class="si" x="215" y="377">sí</text>
<rect class="nodo" x="250" y="360" width="200" height="44" rx="10"/><text x="350" y="378" text-anchor="middle">(u′v − u v′)/v²,</text><text x="350" y="396" text-anchor="middle">con v ≠ 0</text>
<rect class="preg" x="10" y="430" width="200" height="44" rx="10"/><text x="110" y="448" text-anchor="middle">¿Hay una función dentro</text><text x="110" y="466" text-anchor="middle">de otra (sen u, e^u, √u…)?</text>
<path class="lin" d="M110 474 V497" marker-end="url(#fl)"/>
<text class="no" x="118" y="490">no</text>
<path class="lin" d="M210 452 H246" marker-end="url(#fl)"/><text class="si" x="215" y="447">sí</text>
<rect class="nodo" x="250" y="430" width="200" height="44" rx="10"/><text x="350" y="448" text-anchor="middle">Cadena: F′(u)·u′,</text><text x="350" y="466" text-anchor="middle">un factor por capa</text>
<rect class="nodo" x="10" y="500" width="200" height="44" rx="10"/><text x="110" y="518" text-anchor="middle">Es una pieza de la tabla</text><text x="110" y="536" text-anchor="middle">(x^c, e^x, ln x, sen x, arcsen…)</text>
<path class="lin" d="M110 544 V567" marker-end="url(#fl)"/>
<rect class="nodo" x="10" y="570" width="200" height="44" rx="10"/><text x="110" y="588" text-anchor="middle">Derivo cada pieza, monto</text><text x="110" y="606" text-anchor="middle">y simplifico</text>
<path class="lin" d="M110 614 V637" marker-end="url(#fl)"/>
<rect class="preg" x="10" y="640" width="200" height="44" rx="10"/><text x="110" y="658" text-anchor="middle">¿Falla la fórmula en algún</text><text x="110" y="676" text-anchor="middle">punto del dominio de f?</text>
<path class="lin" d="M110 684 V707" marker-end="url(#fl)"/>
<text class="no" x="118" y="700">no</text>
<path class="lin" d="M210 662 H246" marker-end="url(#fl)"/><text class="si" x="215" y="657">sí</text>
<rect class="nada" x="250" y="640" width="200" height="44" rx="10"/><text x="350" y="658" text-anchor="middle">Decido con la definición</text><text x="350" y="676" text-anchor="middle">o con las laterales</text>
<rect class="fin" x="10" y="710" width="200" height="44" rx="10"/><text x="110" y="728" text-anchor="middle">f′ vale donde vale la</text><text x="110" y="746" text-anchor="middle">fórmula: listo</text>
</svg>
