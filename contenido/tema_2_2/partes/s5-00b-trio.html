<ul class="trio">
  <li><b>Cómo lo reconoces:</b> una función dentro de otra: $\operatorname{sen}(x^2)$, $e^{3x}$, $\sqrt{1+x}$.</li>
  <li><b>Qué haces:</b> derivas la de fuera dejando lo de dentro intacto y multiplicas por la derivada de dentro.</li>
  <li><b>Ejemplo mínimo:</b> $\bigl(\operatorname{sen}x^2\bigr)'=2x\cos x^2$.</li>
</ul>
