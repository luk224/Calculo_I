<svg class="flujo" viewBox="0 0 600 712" role="img" aria-labelledby="flujo-t flujo-d">
<title id="flujo-t">Mapa de decisión del tema 6.3: qué técnica de integración usar según la forma del integrando</title>
<desc id="flujo-d">Diagrama de flujo vertical, de la técnica más barata a la más cara. Si el integrando es una función y su derivada, es una integral inmediata de la tabla ajustando una constante. Si algo estorba dentro y su derivada está fuera, se hace un cambio de variable cambiando dx y los límites. Si hay raíces de x o la raíz de un cociente lineal, se usa x igual a t elevado al mínimo común múltiplo de los índices. Si es un producto de tipos distintos, se integra por partes. Si es un cociente de polinomios, se divide y se descompone en fracciones simples, con Hermite si hay factores repetidos. Si solo hay senos y cosenos, se usa el exponente impar, el ángulo doble o la tangente del ángulo mitad. Al final, si es definida se usa Barrow y siempre se comprueba derivando.</desc>
<defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="preg" x="10" y="10" width="210" height="76" rx="10"/>
<text x="115" y="40" text-anchor="middle">¿Es «una función y su derivada»?</text>
<text x="115" y="58" text-anchor="middle">(ajustando una constante)</text>
<path class="lin" d="M220 48 H246" marker-end="url(#fl)"/>
<text class="si" x="225" y="43">sí</text>
<rect class="nodo" x="250" y="10" width="340" height="76" rx="10"/>
<text x="420" y="44" text-anchor="middle">Inmediata de la tabla (U p.248):</text>
<text x="420" y="64" text-anchor="middle">multiplico y divido por la constante.</text>
<path class="lin" d="M115 86 V109" marker-end="url(#fl)"/>
<text class="no" x="123" y="102">no</text>
<rect class="preg" x="10" y="112" width="210" height="76" rx="10"/>
<text x="115" y="142" text-anchor="middle">¿Algo estorba dentro y su</text>
<text x="115" y="160" text-anchor="middle">derivada está fuera?</text>
<path class="lin" d="M220 150 H246" marker-end="url(#fl)"/>
<text class="si" x="225" y="145">sí</text>
<rect class="nodo" x="250" y="112" width="340" height="76" rx="10"/>
<text x="420" y="146" text-anchor="middle">Cambio $t=$ lo que estorba: cambio $dx$</text>
<text x="420" y="166" text-anchor="middle">y, en definida, los límites.</text>
<path class="lin" d="M115 188 V211" marker-end="url(#fl)"/>
<text class="no" x="123" y="204">no</text>
<rect class="preg" x="10" y="214" width="210" height="76" rx="10"/>
<text x="115" y="244" text-anchor="middle">¿Hay raíces de $x$ o la raíz</text>
<text x="115" y="262" text-anchor="middle">de un cociente lineal?</text>
<path class="lin" d="M220 252 H246" marker-end="url(#fl)"/>
<text class="si" x="225" y="247">sí</text>
<rect class="nodo" x="250" y="214" width="340" height="76" rx="10"/>
<text x="420" y="248" text-anchor="middle">$x=t^r$ ($r$ = m.c.m. de índices) o</text>
<text x="420" y="268" text-anchor="middle">$t$ = la raíz; despejo $x$ y hallo $dx$.</text>
<path class="lin" d="M115 290 V313" marker-end="url(#fl)"/>
<text class="no" x="123" y="306">no</text>
<rect class="preg" x="10" y="316" width="210" height="76" rx="10"/>
<text x="115" y="346" text-anchor="middle">¿Producto de tipos distintos,</text>
<text x="115" y="364" text-anchor="middle">o $\ln x$, $\operatorname{arctg}x$ solos?</text>
<path class="lin" d="M220 354 H246" marker-end="url(#fl)"/>
<text class="si" x="225" y="349">sí</text>
<rect class="nodo" x="250" y="316" width="340" height="76" rx="10"/>
<text x="420" y="350" text-anchor="middle">Partes: $u$ = lo que se simplifica;</text>
<text x="420" y="370" text-anchor="middle">reiterada o cíclica (despejo $I$).</text>
<path class="lin" d="M115 392 V415" marker-end="url(#fl)"/>
<text class="no" x="123" y="408">no</text>
<rect class="preg" x="10" y="418" width="210" height="76" rx="10"/>
<text x="115" y="460" text-anchor="middle">¿Cociente de polinomios?</text>
<path class="lin" d="M220 456 H246" marker-end="url(#fl)"/>
<text class="si" x="225" y="451">sí</text>
<rect class="nodo" x="250" y="418" width="340" height="76" rx="10"/>
<text x="420" y="452" text-anchor="middle">Dividir; fracciones simples; irreducible:</text>
<text x="420" y="472" text-anchor="middle">$\ln$+$\operatorname{arctg}$; repetido: Hermite.</text>
<path class="lin" d="M115 494 V517" marker-end="url(#fl)"/>
<text class="no" x="123" y="510">no</text>
<rect class="preg" x="10" y="520" width="210" height="76" rx="10"/>
<text x="115" y="562" text-anchor="middle">¿Solo $\operatorname{sen}$ y $\cos$?</text>
<path class="lin" d="M220 558 H246" marker-end="url(#fl)"/>
<text class="si" x="225" y="553">sí</text>
<rect class="nodo" x="250" y="520" width="340" height="76" rx="10"/>
<text x="420" y="554" text-anchor="middle">Impar: separo un factor; pares: ángulo</text>
<text x="420" y="574" text-anchor="middle">doble; si no, $t=\operatorname{tg}\frac x2$.</text>
<path class="lin" d="M115 596 V619" marker-end="url(#fl)"/>
<text class="no" x="123" y="612">no</text>
<rect class="fin" x="10" y="622" width="580" height="86" rx="10"/>
<text x="300" y="648" text-anchor="middle">Antes de dar el resultado:</text>
<text x="300" y="668" text-anchor="middle">¿$+C$ y valor absoluto en el $\ln$?, ¿cambié $dx$ y los límites?, ¿dividí antes</text>
<text x="300" y="686" text-anchor="middle">de descomponer?, ¿Barrow si es definida?, ¿derivé la primitiva para comprobar?</text>
</svg>
