<p>No se prueba al azar: se mira la <b>forma</b> del integrando, de más sencillo a más costoso, y siempre se acaba <b>comprobando derivando</b> <span class="src" data-l="S" data-ref="Stewart §7.5 Estrategias para la integración, p. 494 (idea de elegir la técnica según la forma del integrando)">S p.494</span>.</p>
