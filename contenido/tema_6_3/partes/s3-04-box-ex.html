<div class="box ex"><span class="h">Ejemplo 6.18 de U · $\displaystyle\int\ln x\,dx$</span>
  <ol class="steps">
    <li><b>Elegir:</b> $u=\ln x$, $v'=1$. Entonces $u'=\frac1x$, $v=x$.</li>
    <li><b>Fórmula:</b> $\int\ln x\,dx=x\ln x-\int x\cdot\frac1x\,dx=x\ln x-\int dx$.</li>
    <li><b>Resultado:</b> $x\ln x-x+k$. (Truco: se «inventa» el factor $v'=1$ para poder aplicar partes.)</li>
  </ol>
  <span class="src" data-l="U" data-ref="U Ejemplo 6.18, p. 252">U p.252</span>
</div>
