<div class="box ex"><span class="h">Ejemplo 6.9 de U · linealidad</span>
  <p>$\displaystyle\int(3x^2-2x+5)\,dx=3\!\int x^2dx-2\!\int x\,dx+5\!\int dx$. Como $x^3$, $x^2$ y $x$ son primitivas de $3x^2$, $2x$ y $1$ (se comprueba derivando),
  $$\int(3x^2-2x+5)\,dx=x^3-x^2+5x+k.$$</p>
