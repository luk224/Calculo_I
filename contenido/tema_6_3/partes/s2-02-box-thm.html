<div class="box thm"><span class="h">Cambio de variable en la integral indefinida</span>
  <p>Se introduce una variable $t$ con $x=g(t)$ (o $t=g^{-1}(x)$). Entonces $dx=g'(t)\,dt$ y
  $$\int f(x)\,dx=\int f(g(t))\,g'(t)\,dt.$$
  <b>Hay que cambiar también $dx$</b>, y al final <b>deshacer el cambio</b> para que el resultado quede en función de $x$.</p>
  <span class="src" data-l="U" data-ref="U p. 250, fórmula del cambio de variable">U p.250</span>
</div>
