<div class="recipe"><b>Receta del cambio de variable:</b> (1) elegir $t$ = lo molesto (lo de dentro de una función, o la parte cuya derivada también aparece); (2) derivar: $dt=t'(x)\,dx$ y despejar $dx$; (3) sustituir <b>todo</b> (no debe quedar ninguna $x$); (4) integrar en $t$; (5) deshacer el cambio.</div>
