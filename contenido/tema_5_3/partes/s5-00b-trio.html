<ul class="trio">
  <li><b>Cómo lo reconoces:</b> «$f(x,y,z)=0$ define $z=g(x,y)$; calcula $g_x$, $g_y$ o el plano tangente».</li>
  <li><b>Qué haces:</b> Compruebas $f_z\ne0$ y despejas cada parcial: $z_x=-f_x/f_z$, $z_y=-f_y/f_z$.</li>
  <li><b>Ejemplo mínimo:</b> $x+y+z^3=3$ en $(1,1,1)$: $z_x=-\frac13$.</li>
</ul>
