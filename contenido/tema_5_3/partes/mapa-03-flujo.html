<svg class="flujo" viewBox="0 0 600 504" role="img" aria-labelledby="flujo-t flujo-d">
<title id="flujo-t">Mapa de decisión del tema 5.3: qué hacer según lo que piden sobre la función implícita</title>
<desc id="flujo-d">Diagrama de flujo vertical. Si preguntan si el teorema garantiza que se despeja una variable cerca de un punto, se comprueba que el punto está en la curva y que la parcial de la variable que se despeja no se anula. Si piden la derivada, la pendiente o la recta tangente, se usa menos f_x entre f_y en el punto. Si piden la segunda derivada, se deriva dos veces la ecuación y se evalúa al final. Si hay tres variables, se usan z_x igual a menos f_x entre f_z y z_y igual a menos f_y entre f_z. Al final se comprueba la respuesta.</desc>
<defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="preg" x="10" y="10" width="210" height="76" rx="10"/>
<text x="115" y="44" text-anchor="middle">¿Preguntan si el teorema garantiza</text>
<text x="115" y="62" text-anchor="middle">despejar una variable cerca de (a,b)?</text>
<path class="lin" d="M220 48 H246" marker-end="url(#fl)"/>
<text class="si" x="225" y="43">sí</text>
<rect class="nodo" x="250" y="10" width="340" height="76" rx="10"/>
<text x="420" y="36" text-anchor="middle">Compruebo f(a,b)=0 y que la parcial de la</text>
<text x="420" y="54" text-anchor="middle">variable que despejo no se anula.</text>
<text x="420" y="72" text-anchor="middle">Si falla alguna: «el teorema no lo garantiza».</text>
<path class="lin" d="M115 86 V109" marker-end="url(#fl)"/>
<text class="no" x="123" y="102">no</text>
<rect class="preg" x="10" y="112" width="210" height="76" rx="10"/>
<text x="115" y="146" text-anchor="middle">¿Piden y′, la pendiente o la recta</text>
<text x="115" y="164" text-anchor="middle">tangente (también de una curva de nivel)?</text>
<path class="lin" d="M220 150 H246" marker-end="url(#fl)"/>
<text class="si" x="225" y="145">sí</text>
<rect class="nodo" x="250" y="112" width="340" height="76" rx="10"/>
<text x="420" y="138" text-anchor="middle">y′ = −f_x/f_y en el punto (o derivo la ecuación</text>
<text x="420" y="156" text-anchor="middle">con y(x) dentro y despejo y′).</text>
<text x="420" y="174" text-anchor="middle">Tangente: y − b = y′(a)·(x − a).</text>
<path class="lin" d="M115 188 V211" marker-end="url(#fl)"/>
<text class="no" x="123" y="204">no</text>
<rect class="preg" x="10" y="214" width="210" height="76" rx="10"/>
<text x="115" y="248" text-anchor="middle">¿Piden la segunda derivada y″ (o g″)?</text>
<text x="115" y="266" text-anchor="middle">¿Sin conocer la función?</text>
<path class="lin" d="M220 252 H246" marker-end="url(#fl)"/>
<text class="si" x="225" y="247">sí</text>
<rect class="nodo" x="250" y="214" width="340" height="76" rx="10"/>
<text x="420" y="240" text-anchor="middle">Derivo la ecuación derivada otra vez,</text>
<text x="420" y="258" text-anchor="middle">después sustituyo punto e y′,</text>
<text x="420" y="276" text-anchor="middle">y despejo y″.</text>
<path class="lin" d="M115 290 V313" marker-end="url(#fl)"/>
<text class="no" x="123" y="306">no</text>
<rect class="preg" x="10" y="316" width="210" height="76" rx="10"/>
<text x="115" y="350" text-anchor="middle">¿Hay tres variables: z = g(x,y),</text>
<text x="115" y="368" text-anchor="middle">sus parciales o el plano tangente?</text>
<path class="lin" d="M220 354 H246" marker-end="url(#fl)"/>
<text class="si" x="225" y="349">sí</text>
<rect class="nodo" x="250" y="316" width="340" height="76" rx="10"/>
<text x="420" y="342" text-anchor="middle">Compruebo f_z ≠ 0: z_x = −f_x/f_z,</text>
<text x="420" y="360" text-anchor="middle">z_y = −f_y/f_z. Plano: z − c = z_x(x−a)</text>
<text x="420" y="378" text-anchor="middle">+ z_y(y−b).</text>
<path class="lin" d="M115 392 V415" marker-end="url(#fl)"/>
<text class="no" x="123" y="408">no</text>
<rect class="fin" x="10" y="418" width="580" height="76" rx="10"/>
<text x="300" y="444" text-anchor="middle">Respondo con el resultado y compruebo:</text>
<text x="300" y="462" text-anchor="middle">¿el punto está en la curva?, ¿la parcial de la variable que despejo es ≠ 0?,</text>
<text x="300" y="480" text-anchor="middle">¿signo menos y cociente en el orden correcto?, ¿derivé antes de evaluar?</text>
</svg>
