<p>Léelo de arriba abajo: en cada pregunta, «no» baja a la siguiente y «sí» te lleva a la acción de la derecha. Lo que más puntos se pierde: <b>no comprobar $f(a,b)=0$</b>, mirar la <b>parcial equivocada</b>, responder «imposible» en vez de «no lo garantiza» y <b>evaluar antes de derivar</b> la segunda vez.</p>
