<ul class="trio">
  <li><b>Cómo lo reconoces:</b> «Pendiente de la curva de nivel de $F$ por $(a,b)$», «tangente a $F(x,y)=k$».</li>
  <li><b>Qué haces:</b> La curva de nivel por $(a,b)$ es $F(x,y)=F(a,b)$; su pendiente es $-F_x/F_y$ y el gradiente es perpendicular a ella.</li>
  <li><b>Ejemplo mínimo:</b> $F=x^2+y^2$ en $(1,1)$: $m=-\frac{2}{2}=-1$.</li>
</ul>
