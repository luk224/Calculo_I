<div class="box intu"><span class="h">Idea intuitiva</span>
  <p>La curva de nivel $f(x,y)=k$ es una ecuación implícita. Si no es vertical en el punto, es la gráfica de $y=y(x)$ y la pendiente de su tangente es $y'=-f_x/f_y$. (Otra forma de verlo, con el gradiente perpendicular, en E 5.26.)</p>
