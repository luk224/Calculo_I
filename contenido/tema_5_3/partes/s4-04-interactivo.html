  <figcaption>Interactivo propio. Elige $F$ y mueve el punto $(a,b)$: la curva negra es la de nivel $F(x,y)=F(a,b)$, la recta naranja es su tangente (pendiente $-F_x/F_y$) y el segmento azul es el gradiente, siempre perpendicular a la tangente. Los puntos verdes son los de la curva con $F_y=0$: ahí la tangente es vertical y el teorema de la función implícita no permite despejar $y=y(x)$. Con la del Ejemplo 5.13 en $(1,0)$ sale $y'=-\frac23$. Usa la rueda para acercar. <span class="src" data-l="P" data-ref="Explicación propia; teorema de la función implícita y pendiente de una curva de nivel: U §5.3.2 pp. 206-210, Ej. 5.13">P</span></figcaption>
</figure>
