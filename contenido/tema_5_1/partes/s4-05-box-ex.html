<div class="box ex"><span class="h">Ejemplo 5.4 de U · diferencial de $f=x^2+y$ en $(1,2)$</span>
  <p>$\nabla f=(2x,1)$, $\nabla f(1,2)=(2,1)$, así que $Df(1,2)(x,y)=2x+y$. Plano tangente: $z=f(1,2)+Df(1,2)(x-1,y-2)=3+2(x-1)+(y-2)=2x+y-1$.</p>
