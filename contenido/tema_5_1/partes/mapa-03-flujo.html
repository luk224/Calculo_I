<svg class="flujo" viewBox="0 0 600 504" role="img" aria-labelledby="flujo-t flujo-d">
<title id="flujo-t">Mapa de decisión del tema 5.1: qué hacer según lo que piden sobre diferenciabilidad</title>
<desc id="flujo-d">Diagrama de flujo vertical. Si piden el plano tangente o la diferencial de una función normal, se comprueba que el punto está en la gráfica, se calcula el gradiente y se sustituye en la fórmula. Si piden aproximar o estimar un error, se usa un punto cercano y la diferencial. Si piden estudiar la diferenciabilidad en un punto especial, se comprueba la continuidad, las parciales por definición y, si todo va bien, el cociente Q en polares. Si piden dónde es diferenciable o una cuestión teórica, se usa la condición suficiente fuera de los puntos especiales y las implicaciones del Teorema 5.1. Al final se comprueba la respuesta.</desc>
<defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="preg" x="10" y="10" width="210" height="76" rx="10"/>
<text x="115" y="44" text-anchor="middle">¿Piden el plano tangente o la</text>
<text x="115" y="62" text-anchor="middle">diferencial de una función normal?</text>
<path class="lin" d="M220 48 H246" marker-end="url(#fl)"/>
<text class="si" x="225" y="43">sí</text>
<rect class="nodo" x="250" y="10" width="340" height="76" rx="10"/>
<text x="420" y="36" text-anchor="middle">Calculo f(a,b) (el punto debe estar en la gráfica),</text>
<text x="420" y="54" text-anchor="middle">el gradiente en (a,b) (parciales continuas ⇒</text>
<text x="420" y="72" text-anchor="middle">diferenciable) y z = f + fx(x-a) + fy(y-b).</text>
<path class="lin" d="M115 86 V109" marker-end="url(#fl)"/>
<text class="no" x="123" y="102">no</text>
<rect class="preg" x="10" y="112" width="210" height="76" rx="10"/>
<text x="115" y="146" text-anchor="middle">¿Piden aproximar un valor o</text>
<text x="115" y="164" text-anchor="middle">estimar un error?</text>
<path class="lin" d="M220 150 H246" marker-end="url(#fl)"/>
<text class="si" x="225" y="145">sí</text>
<rect class="nodo" x="250" y="112" width="340" height="76" rx="10"/>
<text x="420" y="138" text-anchor="middle">Elijo un punto cercano (a,b) con valores exactos.</text>
<text x="420" y="156" text-anchor="middle">f(a+h,b+k) ≈ f(a,b) + fx·h + fy·k;</text>
<text x="420" y="174" text-anchor="middle">error ≈ |fx||Δx| + |fy||Δy|.</text>
<path class="lin" d="M115 188 V211" marker-end="url(#fl)"/>
<text class="no" x="123" y="204">no</text>
<rect class="preg" x="10" y="214" width="210" height="76" rx="10"/>
<text x="115" y="248" text-anchor="middle">¿Piden estudiar la diferenciabilidad</text>
<text x="115" y="266" text-anchor="middle">en un punto especial (a trozos)?</text>
<path class="lin" d="M220 252 H246" marker-end="url(#fl)"/>
<text class="si" x="225" y="247">sí</text>
<rect class="nodo" x="250" y="214" width="340" height="76" rx="10"/>
<text x="420" y="240" text-anchor="middle">1) ¿continua? 2) ¿existen las parciales (definición)?</text>
<text x="420" y="258" text-anchor="middle">Si falla una: no diferenciable. Si no, Q con el</text>
<text x="420" y="276" text-anchor="middle">gradiente y polares: Q → 0 ⇒ diferenciable.</text>
<path class="lin" d="M115 290 V313" marker-end="url(#fl)"/>
<text class="no" x="123" y="306">no</text>
<rect class="preg" x="10" y="316" width="210" height="76" rx="10"/>
<text x="115" y="350" text-anchor="middle">¿Piden «dónde es diferenciable»</text>
<text x="115" y="368" text-anchor="middle">o una cuestión teórica?</text>
<path class="lin" d="M220 354 H246" marker-end="url(#fl)"/>
<text class="si" x="225" y="349">sí</text>
<rect class="nodo" x="250" y="316" width="340" height="76" rx="10"/>
<text x="420" y="342" text-anchor="middle">Fuera de los puntos especiales: parciales continuas</text>
<text x="420" y="360" text-anchor="middle">⇒ diferenciable. Teoría: diferenciable ⇒ continua y</text>
<text x="420" y="378" text-anchor="middle">parciales; ninguna flecha se invierte.</text>
<path class="lin" d="M115 392 V415" marker-end="url(#fl)"/>
<text class="no" x="123" y="408">no</text>
<rect class="fin" x="10" y="418" width="580" height="76" rx="10"/>
<text x="300" y="444" text-anchor="middle">Respondo con el plano, la diferencial o el veredicto.</text>
<text x="300" y="462" text-anchor="middle">Compruebo: ¿el punto está en la gráfica?, ¿resté f(a,b) y fx·h + fy·k?,</text>
<text x="300" y="480" text-anchor="middle">¿la cota de Q no depende de θ?, ¿no confundí parciales con diferenciable?</text>
</svg>
