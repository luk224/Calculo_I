<div class="box ex"><span class="h">Ejemplo · $f=x^2+y$ en $(1,2)$ por la definición</span><p>$\nabla f(1,2)=(2,1)$. Numerador: $(1+h)^2+(2+k)-3-2h-k=h^2$. Cociente: $Q=\frac{h^2}{\sqrt{h^2+k^2}}$, y como $h^2\le h^2+k^2$, $|Q|\le\sqrt{h^2+k^2}\to0$. Diferenciable (su plano tangente se calcula en el Ejemplo 5.4).</p><span class="src" data-l="P" data-ref="Ejemplo propio sobre U Def. 5.1, p. 189, y Ej. 5.4, p. 193">P</span></div>
