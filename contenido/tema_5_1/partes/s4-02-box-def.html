<div class="box def"><span class="h">Espacio tangente (5.3)</span>
  <p>Con $n>2$ no se habla de «plano»: el <b>espacio tangente</b> a la gráfica de $f$ en $\big(\bar a,f(\bar a)\big)$ es el conjunto $x_{n+1}=f(\bar a)+\nabla f(\bar a)\cdot(\bar x-\bar a)$.</p>
  <span class="src" data-l="U" data-ref="U Observación pp. 192-193, ecuación (5.3), p. 193">U pp.192-193</span>
</div>
