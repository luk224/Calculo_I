  <figcaption>Interactivo propio. Arrastra para girar. La superficie (azul) y el plano tangente (naranja) se dibujan en una ventana cuadrada de lado $2w$ alrededor del punto. Baja $w$ con el deslizador «Ventana»: si $f$ es diferenciable, superficie y plano se <b>confunden</b> y el cociente (error máximo)/$w$ tiende a $0$, que es justo la Definición 5.1. Prueba la última función en $(0,0)$: tiene parciales ($\nabla f=(0,0)$) pero por mucho que acerques el zoom el plano $z=0$ sigue separado de la superficie, porque a lo largo de la diagonal $f(h,h)=\frac12$: no es diferenciable. Mueve $a$ o $b$ fuera del origen y vuelve a ser diferenciable. <span class="src" data-l="P" data-ref="Explicación propia; Definición 5.1 y plano tangente: U p. 189">P</span></figcaption>
</figure>
