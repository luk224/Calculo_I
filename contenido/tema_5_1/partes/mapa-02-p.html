<p>Léelo de arriba abajo: en cada pregunta, «no» baja a la siguiente y «sí» te lleva a la acción de la derecha. Lo que más puntos se pierde: <b>concluir «diferenciable» porque hay parciales</b>, calcular $Q$ sin ver antes que la función es discontinua y <b>olvidar restar $f_xh+f_yk$</b> en el numerador.</p>
