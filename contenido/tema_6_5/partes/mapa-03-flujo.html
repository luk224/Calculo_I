<svg class="flujo" viewBox="0 0 600 512" role="img" aria-labelledby="flujo-t flujo-d">
<title id="flujo-t">Mapa de decisión del tema 6.5: qué hacer según lo que piden en integrales impropias</title>
<desc id="flujo-d">Diagrama de flujo vertical. Si piden clasificar, se comprueban por separado el intervalo (límite infinito) y la función (no acotada en algún punto). Si hay más de un punto problemático, o una asíntota interior, se parte la integral para que cada trozo tenga uno solo y todos deben converger. Si piden el valor y hay primitiva, se aplica Barrow en el trozo recortado y se calcula el límite, juntando logaritmos o usando L'Hôpital si sale una indeterminación. Si solo piden el carácter o no hay primitiva, se compara con 1 entre x elevado a p, por desigualdad o por límite del cociente: en el infinito converge si p es mayor que 1 y cerca de un punto si p es menor que 1. Al final se comprueba que se partió en todos los puntos malos, que cada trozo converge y que el signo es coherente.</desc>
<defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="preg" x="10" y="10" width="210" height="76" rx="10"/>
<text x="115" y="40" text-anchor="middle">¿Piden clasificar o decidir</text>
<text x="115" y="58" text-anchor="middle">si es impropia?</text>
<path class="lin" d="M220 48 H246" marker-end="url(#fl)"/>
<text class="si" x="225" y="43">sí</text>
<rect class="nodo" x="250" y="10" width="340" height="76" rx="10"/>
<text x="420" y="44" text-anchor="middle">Intervalo: ¿algún límite es ±∞? Función:</text>
<text x="420" y="64" text-anchor="middle">¿se dispara en un punto del intervalo?</text>
<path class="lin" d="M115 86 V109" marker-end="url(#fl)"/>
<text class="no" x="123" y="102">no</text>
<rect class="preg" x="10" y="112" width="210" height="76" rx="10"/>
<text x="115" y="142" text-anchor="middle">¿Hay más de un punto malo (∞ y</text>
<text x="115" y="160" text-anchor="middle">asíntota, o asíntota interior)?</text>
<path class="lin" d="M220 150 H246" marker-end="url(#fl)"/>
<text class="si" x="225" y="145">sí</text>
<rect class="nodo" x="250" y="112" width="340" height="76" rx="10"/>
<text x="420" y="146" text-anchor="middle">Parto en un punto intermedio: cada</text>
<text x="420" y="166" text-anchor="middle">trozo con un solo problema; todos convergen.</text>
<path class="lin" d="M115 188 V211" marker-end="url(#fl)"/>
<text class="no" x="123" y="204">no</text>
<rect class="preg" x="10" y="214" width="210" height="76" rx="10"/>
<text x="115" y="244" text-anchor="middle">¿Piden el valor y hay</text>
<text x="115" y="262" text-anchor="middle">primitiva?</text>
<path class="lin" d="M220 252 H246" marker-end="url(#fl)"/>
<text class="si" x="225" y="247">sí</text>
<rect class="nodo" x="250" y="214" width="340" height="76" rx="10"/>
<text x="420" y="248" text-anchor="middle">Barrow en el trozo recortado y límite</text>
<text x="420" y="268" text-anchor="middle">(∞−∞: junto; 0·∞: L'Hôpital).</text>
<path class="lin" d="M115 290 V313" marker-end="url(#fl)"/>
<text class="no" x="123" y="306">no</text>
<rect class="preg" x="10" y="316" width="210" height="76" rx="10"/>
<text x="115" y="346" text-anchor="middle">¿Solo piden el carácter o no</text>
<text x="115" y="364" text-anchor="middle">hay primitiva?</text>
<path class="lin" d="M220 354 H246" marker-end="url(#fl)"/>
<text class="si" x="225" y="349">sí</text>
<rect class="nodo" x="250" y="316" width="340" height="76" rx="10"/>
<text x="420" y="350" text-anchor="middle">Comparo con 1/xᵖ: en ∞ converge si p>1;</text>
<text x="420" y="370" text-anchor="middle">cerca de un punto, si p<1 (desigualdad o límite).</text>
<path class="lin" d="M115 392 V415" marker-end="url(#fl)"/>
<text class="no" x="123" y="408">no</text>
<rect class="fin" x="10" y="418" width="580" height="86" rx="10"/>
<text x="300" y="444" text-anchor="middle">Antes de dar el resultado:</text>
<text x="300" y="464" text-anchor="middle">¿partí en todos los puntos malos?, ¿límite lateral correcto?, ¿cada trozo converge?,</text>
<text x="300" y="482" text-anchor="middle">¿signo coherente (f &gt; 0 ⇒ área &gt; 0)?, ¿referencia 1/xᵖ con el caso de p bien?</text>
</svg>
