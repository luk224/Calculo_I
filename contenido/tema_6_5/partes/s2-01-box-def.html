<div class="box def"><span class="h">Definición 6.9 · Integral impropia de primera especie</span>
  <p>Si $f:[a,\infty)\to\mathbb R$ es una función <b>continua y acotada</b>,
  $$\int_a^\infty f(x)\,dx=\lim_{M\to\infty}\int_a^M f(x)\,dx.$$
  Si el límite es un número real, la integral es <b>convergente</b>; en otro caso, <b>divergente</b>.</p>
  <span class="src" data-l="U" data-ref="U Definición 6.9, p. 272">U p.272</span>
</div>
