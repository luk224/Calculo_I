<div class="box tip"><span class="h">Truco de examen</span>
  <p>Cambiar el extremo «bueno» no cambia el carácter: $\int_a^\infty f$ e $\int_{a'}^\infty f$ difieren en $\int_a^{a'}f$, que es una integral ordinaria (un número). Por eso $\int_2^\infty\frac{dx}{x^2}$ converge igual que $\int_1^\infty\frac{dx}{x^2}$.</p>
  <span class="src" data-l="P" data-ref="Consecuencia de la aditividad de la integral (U §6.1) y la Def. 6.9">propio</span>
</div>
