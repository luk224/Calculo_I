<div class="box warn"><span class="h">Error típico</span>
  <p>Un punto donde $f$ <b>no está definida pero tiene límite finito</b> (como $\frac{\operatorname{sen}x}{x}$ en $0$) <b>no</b> es causa de impropiedad: $f$ sigue acotada cerca de él. Antes de decir «segunda especie», calcula el límite de $f$ en el punto sospechoso.</p>
</div>
