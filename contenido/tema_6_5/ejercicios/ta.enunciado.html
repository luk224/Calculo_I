<p class="enun">Estudia el carácter de $\int_1^\infty\frac{dx}{\sqrt{x^3+1}}$.</p>
<div class="plan"><span class="h">Antes de calcular</span><dl>
    <dt>Qué me piden</dt><dd>El carácter (no hay primitiva elemental).</dd>
    <dt>Cómo lo pienso</dt><dd>$\sqrt{x^3+1}\approx x^{3/2}$; $\frac1{x^{3/2}}$ tiene exponente $&gt;1$: converge.</dd>
    <dt>Qué uso</dt><dd>Comparación (U p.277); Ej. 6.38.</dd>
  </dl></div>
