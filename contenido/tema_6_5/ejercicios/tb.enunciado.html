<p class="enun">Estudia el carácter de $\int_0^1\frac{dx}{\sqrt{x(1+x)}}$.</p>
<div class="plan"><span class="h">Antes de calcular</span><dl>
    <dt>Qué me piden</dt><dd>El carácter (y el valor, si se puede).</dd>
    <dt>Cómo lo pienso</dt><dd>Cerca de $0$, $x(1+x)\approx x$ y $f\approx\frac1{\sqrt x}$: exponente $\frac12&lt;1$, converge.</dd>
    <dt>Qué uso</dt><dd>Comparación de segunda especie (U p.278); Ej. 6.41.</dd>
  </dl></div>
<figure class="graf" data-g='{"c":[{"e":"1/sqrt(x*(1+x))","n":"1/√(x(1+x))"},{"e":"1/sqrt(x)","n":"1/√x","d":1}],"x":[0.01,1],"y":[0,8]}' data-alt="1/sqrt(x(1+x)) frente a 1/sqrt(x) en (0,1]"><figcaption>Cerca de $0$ las dos curvas casi coinciden; $\frac1{\sqrt{x(1+x)}}\le\frac1{\sqrt x}$, cuya integral en $[0,1]$ converge. Pasa el ratón por la gráfica (o toca; o usa ← →) para leer las coordenadas. <span class="src" data-l="P" data-ref="Gráfica propia: curva y puntos calculados con sympy a partir de los datos del ejercicio">P</span></figcaption></figure>
