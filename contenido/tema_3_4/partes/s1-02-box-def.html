<div class="box def"><span class="h">Definición 3.4 · extremos absolutos</span>
  <p>$f:D\to\mathbb R$ tiene un <b>mínimo absoluto</b> en $c$ si $f(c)\le f(x)$ para <b>todo</b> $x\in D$; tiene un <b>máximo absoluto</b> en $c$ si $f(c)\ge f(x)$ para todo $x\in D$. Un <b>extremo absoluto</b> es un máximo o un mínimo absoluto.</p>
  <span class="src" data-l="U" data-ref="U §3.4.2 Definición 3.4, p. 126">U p.126</span>
</div>
