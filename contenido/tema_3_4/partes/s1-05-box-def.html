<div class="box def"><span class="h">Definición 3.5 · punto crítico</span>
  <p>El punto $c\in(a,b)$ es un <b>punto crítico</b> de la función continua $f:[a,b]\to\mathbb R$ si $f'(c)=0$ <b>o</b> $f$ no es derivable en $c$.</p>
  <span class="src" data-l="U" data-ref="U §3.4.2 Definición 3.5, p. 126">U p.126</span>
  <span class="src" data-l="L" data-ref="Larson §3.1, Definición de número crítico, p. 164">L p.164</span>
</div>
