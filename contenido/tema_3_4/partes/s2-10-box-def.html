<div class="box def"><span class="h">Definición 3.7 · punto de silla</span>
  <p>El punto $c$ es un <b>punto de silla</b> para $f$ si es un punto crítico de $f$ pero $f$ no alcanza un extremo relativo en $c$. Ejemplo: $f(x)=x^3$ en $x=0$.</p>
  <span class="src" data-l="U" data-ref="U Definición 3.7, p. 131">U p.131</span>
</div>
