<div class="box thm"><span class="h">Teorema de Weierstrass (valor extremo) · existencia</span>
  <p>Si $f$ es <b>continua</b> en $[a,b]$, existen $c,d\in[a,b]$ con $f(c)\le f(x)\le f(d)$ para todo $x\in[a,b]$: $f$ alcanza un mínimo y un máximo absolutos. Garantiza que <b>existen</b>; no dice dónde están.</p>
  <span class="src" data-l="U" data-ref="U §1.4 Proposición 1.15, p. 52">U p.52</span>

</div>
