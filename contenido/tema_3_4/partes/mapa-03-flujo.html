<svg class="flujo" viewBox="0 0 600 606" role="img" aria-labelledby="flujo-t flujo-d">
<title id="flujo-t">Mapa de decisión: cómo hallar extremos absolutos en un intervalo cerrado o resolver un problema de optimización</title>
<desc id="flujo-d">Diagrama de flujo vertical. Si solo preguntan si hay máximo y mínimo, se aplica Weierstrass. Si es un problema con enunciado, se escribe la función de una variable con su dominio. Si el dominio es un intervalo cerrado, se evalúa la función en los puntos críticos y en los bordes y se comparan los valores. Si es abierto o infinito, se estudian el signo de la derivada y los límites en los bordes. Si piden clasificar un punto crítico, se usa la primera derivada, la segunda o las derivadas de orden superior. Al final se responde comprobando bordes y puntos sin derivada.</desc>
<defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="preg" x="10" y="10" width="210" height="76" rx="10"/>
<text x="115" y="43" text-anchor="middle">¿Solo preguntan si hay</text>
<text x="115" y="61" text-anchor="middle">máximo y mínimo («¿alcanza…?»)?</text>
<path class="lin" d="M220 48 H246" marker-end="url(#fl)"/>
<text class="si" x="225" y="43">sí</text>
<rect class="nodo" x="250" y="10" width="340" height="76" rx="10"/>
<text x="420" y="28" text-anchor="middle">Weierstrass: si f es continua en un cerrado</text>
<text x="420" y="44" text-anchor="middle">y acotado [a,b], sí los alcanza. Si el</text>
<text x="420" y="60" text-anchor="middle">intervalo no es cerrado o acotado, no hay</text>
<text x="420" y="76" text-anchor="middle">garantía: sigo con las preguntas siguientes</text>
<path class="lin" d="M115 86 V109" marker-end="url(#fl)"/>
<text class="no" x="123" y="102">no</text>
<rect class="preg" x="10" y="112" width="210" height="76" rx="10"/>
<text x="115" y="136" text-anchor="middle">¿Es un problema con</text>
<text x="115" y="154" text-anchor="middle">enunciado (lados, cajas,</text>
<text x="115" y="172" text-anchor="middle">suma fija, distancia)?</text>
<path class="lin" d="M220 150 H246" marker-end="url(#fl)"/>
<text class="si" x="225" y="145">sí</text>
<rect class="nodo" x="250" y="112" width="340" height="76" rx="10"/>
<text x="420" y="130" text-anchor="middle">Dibujo, nombro variables y escribo la cantidad a</text>
<text x="420" y="146" text-anchor="middle">optimizar. Con la restricción dejo UNA variable</text>
<text x="420" y="162" text-anchor="middle">y fijo su dominio (lados ≥ 0). Después sigo como</text>
<text x="420" y="178" text-anchor="middle">en las dos preguntas de abajo</text>
<path class="lin" d="M115 188 V211" marker-end="url(#fl)"/>
<text class="no" x="123" y="204">no</text>
<rect class="preg" x="10" y="214" width="210" height="76" rx="10"/>
<text x="115" y="247" text-anchor="middle">¿El dominio es un</text>
<text x="115" y="265" text-anchor="middle">intervalo cerrado [a, b]?</text>
<path class="lin" d="M220 252 H246" marker-end="url(#fl)"/>
<text class="si" x="225" y="247">sí</text>
<rect class="nodo" x="250" y="214" width="340" height="76" rx="10"/>
<text x="420" y="232" text-anchor="middle">Críticos de (a, b): f′ = 0 o f sin derivada.</text>
<text x="420" y="248" text-anchor="middle">Tabla de valores de f en críticos Y en a y b.</text>
<text x="420" y="264" text-anchor="middle">El mayor es el máximo absoluto; el menor,</text>
<text x="420" y="280" text-anchor="middle">el mínimo absoluto. Digo en qué puntos</text>
<path class="lin" d="M115 290 V313" marker-end="url(#fl)"/>
<text class="no" x="123" y="306">no</text>
<rect class="preg" x="10" y="316" width="210" height="76" rx="10"/>
<text x="115" y="349" text-anchor="middle">¿El dominio es abierto o</text>
<text x="115" y="367" text-anchor="middle">infinito: (a, b), (0, ∞), ℝ?</text>
<path class="lin" d="M220 354 H246" marker-end="url(#fl)"/>
<text class="si" x="225" y="349">sí</text>
<rect class="nodo" x="250" y="316" width="340" height="76" rx="10"/>
<text x="420" y="334" text-anchor="middle">Críticos, signo de f′ a cada lado y límites de f</text>
<text x="420" y="350" text-anchor="middle">en los bordes (L'Hôpital si hace falta). Puede</text>
<text x="420" y="366" text-anchor="middle">no haber máximo o mínimo: si f → ±∞ no hay;</text>
<text x="420" y="382" text-anchor="middle">si baja y luego sube, el crítico es el mínimo</text>
<path class="lin" d="M115 392 V415" marker-end="url(#fl)"/>
<text class="no" x="123" y="408">no</text>
<rect class="preg" x="10" y="418" width="210" height="76" rx="10"/>
<text x="115" y="451" text-anchor="middle">¿Piden clasificar un crítico</text>
<text x="115" y="469" text-anchor="middle">o los extremos relativos?</text>
<path class="lin" d="M220 456 H246" marker-end="url(#fl)"/>
<text class="si" x="225" y="451">sí</text>
<rect class="nodo" x="250" y="418" width="340" height="76" rx="10"/>
<text x="420" y="436" text-anchor="middle">1.ª derivada: ¿cambia de signo f′? (− a +: mín;</text>
<text x="420" y="452" text-anchor="middle">+ a −: máx; sin cambio: silla). 2.ª: f″(c)&gt;0 mín,</text>
<text x="420" y="468" text-anchor="middle">f″(c)<0 máx. Si f″(c)=0: primera derivada no</text>
<text x="420" y="484" text-anchor="middle">nula; orden par, extremo; impar, silla</text>
<path class="lin" d="M115 494 V517" marker-end="url(#fl)"/>
<text class="no" x="123" y="510">no</text>
<rect class="fin" x="10" y="520" width="580" height="76" rx="10"/>
<text x="300" y="546" text-anchor="middle">Respondo con palabras: dónde se alcanza y cuánto vale, relativo o absoluto.</text>
<text x="300" y="564" text-anchor="middle">Compruebo: ¿miré los bordes?, ¿y los puntos sin derivada?, ¿el dominio?,</text>
<text x="300" y="582" text-anchor="middle">¿valores de todas las variables? (en optimización)</text>
</svg>
