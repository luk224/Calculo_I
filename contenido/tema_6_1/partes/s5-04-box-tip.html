  <p>En Maxima, la integral definida de $f$ entre $a$ y $b$ es <code>integrate(f(x),x,a,b)</code> (U p.239); la indefinida, <code>integrate(f(x),x);</code>, con constante arbitraria $k=0$ por defecto (U pp.241-242).</p>
