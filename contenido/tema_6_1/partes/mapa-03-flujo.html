<svg class="flujo" viewBox="0 0 600 710" role="img" aria-labelledby="flujo-t flujo-d">
<title id="flujo-t">Mapa de decisión del tema 6.1: qué hacer según lo que piden sobre la integral de Riemann</title>
<desc id="flujo-d">Diagrama de flujo vertical. Si piden la finura de una partición, se restan puntos consecutivos. Si piden calcular con la definición, se usan sumas de Riemann con partición equiespaciada. Si piden calcular sin primitivas, se dibuja y se leen áreas con signo. Si es un verdadero o falso de propiedades, se compara con las propiedades y se busca un contraejemplo. Si piden acotar, se usa mínimo y máximo por la longitud. Si piden el comportamiento de una integral con límite variable, se usa que la derivada es el integrando. Al final se comprueba la respuesta.</desc>
<defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="preg" x="10" y="10" width="210" height="76" rx="10"/>
<text x="115" y="40" text-anchor="middle">¿Te dan una partición y piden la</text>
<text x="115" y="58" text-anchor="middle">finura, o construir una?</text>
<path class="lin" d="M220 48 H246" marker-end="url(#fl)"/>
<text class="si" x="225" y="43">sí</text>
<rect class="nodo" x="250" y="10" width="340" height="76" rx="10"/>
<text x="420" y="44" text-anchor="middle">Resto puntos consecutivos y tomo el mayor;</text>
<text x="420" y="64" text-anchor="middle">para construirla, un trozo del tamaño pedido.</text>
<path class="lin" d="M115 86 V109" marker-end="url(#fl)"/>
<text class="no" x="123" y="102">no</text>
<rect class="preg" x="10" y="112" width="210" height="76" rx="10"/>
<text x="115" y="142" text-anchor="middle">¿Piden calcular una integral con</text>
<text x="115" y="160" text-anchor="middle">sumas de Riemann (la definición)?</text>
<path class="lin" d="M220 150 H246" marker-end="url(#fl)"/>
<text class="si" x="225" y="145">sí</text>
<rect class="nodo" x="250" y="112" width="340" height="76" rx="10"/>
<text x="420" y="146" text-anchor="middle">$\Delta x=\frac{b-a}n$, $c_i=x_i=a+i\Delta x$, suma con</text>
<text x="420" y="166" text-anchor="middle">$\sum1,\sum i,\sum i^2$ y límite en $n$.</text>
<path class="lin" d="M115 188 V211" marker-end="url(#fl)"/>
<text class="no" x="123" y="204">no</text>
<rect class="preg" x="10" y="214" width="210" height="76" rx="10"/>
<text x="115" y="244" text-anchor="middle">¿Piden calcular una integral</text>
<text x="115" y="262" text-anchor="middle">sin primitivas, con una gráfica?</text>
<path class="lin" d="M220 252 H246" marker-end="url(#fl)"/>
<text class="si" x="225" y="247">sí</text>
<rect class="nodo" x="250" y="214" width="340" height="76" rx="10"/>
<text x="420" y="248" text-anchor="middle">Dibujo, parto donde cambia el signo y leo</text>
<text x="420" y="268" text-anchor="middle">triángulos o círculos con su signo (P5, P6).</text>
<path class="lin" d="M115 290 V313" marker-end="url(#fl)"/>
<text class="no" x="123" y="306">no</text>
<rect class="preg" x="10" y="316" width="210" height="76" rx="10"/>
<text x="115" y="346" text-anchor="middle">¿Es «siempre cierto» algo sobre</text>
<text x="115" y="364" text-anchor="middle">integrales, o dan datos de otras?</text>
<path class="lin" d="M220 354 H246" marker-end="url(#fl)"/>
<text class="si" x="225" y="349">sí</text>
<rect class="nodo" x="250" y="316" width="340" height="76" rx="10"/>
<text x="420" y="350" text-anchor="middle">Comparo con P0-P6; si no coincide, contraejemplo</text>
<text x="420" y="370" text-anchor="middle">con constantes ($1$ y $-1$) y compruebo ambos lados.</text>
<path class="lin" d="M115 392 V415" marker-end="url(#fl)"/>
<text class="no" x="123" y="408">no</text>
<rect class="preg" x="10" y="418" width="210" height="76" rx="10"/>
<text x="115" y="448" text-anchor="middle">¿Piden acotar o comparar una</text>
<text x="115" y="466" text-anchor="middle">integral sin calcularla?</text>
<path class="lin" d="M220 456 H246" marker-end="url(#fl)"/>
<text class="si" x="225" y="451">sí</text>
<rect class="nodo" x="250" y="418" width="340" height="76" rx="10"/>
<text x="420" y="452" text-anchor="middle">Mínimo $m$ y máximo $M$ de $f$:</text>
<text x="420" y="472" text-anchor="middle">$m(b-a)\le\int_a^bf\le M(b-a)$.</text>
<path class="lin" d="M115 494 V517" marker-end="url(#fl)"/>
<text class="no" x="123" y="510">no</text>
<rect class="preg" x="10" y="520" width="210" height="76" rx="10"/>
<text x="115" y="550" text-anchor="middle">¿Piden monotonía o extremos de</text>
<text x="115" y="568" text-anchor="middle">$F(x)=\int_0^xf$, o una primitiva?</text>
<path class="lin" d="M220 558 H246" marker-end="url(#fl)"/>
<text class="si" x="225" y="553">sí</text>
<rect class="nodo" x="250" y="520" width="340" height="76" rx="10"/>
<text x="420" y="554" text-anchor="middle">$F'=f$: $F$ sube donde $f\gt0$ y baja donde $f\lt0$;</text>
<text x="420" y="574" text-anchor="middle">primitiva: derivo y comparo con $f$.</text>
<path class="lin" d="M115 596 V619" marker-end="url(#fl)"/>
<text class="no" x="123" y="612">no</text>
<rect class="fin" x="10" y="622" width="580" height="76" rx="10"/>
<text x="300" y="648" text-anchor="middle">Respondo y compruebo:</text>
<text x="300" y="666" text-anchor="middle">¿puse la base $\Delta x$?, ¿el signo de cada trozo?,</text>
<text x="300" y="684" text-anchor="middle">¿el orden de los límites?, ¿un contraejemplo que de verdad falla?</text>
</svg>
