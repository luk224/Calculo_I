<ul class="trio">
  <li><b>Cómo lo reconoces:</b> «¿Es $F$ una primitiva de $f$?», «halla $\int f(x)\,dx$».</li>
  <li><b>Qué haces:</b> Derivas la candidata y comparas con $f$; si coincide, es primitiva y cualquier otra se diferencia en una constante $k$.</li>
  <li><b>Ejemplo mínimo:</b> $x^2-x$ es primitiva de $2x-1$ porque $(x^2-x)^{\prime}=2x-1$.</li>
</ul>
