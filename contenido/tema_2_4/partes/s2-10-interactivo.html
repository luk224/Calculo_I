  <figcaption>Interactivo propio. Por defecto es $g(x)=e^{-x}$ con $x_0=1$ (Ejercicio 2.38). La escalera (naranja) va en vertical hasta la curva $y=g(x)$ y en horizontal hasta la recta $y=x$: cada escalón es una iteración. Con la tercera función, mueve $m=g'(x^*)$: si $|m|&lt;1$ la escalera se cierra sobre el punto fijo (monótona si $m&gt;0$, en espiral si $m&lt;0$); si $|m|&gt;1$ se aleja. <span class="src" data-l="P" data-ref="Explicación propia; teoremas 2.2 y 2.3: U pp. 91-92">P</span></figcaption>
</figure>
