<div class="box def"><span class="h">Definición 2.4 (punto fijo)</span>
  <p>Dada una función $g$, $\tilde x$ es un <b>punto fijo</b> de $g$ si $g(\tilde x)=\tilde x$. Gráficamente: los puntos donde la gráfica de $g$ corta a la recta $y=x$. Calcular puntos fijos = resolver la ecuación $x=g(x)$.</p>
  <span class="src" data-l="U" data-ref="U Definición 2.4, p. 90">U p.90</span>
</div>
