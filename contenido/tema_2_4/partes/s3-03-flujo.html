<svg class="flujo" viewBox="0 0 460 484" role="img" aria-labelledby="flujo-t flujo-d">
<title id="flujo-t">Mapa de decisión: Newton, punto fijo o bisección</title>
<desc id="flujo-d">Diagrama de flujo vertical. Según la frase del enunciado: realizar n iteraciones, parar por tolerancia con el error relativo, comprobar la convergencia con el Teorema 2.2, garantizar un error con el Teorema 2.3 o con la bisección, y qué hacer si Newton se atasca.</desc>
<defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="preg" x="10" y="10" width="200" height="44" rx="10"/><text x="110" y="28" text-anchor="middle">¿Pide «realiza n</text><text x="110" y="46" text-anchor="middle">iteraciones»?</text>
<path class="lin" d="M210 32 H246" marker-end="url(#fl)"/><text class="si" x="215" y="27">sí</text>
<rect class="nodo" x="250" y="10" width="200" height="44" rx="10"/><text x="350" y="28" text-anchor="middle">Itero exactamente n veces</text><text x="350" y="46" text-anchor="middle">y doy x_n (tabla)</text>
<path class="lin" d="M110 54 V77" marker-end="url(#fl)"/><text class="no" x="118" y="70">no</text>
<rect class="preg" x="10" y="80" width="200" height="44" rx="10"/><text x="110" y="98" text-anchor="middle">¿Dice «hasta que el error</text><text x="110" y="116" text-anchor="middle">sea menor que…»?</text>
<path class="lin" d="M210 102 H246" marker-end="url(#fl)"/><text class="si" x="215" y="97">sí</text>
<rect class="nodo" x="250" y="80" width="200" height="44" rx="10"/><text x="350" y="98" text-anchor="middle">Newton con columna ε_r;</text><text x="350" y="116" text-anchor="middle">paro en la 1.ª fila que cumple</text>
<path class="lin" d="M110 124 V147" marker-end="url(#fl)"/><text class="no" x="118" y="140">no</text>
<rect class="preg" x="10" y="150" width="200" height="44" rx="10"/><text x="110" y="168" text-anchor="middle">¿Pide comprobar que el</text><text x="110" y="186" text-anchor="middle">punto fijo converge?</text>
<path class="lin" d="M210 172 H246" marker-end="url(#fl)"/><text class="si" x="215" y="167">sí</text>
<rect class="nodo" x="250" y="150" width="200" height="44" rx="10"/><text x="350" y="168" text-anchor="middle">Teorema 2.2 en [a,b]:</text><text x="350" y="186" text-anchor="middle">(H0), (H1) y (H2)</text>
<path class="lin" d="M110 194 V217" marker-end="url(#fl)"/><text class="no" x="118" y="210">no</text>
<rect class="preg" x="10" y="220" width="200" height="44" rx="10"/><text x="110" y="238" text-anchor="middle">¿Pide nº de iteraciones y</text><text x="110" y="256" text-anchor="middle">dan g con |g'| ≤ k &lt; 1?</text>
<path class="lin" d="M210 242 H246" marker-end="url(#fl)"/><text class="si" x="215" y="237">sí</text>
<rect class="nodo" x="250" y="220" width="200" height="44" rx="10"/><text x="350" y="238" text-anchor="middle">Menor n con (Teor. 2.3):</text><text x="350" y="256" text-anchor="middle">k^n(b−a)/(1−k) &lt; ε</text>
<path class="lin" d="M110 264 V287" marker-end="url(#fl)"/><text class="no" x="118" y="280">no</text>
<rect class="preg" x="10" y="290" width="200" height="44" rx="10"/><text x="110" y="308" text-anchor="middle">¿Pide nº de iteraciones y</text><text x="110" y="326" text-anchor="middle">solo hay cambio de signo?</text>
<path class="lin" d="M210 312 H246" marker-end="url(#fl)"/><text class="si" x="215" y="307">sí</text>
<rect class="nodo" x="250" y="290" width="200" height="44" rx="10"/><text x="350" y="308" text-anchor="middle">Bisección, menor n con:</text><text x="350" y="326" text-anchor="middle">(b−a)/2^n &lt; ε</text>
<path class="lin" d="M110 334 V357" marker-end="url(#fl)"/><text class="no" x="118" y="350">no</text>
<rect class="preg" x="10" y="360" width="200" height="44" rx="10"/><text x="110" y="378" text-anchor="middle">¿Newton se atasca (f'(xₙ)=0</text><text x="110" y="396" text-anchor="middle">o salta entre dos puntos)?</text>
<path class="lin" d="M210 382 H246" marker-end="url(#fl)"/><text class="si" x="215" y="377">sí</text>
<rect class="nada" x="250" y="360" width="200" height="44" rx="10"/><text x="350" y="378" text-anchor="middle">Otro x₀ (Bolzano) o</text><text x="350" y="396" text-anchor="middle">despejar otra g</text>
<path class="lin" d="M110 404 V427" marker-end="url(#fl)"/><text class="no" x="118" y="420">no</text>
<rect class="fin" x="10" y="430" width="200" height="44" rx="10"/><text x="110" y="448" text-anchor="middle">Itero con todas las cifras</text><text x="110" y="466" text-anchor="middle">y compruebo f(xₙ) ≈ 0</text>
</svg>
