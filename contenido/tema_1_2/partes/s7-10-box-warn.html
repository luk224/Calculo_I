  <p>«$1^\infty=1$» o «$0^0=1$» o «$\infty^0=1$»: <b>son indeterminaciones</b>. Y sustituir solo en una parte: $\left(1+\frac1n\right)^n\to1^\infty=1$ es falso; su límite es $e$ (apartado 9). También: aplicar (1.1) con $a_n$ que pueda ser $\le0$ ($\ln$ no está definido).</p>
