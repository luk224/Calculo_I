  <p>Cuatro «de operaciones» (p. 29): $\ \dfrac00,\quad\infty-\infty,\quad\pm\infty\cdot0,\quad\dfrac{\pm\infty}{\pm\infty}$.</p>
  <p>Y tres «de potencias» (p. 30), que llevan a $\pm\infty\cdot0$ mediante (1.1): $\ 0^0,\quad1^{\pm\infty},\quad\infty^0$.</p>
