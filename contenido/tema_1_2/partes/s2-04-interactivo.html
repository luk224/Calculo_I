  <figcaption>Interactivo propio: el juego del reto. Tú eliges $\varepsilon$ con el primer deslizador (la banda verde es $(L-\varepsilon,L+\varepsilon)$) y la escena calcula el primer $N$ tal que <b>todos</b> los términos desde $N$ están dentro (puntos verdes; los naranjas están fuera). Estrecha la banda: $N$ crece, pero para cualquier $\varepsilon$ existe. Con $a_n=\frac n{n+1}$ y $\varepsilon=0{,}1$ sale $N=9$ (los puntos huecos son los de $n=1,\dots,8$, fuera de la banda); con $(-1)^n/n$ los puntos saltan de un lado al otro y aun así entran en la banda. <span class="src" data-l="P" data-ref="Explicación propia; definición de límite de una sucesión: U Definición 1.10 p. 23">P</span></figcaption>
