<div class="box warn"><span class="h">Error típico</span>
  <p>Aplicar la técnica del número $e$ a algo que <b>no</b> es $1^\infty$ (p. ej. base que tiende a $\frac12$ o a $2$: entonces basta la Def. 1.12 y (1.1), ver <a href="#ej-1-14">Ejercicio 1.14</a>), o no conseguir que el exponente sea <b>el mismo</b> $a_n$ que aparece en $1+\frac1{a_n}$.</p>
</div>
