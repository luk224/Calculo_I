<div class="box ex"><span class="h">Ejemplo 1.16: sucesión constante</span>
  <p>Si $a_n=c$ para todo $n$, entonces $\lim_{n\to\infty} a_n=c$: dado $\varepsilon&gt;0$, $|a_n-c|=0&lt;\varepsilon$ para todo $n\in\mathbb N$ (sirve cualquier $N$).</p>

</div>
