<div class="box ex"><span class="h">Ejemplos de uso (L Ejemplo 9)</span>
  <ul>
    <li>$\{\frac1n\}$ es acotada y monótona: converge (a 0).</li>
    <li>$\left\{\frac{n^2}{n+1}\right\}$ es monótona pero <b>no acotada</b> (crece sin techo): diverge.</li>
    <li>$\{(-1)^n\}$ es acotada pero <b>no monótona</b>: diverge.</li>
  </ul>

</div>
