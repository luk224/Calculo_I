<svg class="flujo" viewBox="0 0 640 634" role="img" aria-labelledby="flujo-t flujo-d">
<title id="flujo-t">Mapa de decisión: qué tipo de límite de sucesión tengo y qué hago</title>
<desc id="flujo-d">Diagrama de flujo vertical con siete preguntas. Si es una potencia se estudian base y exponente y, si es 1 elevado a infinito, se usa el número e. Si es una suma de n términos se acota y se usa el emparedado o Stolz. Si hay un factor acotado se usa acotada por infinitésimo. Si es una resta de raíces se usa el conjugado. Si es un cociente infinito entre infinito se divide entre lo que domina. Si es una recurrencia o una sucesión monótona se prueba que es monótona y acotada y se pasa al límite en la recurrencia. Si piden razonar propiedades se usa un ejemplo o un teorema.</desc>
<defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="preg" x="10" y="10" width="220" height="50" rx="10"/>
<text x="120" y="32" text-anchor="middle">¿Es una POTENCIA</text><text x="120" y="50" text-anchor="middle">con n en base y exponente?</text>
<path class="lin" d="M230 35 H256" marker-end="url(#fl)"/><text class="si" x="235" y="30">sí</text>
<rect class="fin" x="260" y="4" width="370" height="62" rx="10"/>
<text x="445" y="23" text-anchor="middle">Miro base y exponente por separado.</text>
<text x="445" y="41" text-anchor="middle">Base→1 y exponente→±∞: e^(lím yₙ(xₙ−1)).</text>
<text x="445" y="59" text-anchor="middle">Otra base: x^∞ = 0 (0&lt;x&lt;1) o ∞ (x&gt;1).</text>
<path class="lin" d="M120 60 V89" marker-end="url(#fl)"/><text class="no" x="128" y="80">no</text>
<rect class="preg" x="10" y="92" width="220" height="50" rx="10"/>
<text x="120" y="114" text-anchor="middle">¿Una SUMA de n términos</text><text x="120" y="132" text-anchor="middle">(o un cociente con ella)?</text>
<path class="lin" d="M230 117 H256" marker-end="url(#fl)"/><text class="si" x="235" y="112">sí</text>
<rect class="fin" x="260" y="86" width="370" height="62" rx="10"/>
<text x="445" y="105" text-anchor="middle">Acoto cada término por el menor y el</text>
<text x="445" y="123" text-anchor="middle">mayor y uso el emparedado; o Stolz</text>
<text x="445" y="141" text-anchor="middle">si es suma/bₙ con bₙ creciente → ∞.</text>
<path class="lin" d="M120 142 V171" marker-end="url(#fl)"/><text class="no" x="128" y="162">no</text>
<rect class="preg" x="10" y="174" width="220" height="50" rx="10"/>
<text x="120" y="196" text-anchor="middle">¿Hay un factor ACOTADO</text><text x="120" y="214" text-anchor="middle">(seno, coseno…) y algo →0?</text>
<path class="lin" d="M230 199 H256" marker-end="url(#fl)"/><text class="si" x="235" y="194">sí</text>
<rect class="fin" x="260" y="168" width="370" height="62" rx="10"/>
<text x="445" y="187" text-anchor="middle">Acotada × infinitésimo → 0 (Teorema 1.2)</text>
<text x="445" y="205" text-anchor="middle">o emparedado: −c/n ≤ aₙ ≤ c/n.</text>
<text x="445" y="223" text-anchor="middle">No hace falta estudiar el interior.</text>
<path class="lin" d="M120 224 V253" marker-end="url(#fl)"/><text class="no" x="128" y="244">no</text>
<rect class="preg" x="10" y="256" width="220" height="50" rx="10"/>
<text x="120" y="278" text-anchor="middle">¿Una RESTA de raíces</text><text x="120" y="296" text-anchor="middle">(∞ − ∞)?</text>
<path class="lin" d="M230 281 H256" marker-end="url(#fl)"/><text class="si" x="235" y="276">sí</text>
<rect class="fin" x="260" y="250" width="370" height="62" rx="10"/>
<text x="445" y="269" text-anchor="middle">Multiplico y divido por el conjugado:</text>
<text x="445" y="287" text-anchor="middle">(A−B)(A+B) = A²−B².</text>
<text x="445" y="305" text-anchor="middle">Luego divido entre n y paso al límite.</text>
<path class="lin" d="M120 306 V335" marker-end="url(#fl)"/><text class="no" x="128" y="326">no</text>
<rect class="preg" x="10" y="338" width="220" height="50" rx="10"/>
<text x="120" y="360" text-anchor="middle">¿Cociente ∞/∞ de polinomios,</text><text x="120" y="378" text-anchor="middle">raíces o exponenciales?</text>
<path class="lin" d="M230 363 H256" marker-end="url(#fl)"/><text class="si" x="235" y="358">sí</text>
<rect class="fin" x="260" y="332" width="370" height="62" rx="10"/>
<text x="445" y="351" text-anchor="middle">Saco n de cada raíz (n = √n²) y divido</text>
<text x="445" y="369" text-anchor="middle">arriba y abajo entre lo que domina;</text>
<text x="445" y="387" text-anchor="middle">el resto tiende a 0 (álgebra de límites).</text>
<path class="lin" d="M120 388 V417" marker-end="url(#fl)"/><text class="no" x="128" y="408">no</text>
<rect class="preg" x="10" y="420" width="220" height="50" rx="10"/>
<text x="120" y="442" text-anchor="middle">¿Recurrencia o sucesión</text><text x="120" y="460" text-anchor="middle">creciente / decreciente?</text>
<path class="lin" d="M230 445 H256" marker-end="url(#fl)"/><text class="si" x="235" y="440">sí</text>
<rect class="fin" x="260" y="414" width="370" height="62" rx="10"/>
<text x="445" y="433" text-anchor="middle">Pruebo monotonía y cota (inducción):</text>
<text x="445" y="451" text-anchor="middle">Teorema 1.3 ⇒ converge; el valor sale de</text>
<text x="445" y="469" text-anchor="middle">L = g(L), descartando la raíz imposible.</text>
<path class="lin" d="M120 470 V499" marker-end="url(#fl)"/><text class="no" x="128" y="490">no</text>
<rect class="preg" x="10" y="502" width="220" height="50" rx="10"/>
<text x="120" y="524" text-anchor="middle">¿Piden razonar: converge,</text><text x="120" y="542" text-anchor="middle">acotada, «¿puede ocurrir…?»</text>
<path class="lin" d="M230 527 H256" marker-end="url(#fl)"/><text class="si" x="235" y="522">sí</text>
<rect class="fin" x="260" y="496" width="370" height="62" rx="10"/>
<text x="445" y="515" text-anchor="middle">Un ejemplo sencillo: (−1)ⁿ, n, 1/n.</text>
<text x="445" y="533" text-anchor="middle">O un teorema: convergente ⇒ acotada;</text>
<text x="445" y="551" text-anchor="middle">monótona y acotada ⇒ convergente.</text>
<path class="lin" d="M120 552 V581" marker-end="url(#fl)"/><text class="no" x="128" y="572">no</text>
<rect class="nada" x="10" y="584" width="620" height="40" rx="10"/><text x="320" y="609" text-anchor="middle">Relee el enunciado: casi todo lo que cae es uno de estos siete tipos</text>
</svg>
