<div class="box tip"><span class="h">Para comprobar con ordenador</span>
  <p>Con Maxima: la sucesión $\frac1n$ se define con <code>a[n]:=1/n</code> y el límite se calcula con <code>limit(a[n],n,inf)</code>; el factorial $7!$ se escribe <code>7!;</code>. Sirve para comprobar tus resultados, no para razonarlos.</p>
  <span class="src" data-l="U" data-ref="U §1.2.2, notas al margen sobre Maxima, p. 23 (límites) y p. 25 (factorial)">U pp.23-25</span>
</div>
