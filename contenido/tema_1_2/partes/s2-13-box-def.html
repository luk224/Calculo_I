<div class="box def"><span class="h">Sucesión divergente</span>
  <p>Una sucesión que <b>no converge</b> se llama <b>divergente</b>. Puede serlo de dos maneras: porque sus términos crecen (o decrecen) sin límite (límite $\pm\infty$, apartado 6) o porque <b>oscila</b> sin acercarse a nada, como $(-1)^n$.</p>
