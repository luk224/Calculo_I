<div class="box thm"><span class="h">Proposición 1.5</span>
  <p>Si $\lim_{n\to\infty} a_n=\pm\infty$, entonces
  $$\lim_{n\to\infty}\left(1+\frac1{a_n}\right)^{a_n}=e.$$
  (Con $a_n\to\pm\infty$ se tiene $|a_n|&gt;1$ desde cierto $n$, así que $1+\frac1{a_n}&gt;0$ y la potencia está definida.)</p>
