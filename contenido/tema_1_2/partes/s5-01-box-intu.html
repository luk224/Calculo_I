<div class="box intu"><span class="h">Idea intuitiva</span>
  <p>Si $a_n$ se aproxima a $l$ y $b_n$ a $m$, es natural que $a_n+b_n$ se aproxime a $l+m$, $a_nb_n$ a $lm$ y $\frac{a_n}{b_n}$ a $\frac lm$ (si $m\ne0$). Es la Proposición 1.3: permite calcular límites «por piezas», con una condición: <b>las piezas deben tener límite (finito)</b>.</p>
  <span class="src" data-l="U" data-ref="U §1.2.2, p. 26: «Operar con límites simplifica su cálculo»">U p.26</span>
</div>
