<div class="box ex"><span class="h">Ejemplo 1.18: $\lim_{n\to\infty}\frac1{n^2}=0$</span>
  <p>Para todo $n\in\mathbb N$, $0\le\frac1{n^2}\le\frac1n$. Como $\lim_{n\to\infty}0=0$ y $\lim_{n\to\infty}\frac1n=0$ (Ejemplos 1.16-1.17), la regla del emparedado da $\lim_{n\to\infty}\frac1{n^2}=0$.</p>
  <span class="src" data-l="U" data-ref="U Ejemplo 1.18, p. 25">U p.25</span>
</div>
