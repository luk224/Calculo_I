<p class="mismo"><i>Mismo método que el <a href="#ej-b1">Propio B1</a>.</i></p>
  <ol class="steps">
    <li>Con el conjugado queda $\dfrac{cn}{\sqrt{n^2+cn}+n}\to\dfrac c2$; imponemos $\frac c2=5$, luego $c=10$.</li>
    <li>Del mismo modo, $\lim_{n\to\infty}(\sqrt{n^2+3n}-\sqrt{n^2-n})=\dfrac{3-(-1)}2=2$.</li>
  </ol>
