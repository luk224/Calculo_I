<p class="mismo"><i>Mismo método que el <a href="#ej-a1">Propio A1</a>.</i></p>
  <ol class="steps">
    <li>Sale $\frac\infty\infty$. Domina $3^n$ (la exponencial de base mayor): dividimos entre $3^n$.</li>
    <li>$\dfrac{(2/3)^n+1}{3+(1/3)^n}\to\dfrac{0+1}{3+0}=\dfrac13$, porque $x^\infty=0$ para $x\in(0,1)$ (Def. 1.12). (sympy: $1/3$.)</li>
  </ol>
