<p class="mismo"><i>Mismo método que el <a href="#ej-b1">Propio B1</a>.</i></p>
  <ol class="steps">
    <li>Forma $\infty\cdot0$: la resta se hace pequeña y $\sqrt n$ grande. Se arregla con el conjugado.</li>
    <li>$\lim_{n\to\infty}\sqrt n\,(\sqrt{n+1}-\sqrt n)=\lim_{n\to\infty}\dfrac{\sqrt n}{\sqrt{n+1}+\sqrt n}=\lim_{n\to\infty}\dfrac1{\sqrt{1+1/n}+1}=\dfrac12$.</li>
  </ol>
