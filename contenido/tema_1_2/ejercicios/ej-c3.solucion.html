<p class="mismo"><i>Mismo método que el <a href="#ej-c1">Propio C1</a>.</i></p>
  <ol class="steps">
    <li>Se cumple $3^n\le2^n+3^n\le2\cdot3^n$. Como $x\mapsto x^{1/n}$ es creciente, $3\le a_n\le3\cdot2^{1/n}$.</li>
    <li>$2^{1/n}=e^{(\ln2)/n}\to e^0=1$ por (1.1). Emparedado: $\lim_{n\to\infty}\sqrt[n]{2^n+3^n}=3$.</li>
  </ol>
