<div class="recipe"><b>Receta:</b> divide arriba y abajo entre el término que domina (el de mayor grado o la exponencial de base mayor).</div>
  <ol class="steps">
    <li>Sale $\frac\infty\infty$. Manda $n^2$ en los dos: dividimos entre $n^2$.</li>
    <li>$\dfrac{3n^2-n+2}{5n^2+4}=\dfrac{3-\frac1n+\frac2{n^2}}{5+\frac4{n^2}}\to\dfrac35$. (sympy: $3/5$.)</li>
  </ol>
