<div class="box def"><span class="h">Definiciones 4.5, 4.6 y 4.7</span>
  <p>$f:D\subset\mathbb R^2\to\mathbb R$ es <b>continua en $(a,b)\in D$</b> si $\displaystyle\lim_{(x,y)\to(a,b)}f(x,y)=f(a,b)$; <b>discontinua</b> en $(a,b)$ si no lo es; y <b>continua en $A\subset D$</b> si lo es en cada punto de $A$. Igual para $n$ variables.</p>
  <span class="src" data-l="U" data-ref="U Definiciones 4.5-4.7, p. 166">U p.166</span>
</div>
