  <figcaption>Interactivo propio. Arrastra para girar la superficie y usa la rueda (o el pellizco) para acercar. El plano naranja es $z=c$: su corte con la superficie (línea naranja) es la <b>traza</b>, y su proyección sobre el suelo (línea verde) es la <b>curva de nivel</b> $f(x,y)=c$. Mueve $c$ y mira cómo pasa de vacía a un punto y luego a curvas cada vez mayores; con la silla $x^2-y^2$ cambia de hipérbolas a otras hipérbolas pasando por un par de rectas. <span class="src" data-l="P" data-ref="Explicación propia; gráfica, trazas y curvas de nivel: U §4.2.2 pp. 155-157, Fig. 4.10 y Ej. 4.11">P</span></figcaption>
