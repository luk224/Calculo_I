<div class="box thm"><span class="h">Álgebra de límites</span>
  <p>Si $\lim_{(x,y)\to(a,b)}f(x,y)=l$ y $\lim_{(x,y)\to(a,b)}g(x,y)=m$, entonces $\lim_{(x,y)\to(a,b)}cf=cl$, $\lim_{(x,y)\to(a,b)}(f+g)=l+m$, $\lim_{(x,y)\to(a,b)}fg=lm$ y $\lim_{(x,y)\to(a,b)}\frac fg=\frac lm$ si $m\ne0$.</p>
  <span class="src" data-l="U" data-ref="U Álgebra de límites, p. 160">U p.160</span>
</div>
