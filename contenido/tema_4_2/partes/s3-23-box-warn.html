<div class="box warn"><span class="h">La trampa de las polares</span><span class="src" data-l="P" data-ref="Aviso propio (ver Propio 3) sobre el caso 3 de U p. 165">P</span>
  <p>Que $F\to0$ para <b>cada $\theta$ fijo</b> equivale a probar solo las rectas y <b>no</b> basta: hace falta una cota $h(\rho)$ <b>sin $\theta$</b> (Propio 3: $F\to0$ por cada rayo y el límite no existe). Si el punto no es el origen, las polares van <b>centradas en $(a,b)$</b> (Propio 4).</p>
</div>
