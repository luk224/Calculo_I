<div class="box ex"><span class="h">Ejemplo 4.9 de U · polinomio</span>
  <p>$f(x,y)=2x^2+3y^4$. Es un polinomio: dominio $\mathbb R^2$. Como $x^2\ge0$ e $y^4\ge0$, $f\ge0$; y $f(x,0)=2x^2$ toma todos los valores $\ge0$. Imagen: $[0,\infty)$.</p>
