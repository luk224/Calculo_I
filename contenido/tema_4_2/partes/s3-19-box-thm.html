<div class="box thm"><span class="h">Infinitésimo por acotada</span>
  <p>Si $\lim_{(x,y)\to(a,b)}f(x,y)=0$ y $g$ está acotada en los puntos de su dominio de algún disco centrado en $(a,b)$, entonces $\lim_{(x,y)\to(a,b)}f(x,y)g(x,y)=0$. (Se usa en el Ej. 4.22 de E.)</p>
  <span class="src" data-l="U" data-ref="U Propiedad, p. 165">U p.165</span>
</div>
