<div class="box thm"><span class="h">Regla del emparedado</span>
  <p>Si $\displaystyle\lim_{(x,y)\to(a,b)}g(x,y)=\lim_{(x,y)\to(a,b)}h(x,y)=l$ y $g\le f\le h$ en los puntos del dominio de algún disco centrado en $(a,b)$, entonces $\displaystyle\lim_{(x,y)\to(a,b)}f(x,y)=l$.</p>
  <span class="src" data-l="U" data-ref="U Regla del emparedado, p. 163">U p.163</span>
</div>
