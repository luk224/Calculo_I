<p>Léelo de arriba abajo: en cada pregunta, «no» baja a la siguiente y «sí» te lleva a la acción de la derecha. Lo que más puntos se pierde: <b>concluir que un límite existe</b> porque las rectas coinciden, olvidar <b>qué bordes entran</b> en el dominio y no comparar el límite con <b>$f(a,b)$</b> en la continuidad.</p>
