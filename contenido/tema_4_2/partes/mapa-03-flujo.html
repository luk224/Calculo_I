<svg class="flujo" viewBox="0 0 600 504" role="img" aria-labelledby="flujo-t flujo-d">
<title id="flujo-t">Mapa de decisión del tema 4.2: qué hacer según lo que piden sobre una función de dos variables</title>
<desc id="flujo-d">Diagrama de flujo vertical. Si piden el dominio o la imagen, se escribe una condición por pieza y se intersecan, y para la imagen se busca una cota y un camino que la alcance. Si piden curvas de nivel, se iguala f a k, se despeja y se discute el signo de k. Si piden un límite, se prueban caminos para refutar y, si coinciden, se demuestra con polares o emparedado. Si piden continuidad, se usan las operaciones fuera del punto y se compara el límite con el valor en el punto. Al final se comprueba la respuesta.</desc>
<defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="preg" x="10" y="10" width="210" height="76" rx="10"/>
<text x="115" y="44" text-anchor="middle">¿Piden el dominio o</text>
<text x="115" y="62" text-anchor="middle">la imagen de f?</text>
<path class="lin" d="M220 48 H246" marker-end="url(#fl)"/>
<text class="si" x="225" y="43">sí</text>
<rect class="nodo" x="250" y="10" width="340" height="76" rx="10"/>
<text x="420" y="36" text-anchor="middle">Dominio: una condición por pieza e intersección.</text>
<text x="420" y="54" text-anchor="middle">Imagen: cota y un camino del dominio que la recorra.</text>
<text x="420" y="72" text-anchor="middle">Digo qué bordes entran (≤ sí, &lt; no).</text>
<path class="lin" d="M115 86 V109" marker-end="url(#fl)"/>
<text class="no" x="123" y="102">no</text>
<rect class="preg" x="10" y="112" width="210" height="76" rx="10"/>
<text x="115" y="146" text-anchor="middle">¿Piden las curvas</text>
<text x="115" y="164" text-anchor="middle">de nivel?</text>
<path class="lin" d="M220 150 H246" marker-end="url(#fl)"/>
<text class="si" x="225" y="145">sí</text>
<rect class="nodo" x="250" y="112" width="340" height="76" rx="10"/>
<text x="420" y="138" text-anchor="middle">Igualo f(x,y) = k y despejo.</text>
<text x="420" y="156" text-anchor="middle">Discuto el signo de k: circunferencia, punto o vacío.</text>
<text x="420" y="174" text-anchor="middle">Dibujo varias; no se cortan entre sí.</text>
<path class="lin" d="M115 188 V211" marker-end="url(#fl)"/>
<text class="no" x="123" y="204">no</text>
<rect class="preg" x="10" y="214" width="210" height="76" rx="10"/>
<text x="115" y="248" text-anchor="middle">¿Piden un límite</text>
<text x="115" y="266" text-anchor="middle">en un punto?</text>
<path class="lin" d="M220 252 H246" marker-end="url(#fl)"/>
<text class="si" x="225" y="247">sí</text>
<rect class="nodo" x="250" y="214" width="340" height="76" rx="10"/>
<text x="420" y="240" text-anchor="middle">Sustituyo; si sale 0/0, pruebo ejes y rectas y=mx.</text>
<text x="420" y="258" text-anchor="middle">Si dos caminos difieren: no existe. Si todos coinciden,</text>
<text x="420" y="276" text-anchor="middle">demuestro con polares (h(ρ) sin θ) o emparedado.</text>
<path class="lin" d="M115 290 V313" marker-end="url(#fl)"/>
<text class="no" x="123" y="306">no</text>
<rect class="preg" x="10" y="316" width="210" height="76" rx="10"/>
<text x="115" y="350" text-anchor="middle">¿Piden la continuidad</text>
<text x="115" y="368" text-anchor="middle">de f?</text>
<path class="lin" d="M220 354 H246" marker-end="url(#fl)"/>
<text class="si" x="225" y="349">sí</text>
<rect class="nodo" x="250" y="316" width="340" height="76" rx="10"/>
<text x="420" y="342" text-anchor="middle">Fuera del punto: operaciones de continuas.</text>
<text x="420" y="360" text-anchor="middle">En el punto: ¿límite = f(a,b)?</text>
<text x="420" y="378" text-anchor="middle">Si el límite no existe o no vale f(a,b): discontinua.</text>
<path class="lin" d="M115 392 V415" marker-end="url(#fl)"/>
<text class="no" x="123" y="408">no</text>
<rect class="fin" x="10" y="418" width="580" height="76" rx="10"/>
<text x="300" y="444" text-anchor="middle">Respondo con palabras y dibujo si lo piden.</text>
<text x="300" y="462" text-anchor="middle">Compruebo: ¿bordes del dominio?, ¿k negativa = vacío?,</text>
<text x="300" y="480" text-anchor="middle">¿cota sin θ?, ¿límite = f(a,b)?</text>
</svg>
