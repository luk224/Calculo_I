  <figcaption>Interactivo propio. Desliza el punto $x$: la tangente (naranja) gira. Donde $f''&gt;0$ la curva queda <b>por encima</b> de la tangente (convexa) y la pendiente $f'$ <b>crece</b>; donde $f''&lt;0$ queda por debajo (cóncava) y $f'$ decrece. Los puntos verdes son los puntos de inflexión, donde $f''$ cambia de signo y la tangente atraviesa la curva. Con $x^4$ en $0$ se anula $f''$ pero no cambia de signo: no hay inflexión. <span class="src" data-l="P" data-ref="Explicación propia; Proposiciones 3.9 y 3.10: U p. 136; puntos de inflexión: U §3.5.3">P</span></figcaption>
</figure>
