<div class="box thm"><span class="h">Proposición 3.9 · convexidad y derivada primera</span>
  <p>Sea $f$ derivable en $I$. Entonces: $f$ es <b>convexa</b> en $I$ si y sólo si $f'$ es <b>creciente</b> en $I$; $f$ es <b>cóncava</b> en $I$ si y sólo si $f'$ es <b>decreciente</b> en $I$.</p>
