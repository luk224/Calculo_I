<svg class="flujo" viewBox="0 0 600 508" role="img" aria-labelledby="flujo-t flujo-d">
<title id="flujo-t">Mapa de decisión: qué hacer según lo que piden sobre concavidad, inflexiones y estudio de una función</title>
<desc id="flujo-d">Diagrama de flujo vertical. Si dan la gráfica de la derivada o de la segunda derivada, se lee la curvatura en ella. Si piden decidir si un punto es de inflexión, se comprueba que está en el dominio y que la segunda derivada cambia de signo. Si piden un estudio completo o asíntotas, se calculan dominio, asíntotas, signos de la primera y de la segunda derivada y se dibuja. Si piden intervalos de concavidad y convexidad de una fórmula, se calcula la segunda derivada, se factoriza y se hace la tabla de signos. Al final se responde con intervalos separados y puntos del dominio.</desc>
<defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="preg" x="10" y="10" width="210" height="76" rx="10"/>
<text x="115" y="39" text-anchor="middle">¿Te dan la gráfica de f′</text>
<text x="115" y="57" text-anchor="middle">o de f″ (en vez de la fórmula)?</text>
<path class="lin" d="M220 48 H246" marker-end="url(#fl)"/>
<text class="si" x="225" y="43">sí</text>
<rect class="nodo" x="250" y="10" width="340" height="76" rx="10"/>
<text x="420" y="28" text-anchor="middle">Gráfica de f″: sobre el eje, f convexa; bajo el</text>
<text x="420" y="44" text-anchor="middle">eje, cóncava; los cortes con el eje (con cambio</text>
<text x="420" y="60" text-anchor="middle">de signo) son las inflexiones. Gráfica de f′:</text>
<text x="420" y="76" text-anchor="middle">creciente = convexa; extremos de f′ = inflexión</text>
<path class="lin" d="M115 86 V109" marker-end="url(#fl)"/>
<text class="no" x="123" y="102">no</text>
<rect class="preg" x="10" y="112" width="210" height="76" rx="10"/>
<text x="115" y="141" text-anchor="middle">¿Piden decidir si un punto c</text>
<text x="115" y="159" text-anchor="middle">concreto es de inflexión?</text>
<path class="lin" d="M220 150 H246" marker-end="url(#fl)"/>
<text class="si" x="225" y="145">sí</text>
<rect class="nodo" x="250" y="112" width="340" height="76" rx="10"/>
<text x="420" y="130" text-anchor="middle">Compruebo que c es del dominio y que f″ cambia</text>
<text x="420" y="146" text-anchor="middle">de signo en c. Control con la Prop. 3.12: f″(c)=0</text>
<text x="420" y="162" text-anchor="middle">y primera derivada no nula de orden impar.</text>
<text x="420" y="178" text-anchor="middle">Si f″(c)=0 sin cambio de signo: no hay</text>
<path class="lin" d="M115 188 V211" marker-end="url(#fl)"/>
<text class="no" x="123" y="204">no</text>
<rect class="preg" x="10" y="214" width="210" height="76" rx="10"/>
<text x="115" y="243" text-anchor="middle">¿Piden estudiar y dibujar la</text>
<text x="115" y="261" text-anchor="middle">función, o sus asíntotas?</text>
<path class="lin" d="M220 252 H246" marker-end="url(#fl)"/>
<text class="si" x="225" y="247">sí</text>
<rect class="nodo" x="250" y="214" width="340" height="76" rx="10"/>
<text x="420" y="232" text-anchor="middle">Dominio y cortes; asíntotas (límites laterales,</text>
<text x="420" y="248" text-anchor="middle">m y b); signo de f′ y de f″ en una sola tabla,</text>
<text x="420" y="264" text-anchor="middle">partida también en los puntos fuera del dominio;</text>
<text x="420" y="280" text-anchor="middle">esbozo con extremos e inflexiones marcados</text>
<path class="lin" d="M115 290 V313" marker-end="url(#fl)"/>
<text class="no" x="123" y="306">no</text>
<rect class="preg" x="10" y="316" width="210" height="76" rx="10"/>
<text x="115" y="345" text-anchor="middle">¿Piden «¿cuándo es cóncava y</text>
<text x="115" y="363" text-anchor="middle">cuándo convexa?» de una fórmula?</text>
<path class="lin" d="M220 354 H246" marker-end="url(#fl)"/>
<text class="si" x="225" y="349">sí</text>
<rect class="nodo" x="250" y="316" width="340" height="76" rx="10"/>
<text x="420" y="334" text-anchor="middle">f″, la factorizo y hago la tabla de signos con un</text>
<text x="420" y="350" text-anchor="middle">punto de prueba por intervalo. f″≥0: convexa;</text>
<text x="420" y="366" text-anchor="middle">f″≤0: cóncava. Escribo cada intervalo por</text>
<text x="420" y="382" text-anchor="middle">separado (sin unir con ∪)</text>
<path class="lin" d="M115 392 V415" marker-end="url(#fl)"/>
<text class="no" x="123" y="408">no</text>
<rect class="fin" x="10" y="418" width="580" height="76" rx="10"/>
<text x="300" y="440" text-anchor="middle">Respondo con palabras: cada intervalo por separado, las inflexiones</text>
<text x="300" y="456" text-anchor="middle">como puntos (x, f(x)) del dominio y, si dibujo, extremos e inflexiones marcados.</text>
<text x="300" y="472" text-anchor="middle">Compruebo: ¿partí en los puntos fuera del dominio?, ¿f″(c)=0 sin cambio de signo?,</text>
<text x="300" y="488" text-anchor="middle">¿f″ existe en c? (valor absoluto, raíz): si no, decido con la definición</text>
</svg>
