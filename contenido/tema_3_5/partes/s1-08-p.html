<p><i>Matiz:</i> las desigualdades son no estrictas, así que una recta (o una constante) es a la vez convexa y cóncava. Y la convexidad se predica de un <b>intervalo</b>: no existe «convexa en $(-\infty,-2)\cup(2,\infty)$», se dice «convexa en $(-\infty,-2)$ y en $(2,\infty)$» (X 2018, apartado 2).</p>
