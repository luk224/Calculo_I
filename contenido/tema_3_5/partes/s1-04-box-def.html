<div class="box def"><span class="h">Definición 3.9 · función cóncava</span>
  <p>$f:D\to\mathbb R$ es <b>cóncava</b> en un intervalo $I\subset D$ si $-f$ es convexa en $I$. Equivale a la desigualdad contraria: $f((1-t)x+ty)\ge(1-t)f(x)+tf(y)$ (gráfica por encima de la cuerda). Intuitivamente, forma de $\cap$.</p>
  <span class="src" data-l="U" data-ref="U §3.5.2 Definición 3.9, p. 135">U p.135</span>
</div>
