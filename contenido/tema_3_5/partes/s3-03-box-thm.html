<div class="box thm"><span class="h">Proposición 3.11 · condición necesaria</span>
  <p>Si $f$ es dos veces derivable en $I$ y $c\in I$ es un punto de inflexión para $f$, entonces $f''(c)=0$. <b>El recíproco es falso</b>: $f''(c)=0$ es solo un <i>candidato</i> (ver $x^4$ abajo).</p>

</div>
